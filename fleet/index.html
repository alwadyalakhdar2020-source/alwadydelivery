<meta charset="utf-8">
<title>الوادي الأخضر — حركة السيارات والتوصيل</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<!--wady-brand--><script src="../brand/wady-brand.js"></script><meta name="theme-color" content="#051D48"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الوادي الأخضر"><link rel="apple-touch-icon" href="../brand/icon-180.png"><!--/wady-brand--><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: navy command bar + tabbed workspace; summary → detail, entry screens built for phones */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#0B1B33; --muted:#5A6A82; --line:#E0E6EF;
  --navy:#051D48; --navy-ink:#051D48; --green:#38AC57; --orange:#F39235; --blue:#34BEF0; --lime:#8FC153; --red:#D64545; --amber:#E6B400;
  --chip-good:#E3F4E8; --chip-bad:#FBE5E5; --chip-warn:#FFF3D6; --chip-info:#E2F5FD;
  --font:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1C30; --surface-2:#132339; --ink:#E7EDF6; --muted:#93A3BA; --line:#22324B;
  --navy-ink:#9DB8F0; --chip-good:#173826; --chip-bad:#3D1C1F; --chip-warn:#3A3115; --chip-info:#123545; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C30; --surface-2:#132339; --ink:#E7EDF6; --muted:#93A3BA; --line:#22324B;
  --navy-ink:#9DB8F0; --chip-good:#173826; --chip-bad:#3D1C1F; --chip-warn:#3A3115; --chip-info:#123545; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
body{direction:rtl;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(5,29,72,.25)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand b{font-size:20px;font-weight:800;letter-spacing:.2px}
.brand span{font-size:12px;color:#B9C7E0}
.sync{font-size:12px;color:#B9C7E0;display:inline-flex;gap:6px;align-items:center} .sync.ok{color:#9FE0B2} .sync.bad{color:#FFC2C2;font-weight:700}
.sync .btn{color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{color:#D3DDF0;background:transparent;border:0;padding:8px 13px;border-radius:999px;font-weight:500;white-space:nowrap;font-size:14px;cursor:pointer;flex:none}
nav.tabs button:hover{background:rgba(255,255,255,.08)}
nav.tabs button[aria-current="page"]{background:#fff;color:var(--navy);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main .wrap{padding-block:18px;display:grid;gap:16px}
main .wrap>*,section>*{min-width:0}
section{display:grid;gap:16px;min-width:0}
.notice{border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.info{background:var(--chip-info)} .notice.warn{background:var(--chip-warn)} .notice.bad{background:var(--chip-bad)}
.notice button{margin-inline-start:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:16px;margin:0 0 12px;font-weight:700;color:var(--navy-ink);display:flex;align-items:center;gap:8px;text-wrap:balance}
.panel h2 .q{font-size:12px;font-weight:500;color:var(--muted)}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:12px;font-weight:800;flex:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;align-items:end}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=month],input[type=text],input[type=number]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--navy-ink)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.scope{font-size:13px;color:var(--muted)} .scope b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;border-top:3px solid var(--c,var(--navy))}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--ink));line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d.up{color:var(--green);font-weight:700} .kpi .d.down{color:var(--red);font-weight:700}
.kpi.star{background:linear-gradient(180deg,var(--chip-info),var(--surface) 60%)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ممتاز{background:var(--chip-good);color:var(--green)} .pill.جيد{background:var(--chip-info);color:#1B87B3}
.pill.مقبول{background:var(--chip-warn);color:#A87800} .pill.ضعيف{background:var(--chip-bad);color:var(--red)}
.insights{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.insights li{padding:8px 12px;border-inline-start:3px solid var(--blue);background:var(--surface-2);border-radius:6px;font-size:14px;line-height:1.6}
.insights li.alert{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{position:relative;height:300px}
.chart.tall{height:420px}
.empty{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:12px;position:sticky;top:0}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
td.txt,th.txt{text-align:right}
tr.tot td{font-weight:800;background:var(--surface-2)}
td.neg{color:var(--red);font-weight:700} td.pos{color:var(--green);font-weight:700}
a.lnk{color:var(--navy-ink);font-weight:700;text-decoration:none;cursor:pointer} a.lnk:hover{text-decoration:underline}
/* heatmap */
.hm{display:grid;gap:2px;font-size:11px;min-width:max-content}
.hm .h{color:var(--muted);text-align:center;font-weight:700}
.hm .h.fri{color:var(--orange)}
.hm .n{text-align:right;padding-inline-end:8px;white-space:nowrap;font-weight:700;font-size:12px;position:sticky;right:0;background:var(--surface)}
.hm .n small{color:var(--muted);font-weight:500}
.hm .c{height:22px;border-radius:3px;display:grid;place-items:center;font-size:10px;color:#1b2b1b;min-width:26px}
.hm .c.miss{background:var(--line);color:var(--muted);font-weight:800}
.hm .c.off{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}
/* entry */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
@media (max-width:400px){.cards{grid-template-columns:1fr}}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;border-inline-start:4px solid var(--line)}
.vc.ok{border-inline-start-color:var(--green)} .vc.short{border-inline-start-color:var(--red)} .vc.none{border-inline-start-color:var(--line)} .vc.off{opacity:.7}
.vc .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vc .plate{font-weight:800;font-size:16px}
.vc .meta{font-size:12px;color:var(--muted);flex-basis:100%}
.vc .res{margin-inline-start:auto;text-align:left;font-variant-numeric:tabular-nums}
.vc .res b{font-size:20px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:10px 8px;align-items:end}
.fld{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.fld .w{font-size:11px;color:var(--muted)}
.stp{display:grid;grid-template-columns:44px 1fr 44px;min-height:44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.stp button{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--navy-ink);font-weight:700;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stp button:active{background:var(--line)}
.stp button:hover{background:var(--line)}
.stp input{border:0;border-radius:0;text-align:center;background:transparent;padding:6px 2px;-moz-appearance:textfield;font-weight:700;font-variant-numeric:tabular-nums}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.reasons{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.reasons .t{font-size:12px;font-weight:700;color:var(--red)}
.save{font-size:12px;color:var(--muted)} .save.ok{color:var(--green)} .save.err{color:var(--red)}
.sum-strip{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)} .sum-strip b{color:var(--ink);font-size:15px}
/* vehicle log */
.log td input{width:58px;padding:4px;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
.log td input.note{width:160px;text-align:right}
.log tr.fri td{background:color-mix(in srgb,var(--orange) 8%,transparent)}
.log tr.hol td{color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
.code{display:inline-block;font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.loc{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);display:grid;gap:8px;align-content:start}
.loc .lh{display:flex;align-items:center;gap:8px} .loc .lh b{font-size:15px} .loc .cnt{margin-inline-start:auto;background:var(--navy);color:#fff;border-radius:999px;padding:1px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.loc.miss .cnt{background:var(--red)} .loc.idle .cnt{background:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer}
.chip button{border:0;background:transparent;color:var(--red);font-weight:800;cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.plrow{display:grid;gap:6px}
.searchbox{position:relative} .searchbox input{padding-inline-start:34px} .searchbox::before{content:"⌕";position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
details.pnl>summary{cursor:pointer;font-weight:700;color:var(--navy-ink);list-style:none} details.pnl>summary::-webkit-details-marker{display:none}
details.pnl>summary::after{content:" ▾";color:var(--muted)} details.pnl:not([open])>summary::after{content:" ◂"}
.who{font-size:11px;color:var(--muted)} .who b{color:var(--ink);font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
button,a,select,input{touch-action:manipulation}
@media (max-width:700px){
  input,select,textarea{font-size:16px!important}
  .brand #who{display:none}
  .bar .wrap{gap:8px;padding-block:8px}
  nav.tabs{width:100%;mask-image:linear-gradient(to left,#000 85%,transparent);-webkit-mask-image:linear-gradient(to left,#000 85%,transparent)}
  .kpi .v{font-size:22px}
  .panel{padding:12px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fld>span:first-child{min-height:2.6em;display:flex;align-items:flex-end;line-height:1.3}
  .log td input{width:64px} .log td input.note{width:150px}
  .chart{height:260px} .chart.tall{height:380px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== delivery planning module ===== */
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.primary.danger{background:var(--red);color:#fff}
h3.sub{font-size:14px;margin:14px 0 8px;color:var(--navy-ink)}
textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font:inherit;color:inherit;resize:vertical}
input[type=time],input[type=password]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.st.info{background:var(--chip-info);border-color:transparent;color:#1B6F93} .st.warn{background:var(--chip-warn);border-color:transparent;color:#8A6400}
.st.bad{background:var(--chip-bad);border-color:transparent;color:var(--red)} .st.good{background:var(--chip-good);border-color:transparent;color:#23803D}
.st.blue{background:var(--blue);border-color:transparent;color:#05293A} .st.done{background:var(--green);border-color:transparent;color:#fff} .st.mute{color:var(--muted)}
.cls{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:800;border:1px solid var(--line)}
.cls.n{background:var(--chip-good);color:#23803D;border-color:transparent} .cls.f{background:var(--chip-warn);color:#8A6400;border-color:transparent}
.cls.j{background:var(--chip-bad);color:var(--red);border-color:transparent} .cls.unk{color:var(--muted);border-style:dashed}
.reason{color:#A35A00} :root[data-theme="dark"] .reason{color:#F3B26B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .reason{color:#F3B26B}}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:12px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;border-inline-start:4px solid var(--line);align-content:start}
.oc.st-reserve{border-inline-start-color:var(--red)} .oc.st-assigned,.oc.st-in_progress{border-inline-start-color:var(--green)} .oc.st-delivered{border-inline-start-color:var(--green);opacity:.85}
.oc.st-pending,.oc.st-new{border-inline-start-color:var(--orange)} .oc.st-cancelled{opacity:.6}
.oc .oh{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .oc .so{font-size:15px;font-weight:800} .oc .br{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:700}
.oc .ob{display:grid;gap:3px;font-size:14px} .oc .oa{display:flex;gap:6px;flex-wrap:wrap}
.oform .items{display:grid;gap:8px;margin-bottom:8px}
.oform .item{display:grid;grid-template-columns:minmax(0,3fr) minmax(70px,1fr) minmax(70px,1fr) auto;gap:6px;align-items:center}
@media (max-width:560px){.oform .item{grid-template-columns:minmax(0,1fr) 80px 70px auto}}
/* planning board */
.board{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.pool{display:grid;gap:12px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:900px){.pool{position:static;max-height:none}}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px;align-items:start}
.lane{display:grid;gap:8px;padding:12px} .lane.off{opacity:.55} .lane.over{border-color:var(--red)}
.lane .lh{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .lane .lh b{font-size:15px}
.lane .sched{margin-inline-start:auto;display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.capbar{position:relative;height:20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.capbar i{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--green) 55%,transparent)}
.lane.over .capbar i{background:color-mix(in srgb,var(--red) 55%,transparent)}
.capbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:700;line-height:18px}
.capbar.big{height:26px} .capbar.big span{line-height:24px}
.trip{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);display:grid;gap:6px}
.trip.closed{opacity:.8} .trip .th{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .trip .ta{margin-inline-start:auto;display:flex;gap:4px}
.chips-col{display:grid;gap:6px}
.ochip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.ochip[draggable=true]{cursor:grab} .ochip.locked{cursor:default;opacity:.75}
.ochip .so{font-weight:800} .ochip .cn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.ochip .meta{flex-basis:100%;font-size:11px;color:var(--muted)} .ochip .meta.reason{color:#A35A00}
.ochip.sel{outline:2px solid var(--orange);outline-offset:1px;background:var(--chip-warn)}
.ochip.st-reserve{border-inline-start:3px solid var(--red)} .ochip.st-delivered{border-inline-start:3px solid var(--green)} .ochip.dragging{opacity:.4}
.dz{border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.dzover,.trip.dzover{border-color:var(--orange)!important;background:var(--chip-warn)!important}
/* modal, toast, login */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,35,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{width:min(760px,100%)} .modal h3{margin:0;font-size:17px;color:var(--navy-ink)} .modal .mb{display:grid;gap:10px}
.hist{display:grid;gap:8px} .hi{border-inline-start:3px solid var(--blue);padding:6px 10px;background:var(--surface-2);border-radius:6px;display:grid;gap:3px}
.hi .hh{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

<script>
"use strict";
/* ============ CALC ENGINE (pure) ============ */
const DEFAULT_CFG = {
  managers:{"مكة":"","عسفان":""},
  thresholds:[1,0.9,0.75],
  rules:{"ونش|مكة":{d:5,fr:1,w:[1,2,3]},"ونش|عسفان":{d:3,fr:1,w:[1,2,null]},"سطحة|مكة":{d:3,fr:1,w:[1,1,2]},"سطحة|عسفان":{d:3,fr:1,w:[1,2,null]}},
  trailer:{one:3,two:2}, friMode:"worked",
  reasons:[{name:"أعطال",cls:"داخلي"},{name:"تأخر في الموقع",cls:"خارجي"},{name:"عدم وجود ردود",cls:"خارجي"}],
  holidays:[],
  extReasons:["عجز في عدد السيارات أمام الطلب","سيارة الشركة معطلة","ذروة طلبيات","موقع بعيد","عدم توفر سائق","طلب العميل"]
};
const BRANCHES=["مكة","عسفان"];
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const dOf=iso=>new Date(iso+"T00:00:00Z");
const addDays=(iso,n)=>{const d=dOf(iso);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const isFri=iso=>dOf(iso).getUTCDay()===5;
const monthOf=iso=>iso.slice(0,7);
const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const num=v=>(v===null||v===undefined||v==="")?0:Number(v)||0;
function hasEntry(day){ if(!day) return false;
  if(["n","f","j","u1","u2"].some(k=>day[k]!==null&&day[k]!==undefined&&day[k]!=="")) return true;
  return Array.isArray(day.r)&&day.r.some(x=>x!==null&&x!==undefined&&x!=="");}
function ruleFor(cfg,v){return cfg.rules[v.type+"|"+v.branch]||null}
function fridayOn(cfg,v,iso,day){ const m=cfg.friMode||"all";
  if(m==="none") return false; if(m==="worked") return hasEntry(day);
  if(m==="alt"){ if(!v.friRef||!/^\d{4}-\d{2}-\d{2}$/.test(v.friRef)) return hasEntry(day); const w=Math.round(diffDays(v.friRef,iso)/7); return Math.abs(w)%2===0; }
  return true; }
function dayTarget(cfg,v,iso,day){const r=ruleFor(cfg,v); if(!r) return 0;
  if((cfg.holidays||[]).includes(iso)) return 0; if(isFri(iso)) return fridayOn(cfg,v,iso,day)?num(r.fr):0; return num(r.d);}
function dayAchieved(cfg,v,day){ if(!day) return 0; const r=ruleFor(cfg,v); if(!r) return 0;
  let a=num(day.n)*num(r.w[0])+num(day.f)*num(r.w[1])+num(day.j)*num(r.w[2]);
  if(v.type==="ونش"){ if(num(cfg.trailer.one)>0) a+=num(day.u1)/num(cfg.trailer.one); if(num(cfg.trailer.two)>0) a+=num(day.u2)/num(cfg.trailer.two);}
  return a;}
function calcDay(cfg,v,iso,day,today){
  if(today&&iso>today&&!hasEntry(day)) return {t:0,a:0,ext:0,int:0,gap:0,sur:0,rec:(cfg.reasons||[]).map(()=>0),has:false,missing:0};
  const t=dayTarget(cfg,v,iso,day), a=dayAchieved(cfg,v,day);
  const rec=(cfg.reasons||[]).map((_,i)=>num(day&&day.r?day.r[i]:0));
  let er=0, ir=0; (cfg.reasons||[]).forEach((x,i)=>{ if(x.cls==="خارجي") er+=rec[i]; else if(x.cls==="داخلي") ir+=rec[i]; });
  const def=Math.max(0,t-a), ext=Math.min(er,def), int=Math.min(ir,def-ext), gap=def-ext-int, sur=Math.max(0,a-t);
  const has=hasEntry(day); const missing=(t>0 && iso<=today && !has)?1:0;
  return {t,a,ext,int,gap,sur,rec,has,missing};
}
function emptyAgg(n){return {t:0,a:0,ext:0,int:0,gap:0,sur:0,missing:0,rec:new Array(n).fill(0)}}
function addAgg(A,c){A.t+=c.t;A.a+=c.a;A.ext+=c.ext;A.int+=c.int;A.gap+=c.gap;A.sur+=c.sur;A.missing+=c.missing;c.rec.forEach((x,i)=>A.rec[i]+=x);return A}
function aggVehicle(cfg,v,from,to,getDay,today){
  const A=emptyAgg((cfg.reasons||[]).length); if(!from||!to||to<from) return A;
  for(let iso=from; iso<=to; iso=addDays(iso,1)) addAgg(A,calcDay(cfg,v,iso,getDay(v.id,iso),today));
  return A;
}
const ratio=(a,b)=>b>0?a/b:null;
function rating(cfg,x){ if(x===null||x===undefined) return ""; const t=cfg.thresholds; return x>=t[0]?"ممتاز":x>=t[1]?"جيد":x>=t[2]?"مقبول":"ضعيف"; }
/* ============ END CALC ENGINE ============ */

const crTimers={};
const S={db:null,user:null,uid:null,canWrite:null,isAdmin:false,readOnly:false,cfg:null,cfgLoaded:false,
  vehicles:[],vehLoaded:false,entries:{},carrier:{},demo:false,demoEntries:null,demoCarrier:null,dbReady:false,
  f:null,entryDate:null,entryBranch:"الكل",vlog:{vid:null,month:null},cmonth:null,sort:{k:"adj",dir:1},view:"dashboard",
  entSub:null,entMonths:"",charts:{},pending:{},saveState:{},names:{},ver:0,entryQ:"",connecting:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=0)=>x===null||x===undefined||isNaN(x)?"—":Number(x).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:0});
const pct=(x,d=1)=>x===null||x===undefined||isNaN(x)?"—":(x*100).toFixed(d)+"%";
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function cfg(){return S.cfg||DEFAULT_CFG}
const natCmp=(a,b)=>String(a).localeCompare(String(b),"en",{numeric:true,sensitivity:"base"});
function vehCmp(a,b){ if(a.code&&b.code) return natCmp(a.code,b.code); if(a.code) return -1; if(b.code) return 1;
  return (a.branch===b.branch?0:a.branch==="مكة"?-1:1)||(a.type===b.type?0:a.type==="ونش"?-1:1)||natCmp(a.plate,b.plate); }
function vehLabel(v){ return v?((v.code?v.code+" · ":"")+v.plate):""; }
function activeVehicles(){return S.vehicles.filter(v=>v.active!==false).sort(vehCmp)}
function entryMap(){return S.demo&&S.demoEntries?S.demoEntries:S.entries}
function getDayFrom(map){return (vid,iso)=>{const doc=map[vid+"|"+monthOf(iso)]; const d=doc&&doc[iso.slice(8)]; return d||null}}
function getDay(vid,iso){return getDayFrom(entryMap())(vid,iso)}
function realDay(vid,iso){return getDayFrom(S.entries)(vid,iso)}
function carrierDay(iso){const m=S.demo&&S.demoCarrier?S.demoCarrier:S.carrier; const doc=m[monthOf(iso)]; return (doc&&doc[iso.slice(8)])||null}

/* ---------- init ---------- */
(function initState(){
  const t=localToday(); const ms=t.slice(0,8)+"01";
  S.f={branch:"الكل",vehicle:"الكل",from:ms,to:t}; S.entryDate=t; S.vlog.month=t.slice(0,7); S.cmonth=t.slice(0,7);
  try{const saved=JSON.parse(localStorage.getItem("fleet.f")||"null"); if(saved&&saved.from) S.f=Object.assign(S.f,saved);}catch(e){}
  try{const u=JSON.parse(localStorage.getItem("fleet.ui")||"null"); if(u){ if(u.entryBranch) S.entryBranch=u.entryBranch; if(u.vid) S.vlog.vid=u.vid; if(u.vmonth) S.vlog.month=u.vmonth; if(u.cmonth) S.cmonth=u.cmonth; if(u.logUser) S.logUser=u.logUser; } }catch(e){}
})();
function persistF(){try{localStorage.setItem("fleet.f",JSON.stringify(S.f))}catch(e){}}
function persistUI(){try{localStorage.setItem("fleet.ui",JSON.stringify({entryBranch:S.entryBranch,vid:S.vlog.vid,vmonth:S.vlog.month,cmonth:S.cmonth,logUser:S.logUser}))}catch(e){}}

async function boot(){
  route(); window.addEventListener("hashchange",route);
  const db=FDB, user=null;
  S.db=db; S.user=null; S.uid=ME.username; S.meName=ME.full_name||ME.username; S.meEmail="";
  S.isAdmin=ME.role==="sysadmin"; S.isOwnerAcc=false; S.canWrite=["sysadmin","dispatcher"].includes(ME.role); S.readOnly=!S.canWrite;
  S.level=S.isAdmin?"admin":S.canWrite?"interact":"view";
  S.connecting=false;
  if(false){ S.cfg=DEFAULT_CFG; S.cfgLoaded=true; S.vehLoaded=true; S.demo=true; buildDemo(); render(); return; }
  db.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?normCfg(s.data()):null;S.cfgLoaded=true;S.ver++;softRender()},e=>{S.cfgLoaded=true;render()});
  db.collection("vehicles").onSnapshot(s=>{S.vehicles=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.vehLoaded=true;S.ver++;softRender()},e=>{S.vehLoaded=true;render()});
  db.collection("carrier").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=(d.data().days)||{}});S.carrier=m;S.ver++;softRender()},()=>{});
  db.doc("meta/backup").onSnapshot(s=>{S.lastBackup=s.exists?s.data():null;S.backupLoaded=true;if(S.view==="setup")updateBackupInfo();else renderBanner();},()=>{});
  S.dbReady=true; ensureEntrySub(); ensureAuditSub(); render(); setTimeout(flushOutbox,1500);
}
let softT=null;
function softRender(){ clearTimeout(softT); softT=setTimeout(()=>{ const busy=Object.keys(S.pending).length||Object.keys(crTimers).length||(document.activeElement&&document.activeElement.matches&&document.activeElement.matches("main input,main select,main textarea"));
  if(busy&&(S.view==="entry"||S.view==="vehicle"||S.view==="carrier"||S.view==="setup"||S.view==="places")){ renderBanner(); if(S.view==="entry"||S.view==="vehicle") refreshEditorValues(); return; } render(); },350); }
function normCfg(c){const d=JSON.parse(JSON.stringify(DEFAULT_CFG)); return Object.assign(d,c||{})}
function neededMonths(){
  const set=new Set(); const add=(a,b)=>{ if(!a||!b||b<a) return; let m=a.slice(0,7); const e=b.slice(0,7); let g=0; while(m<=e&&g++<40){set.add(m); const [y,mo]=m.split("-").map(Number); m=mo===12?`${y+1}-01`:`${y}-${pad(mo+1)}`;} };
  const L=diffDays(S.f.from,S.f.to)+1; add(addDays(S.f.from,-L),S.f.to);
  set.add(monthOf(S.entryDate)); set.add(S.vlog.month); return [...set].sort().slice(-30);
}
function ensureEntrySub(){
  if(!S.db) return; const ms=neededMonths(); const key=ms.join(",");
  if(key===S.entMonths) return; S.entMonths=key; if(S.entSub) S.entSub();
  S.entSub=S.db.collection("entries").where("month","in",ms).onSnapshot(s=>{
    const m={}; s.docs.forEach(d=>{const x=d.data(); m[x.vid+"|"+x.month]=Object.assign({},x.days||{})});
    const ob=outboxLoad(); Object.values(ob).forEach(o=>{ const mk=o.vid+"|"+monthOf(o.iso); if(!m[mk]) m[mk]={}; if(o.day) m[mk][o.iso.slice(8)]=o.day; else delete m[mk][o.iso.slice(8)]; });
    S.entries=m; S.ver++; onEntriesChanged();
  },e=>{showBanner("bad","تعذّر تحميل التوريدات: "+esc(e.message||e.code))});
}
function onEntriesChanged(){
  if(S.view==="entry"||S.view==="vehicle") refreshEditorValues(); else softRender();
}

/* ---------- routing ---------- */
const VIEWS=["ops","orders","plan","reserve","maint","dreports","dashboard","entry","vehicle","drivers","carrier","report","places","log","admin","setup"];
function go(v){ if(!VIEWS.includes(v)) return; S.view=v; try{ if(location.hash!=="#"+v) history.replaceState(null,"","#"+v); }catch(e){} applyView(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{ const b=e.target.closest("nav.tabs [data-v],[data-goto]"); if(!b) return; e.preventDefault(); go(b.dataset.v||b.dataset.goto); });
function route(){
  const h=(location.hash||"#"+(S.view||"orders")).slice(1); S.view=VIEWS.includes(h)?h:(S.view||"dashboard"); applyView(); }
function applyView(){ if(typeof S2!=="undefined") S2.dirty=true;
  document.querySelectorAll("nav.tabs button").forEach(a=>{a.setAttribute("aria-current",a.dataset.v===S.view?"page":"false"); if(a.dataset.v===S.view) try{a.scrollIntoView({block:"nearest",inline:"center"})}catch(e){}});
  document.querySelectorAll("main section").forEach(s=>{ const on=s.id==="v-"+S.view; s.hidden=!on; if(!on&&s.innerHTML) s.innerHTML=""; });
  render(true);
}
let renderQueued=false;
function render(force){ if(renderQueued&&!force) return; renderQueued=true; requestAnimationFrame(()=>{renderQueued=false; doRender();}); }
function doRender(){
  try{
    ensureEntrySub(); renderBanner(); updateSyncBadge();
    const v=S.view;
    if(v==="dashboard") renderDashboard(); else if(v==="entry") renderEntry(); else if(v==="vehicle") renderVehicle(); else if(v==="drivers") renderDrivers();
    else if(v==="carrier") renderCarrier(); else if(v==="report") renderReport(); else if(v==="log") renderLog(); else if(v==="places") renderPlaces(); else renderSetup();
  }catch(err){ console.error(err); showBanner("bad","صار خطأ في عرض الصفحة: "+esc(err&&err.message||err)+" — <button class='btn sm' data-act='reload-view'>إعادة المحاولة</button>"); diag("render",err); }
}
function showBanner(kind,html){ $("#banner").innerHTML=`<div class="notice ${kind}">${html}</div>`; }
function renderBanner(){
  const parts=[];
  if(!S.db) parts.push(`<div class="notice warn"><b>وضع المعاينة:</b> هذا العرض لا يتصل بقاعدة البيانات، والأرقام تجريبية. افتح التطبيق من رابطه للعمل على البيانات الفعلية.</div>`);
  else if(S.cfgLoaded&&!S.cfg) parts.push(`<div class="notice warn">الإعدادات لم تُحفظ بعد — يتم استخدام قواعد الاحتساب الافتراضية. ${S.isAdmin?'<a class="lnk" data-goto="setup">افتح الإعدادات</a>':''}</div>`);
  if(S.db&&S.vehLoaded&&!S.vehicles.length) parts.push(`<div class="notice info">لا توجد سيارات مسجلة بعد. ${S.isAdmin?'أضفها من <a class="lnk" data-goto="setup">الإعدادات</a>.':'اطلب من صاحب التطبيق إضافتها.'}</div>`);
  if(S.db&&S.isAdmin&&S.backupLoaded&&Object.keys(S.entries).length){ const lb=S.lastBackup&&S.lastBackup.at; const days=lb?diffDays(lb.slice(0,10),localToday()):null;
    if(days===null||days>35) parts.push(`<div class="notice info">${days===null?"ما فيه نسخة احتياطية للبيانات إلى الآن.":`آخر نسخة احتياطية قبل <b>${days}</b> يوم.`} <a class="lnk" data-goto="setup" data-act="goto-backup">نزّل نسخة الحين</a></div>`); }
  if(S.readOnly) parts.push(`<div class="notice bad"><b>الحساب المفتوح به التطبيق${S.meName?` (${esc(S.meName)})`:""} صلاحيته عرض فقط</b> — أي إدخال ما راح ينحفظ. افتح التطبيق بحساب صاحب التطبيق، أو اطلب منه يعطي هذا الحساب صلاحية من زر Share. <a class="lnk" data-goto="setup">التفاصيل</a></div>`);
  if(S.demo&&S.db) parts.push(`<div class="notice warn"><b>بيانات تجريبية للمعاينة</b> — الأرقام في اللوحة والتقرير عشوائية ولا تُحفظ. <button class="btn sm" data-act="demo-off">إيقاف المعاينة</button></div>`);
  $("#banner").innerHTML=parts.join("");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="demo-off"){S.demo=false;S.ver++;render(true)} else if(a==="demo-on"){S.demo=true;buildDemo();S.ver++;render(true)} else if(a==="reload-view"){render(true)} else if(a==="retry-sync"){flushOutbox(true)}
});

/* ---------- demo data (in memory only) ---------- */
function buildDemo(){
  let vs=activeVehicles();
  if(!vs.length){ vs=[]; let k=1; for(const b of BRANCHES) for(const t of ["ونش","سطحة"]) for(let i=0;i<4;i++) vs.push({id:"demo"+k,plate:"سيارة "+(k++),type:t,branch:b,driver:"(تجريبي)",active:true}); if(!S.db){S.vehicles=vs;} }
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647}; const pick=a=>a[Math.floor(rnd()*a.length)];
  const m={}, today=localToday(), start=addDays(S.f.from,-(diffDays(S.f.from,S.f.to)+1)-5);
  for(const v of vs){ const weak=rnd()<0.25;
    for(let iso=start; iso<=today; iso=addDays(iso,1)){
      if(rnd()<0.04) continue; const fri=isFri(iso);
      const day={n:fri?pick([0,1]):pick(weak?[0,1,1,2]:[1,2,2,3]),f:fri?0:pick([0,0,1,1]),j:(v.branch==="مكة"&&!fri)?pick([0,0,0,1]):null,
        u1:v.type==="ونش"?pick([0,0,3]):null,u2:null,r:[pick([0,0,0,0,1]),pick([0,0,0,1,2]),pick([0,0,0,1])]};
      const key=v.id+"|"+monthOf(iso); (m[key]=m[key]||{})[iso.slice(8)]=day; }
  }
  S.demoEntries=m; const c={}; for(let iso=start; iso<=today; iso=addDays(iso,1)){ (c[monthOf(iso)]=c[monthOf(iso)]||{})[iso.slice(8)]={m:pick([0,0,1,2]),mr:pick(cfg().extReasons),a:pick([0,0,0,1,3]),ar:pick(cfg().extReasons)}; }
  S.demoCarrier=c;
}

/* ---------- dashboard ---------- */
function scopeVehicles(){ return activeVehicles().filter(v=>(S.f.vehicle==="الكل"||v.id===S.f.vehicle)&&(S.f.branch==="الكل"||v.branch===S.f.branch)); }
function carrierSum(from,to,branch){ let s=0; if(!from||!to||to<from) return 0; for(let iso=from;iso<=to;iso=addDays(iso,1)){const d=carrierDay(iso); if(!d) continue; if(branch!=="عسفان") s+=num(d.m); if(branch!=="مكة") s+=num(d.a);} return s; }
let _cmpKey="",_cmp=null;
function computeAll(){ const k=[S.ver,S.demo,S.f.branch,S.f.vehicle,S.f.from,S.f.to,localToday(),S.vehicles.length].join("|"); if(k===_cmpKey&&_cmp) return _cmp; _cmp=computeAllRaw(); _cmpKey=k; return _cmp; }
function computeAllRaw(){
  const c=cfg(), today=localToday(), gd=(vid,iso)=>getDay(vid,iso);
  const from=S.f.from, to=S.f.to, L=diffDays(from,to)+1, pf=addDays(from,-L), pt=addDays(from,-1);
  const all=activeVehicles().map(v=>{const cur=aggVehicle(c,v,from,to,gd,today); const prev=aggVehicle(c,v,pf,pt,gd,today);
    const adjT=cur.t-cur.ext; const adj=ratio(cur.a,adjT);
    let main="-"; if(cur.t>0){ if(cur.a>=cur.t) main="حقق المستهدف"; else { const mx=Math.max(0,...cur.rec); main=mx>0?(c.reasons[cur.rec.indexOf(mx)]||{}).name:"غير موضح"; } }
    return {v,cur,prev,adj,ach:ratio(cur.a,cur.t),adjT,rate:rating(c,adj),main};});
  const inScope=r=>(S.f.vehicle==="الكل"||r.v.id===S.f.vehicle)&&(S.f.branch==="الكل"||r.v.branch===S.f.branch);
  const rows=all.filter(inScope);
  const T=rows.reduce((A,r)=>addAgg(A,r.cur),emptyAgg(c.reasons.length)); const P=rows.reduce((A,r)=>addAgg(A,r.prev),emptyAgg(c.reasons.length));
  const extScope=S.f.vehicle!=="الكل"?null:carrierSum(from,to,S.f.branch); const extPrev=S.f.vehicle!=="الكل"?null:carrierSum(pf,pt,S.f.branch);
  const recByBranch=BRANCHES.map(b=>rows.filter(r=>r.v.branch===b).reduce((A,r)=>{r.cur.rec.forEach((x,i)=>A[i]+=x);return A},new Array(c.reasons.length).fill(0)));
  const branches=BRANCHES.map(b=>{const rs=all.filter(r=>r.v.branch===b); const A=rs.reduce((X,r)=>addAgg(X,r.cur),emptyAgg(c.reasons.length)); const ext=carrierSum(from,to,b);
    return {b,mgr:(c.managers||{})[b]||"",n:rs.length,A,ach:ratio(A.a,A.t),adj:ratio(A.a,A.t-A.ext),ext,dep:ratio(ext,A.a+ext),hit:rs.filter(r=>r.cur.t>0&&r.cur.a>=r.cur.t).length,withT:rs.filter(r=>r.cur.t>0).length};});
  // daily cumulative
  const days=[]; let ct=0,ca=0; for(let iso=from; iso<=to && days.length<370; iso=addDays(iso,1)){ let t=0,a=0; for(const r of rows){const x=calcDay(c,r.v,iso,gd(r.v.id,iso),today); t+=x.t; a+=x.a;} ct+=t; ca+=a; days.push({iso,t,a,ct,ca}); }
  return {c,today,from,to,L,pf,pt,all,rows,T,P,extScope,extPrev,recByBranch,branches,days};
}
function delta(cur,prev,mode){
  if(prev===null||prev===undefined||cur===null||cur===undefined) return `<span class="d">لا توجد فترة سابقة للمقارنة</span>`;
  if(mode==="pct"){ if(!prev) return `<span class="d">لا توجد فترة سابقة للمقارنة</span>`; const ch=cur/prev-1; return `<span class="d ${ch>=0?"up":"down"}">${ch>=0?"▲":"▼"} ${Math.abs(ch*100).toFixed(0)}% عن الفترة السابقة</span>`; }
  const ch=(cur-prev)*100; return `<span class="d ${ch>=0?"up":"down"}">${ch>=0?"▲":"▼"} ${Math.abs(ch).toFixed(1)} نقطة عن الفترة السابقة</span>`;
}
function filterBar(showVehicle=true){

    ${showVehicle?`<label class="f">السيارة<select id="f-vehicle"><option value="الكل">الكل</option>${vs.filter(v=>S.f.branch==="الكل"||v.branch===S.f.branch).map(v=>`<option value="${esc(v.id)}" ${S.f.vehicle===v.id?"selected":""}>${esc(vehLabel(v))} — ${esc(v.type)}</option>`).join("")}</select></label>`:""}

  </div></div>`;
}

document.addEventListener("click",e=>{

function scopeLabel(){ if(S.f.vehicle!=="الكل"){const v=S.vehicles.find(x=>x.id===S.f.vehicle); return v?`سيارة <b>${esc(v.plate)}</b> (${esc(v.type)} — ${esc(v.branch)}) — ${esc(v.driver||"")}`:"سيارة";} return S.f.branch==="الكل"?"<b>المصنع ككل</b>":`فرع <b>${esc(S.f.branch)}</b>`; }

    ${k("عجز غير مبرر (رد)",fmt(T.gap,1),"var(--red)",`<span class="d">${def>0?pct(T.gap/Math.max(lost,1e-9),0)+" من الردود المفقودة":"لا يوجد عجز"}</span>`)}
    ${k("الناقل الخارجي (رد)",R.extScope===null?"—":fmt(R.extScope),"var(--blue)",`<span class="d">${R.extScope===null?"غير متاح لسيارة واحدة":"الاعتماد عليه "+pct(ratio(R.extScope,T.a+R.extScope))}</span>`)}

function heatColor(x){ if(x===null) return ""; const lo=[248,105,107], mid=[255,235,132], hi=[99,190,123];
  const t=x<=0.4?0:x>=1?1:x; let a,b,u; if(t<0.85){a=lo;b=mid;u=(t-0.4)/0.45;} else {a=mid;b=hi;u=(t-0.85)/0.15;} u=Math.max(0,Math.min(1,u));
  return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*u)).join(",")})`; }
function heatmap(R){
  const c=R.c; const days=[]; for(let iso=R.from; iso<=R.to && days.length<62; iso=addDays(iso,1)) days.push(iso);
  const rows=R.rows.filter(r=>r.cur.t>0||r.cur.a>0).sort((a,b)=>(a.adj??9)-(b.adj??9));
  if(!rows.length) return `<div class="empty">لا توجد سيارات في النطاق</div>`;
  const cols=`grid-template-columns:minmax(150px,auto) repeat(${days.length},minmax(26px,1fr)) 54px`;
  let h=`<div class="tbl-wrap" style="border:0"><div class="hm" style="${cols}"><div></div>${days.map(d=>`<div class="h ${isFri(d)?"fri":""}">${Number(d.slice(8))}</div>`).join("")}<div class="h">المعدّل</div>`;
  for(const r of rows){
    h+=`<div class="n">${r.v.code?`<span class="code">${esc(r.v.code)}</span> `:""}<a class="lnk" data-open="${esc(r.v.id)}">${esc(r.v.plate)}</a> <small>${esc(r.v.branch)}</small></div>`;
    for(const iso of days){ const x=calcDay(c,r.v,iso,getDay(r.v.id,iso),R.today);
      if(x.missing){h+=`<div class="c miss" title="${fd(iso)}: لم يُسجّل">؟</div>`;continue}
      if(x.t===0){h+=`<div class="c off" title="${fd(iso)}: بدون مستهدف"></div>`;continue}
      const q=x.a/x.t; h+=`<div class="c" style="background:${heatColor(q)}" title="${esc(r.v.plate)} — ${fd(iso)}: ${fmt(x.a,1)} من ${fmt(x.t)}">${Math.round(q*100)}</div>`; }
    h+=`<div class="c" style="background:${heatColor(r.adj)};font-weight:800">${r.adj===null?"—":Math.round(r.adj*100)+"%"}</div>`;
  }
  return h+`</div></div>${days.length<R.L?`<p class="small muted">تعرض الخريطة أول 62 يوم من الفترة.</p>`:""}`;
}

function readEditor(vid,iso){
  const els=document.querySelectorAll(`[data-ed="${CSS.escape(vid+"|"+iso)}"]`); if(!els.length) return null;
  const day={r:[]}; let any=false;
  els.forEach(el=>{ const f=el.dataset.f, val=(f==="note"||f==="pl"||f==="drv"||f==="drvs"||f==="lc")?el.value.trim():normDigits(el.value.trim());
    if(f==="drv"){ if(val) day.drv=val; return; }
    if(f==="lc"){ try{ const a=val?JSON.parse(el.value):null; if(Array.isArray(a)&&a.length) day.lc=a; }catch(e){} return; }
    if(f==="drvs"){ try{ const a=val?JSON.parse(el.value):null; if(Array.isArray(a)&&a.length){ day.drv=String(a[0].id); if(a.length>1) day.drvs=a; } }catch(e){} return; }
    if(f==="note"){ day.note=val||null; if(val) any=true; return; }
    if(f==="pl"){ const a=val?val.split(",").filter(Boolean):[]; if(a.length) day.pl=a; return; }
    const n=val===""?null:Math.max(0,Number(val)); if(n!==null&&!isNaN(n)) any=true;
    if(f.startsWith("r")) day.r[Number(f.slice(1))]=isNaN(n)?null:n; else day[f]=isNaN(n)?null:n; });
  if(![...els].some(el=>el.dataset.f==="pl")){ const old=realDay(vid,iso); if(old&&Array.isArray(old.pl)&&old.pl.length) day.pl=old.pl.slice(); }
  if(day.pl&&day.pl.length) any=true;
  // the driver(s) of the day are set in the vehicle log; screens without that column keep them
  if(![...els].some(el=>el.dataset.f==="drv"||el.dataset.f==="drvs")){ const old=realDay(vid,iso); if(old&&old.drv) day.drv=old.drv; if(old&&Array.isArray(old.drvs)) day.drvs=old.drvs; }
  if(![...els].some(el=>el.dataset.f==="lc")){ const old=realDay(vid,iso); if(old&&Array.isArray(old.lc)) day.lc=old.lc; }
  const nr=cfg().reasons.length; for(let i=0;i<nr;i++) if(day.r[i]===undefined) day.r[i]=null;
  FIELDS.forEach(k=>{ if(day[k]===undefined) day[k]=null; });
  return any?day:null;
}

async function writeDay(vid,iso,body){
  const month=monthOf(iso), dd=iso.slice(8), ref=S.db.collection("entries").doc(vid+"_"+month);
  let lastErr=null;
  for(let attempt=0; attempt<3; attempt++){
    try{ await ref.update({days:{[dd]:body}}); return; }catch(e1){ lastErr=e1; }
    try{ const snap=await ref.get();
      if(!snap.exists){ await ref.set({vid,month,days:{[dd]:body}}); return; }
      const data=JSON.parse(JSON.stringify(snap.data()||{})); data.days=data.days||{}; data.days[dd]=body; data.vid=vid; data.month=month;
      await ref.set(data); return;
    }catch(e2){ lastErr=e2; }
    await sleep(800*(attempt+1)+Math.random()*400);
  }
  throw lastErr;
}

function doSave(vid,iso){

let crQueue=Promise.resolve();
function saveCarrier(dd){
  const m=S.cmonth, els=document.querySelectorAll(`[data-cr="${dd}"]`), d={};

  if(st){st.className="save";st.textContent="…جاري الحفظ"}
  S.carrier[m]=Object.assign({},S.carrier[m]||{},{[dd]:d});
  crQueue=crQueue.then(async()=>{ const ref=S.db.collection("carrier").doc(m);
    try{ await ref.update({days:{[dd]:d}}); }catch(e){ if(e&&e.code==="invalid_argument"){const s=await ref.get(); if(!s.exists) await ref.set({month:m,days:{[dd]:d}}); else throw e;} else throw e; }

function reportRows(){ const R=computeAll(); return {R,rows:R.rows.filter(r=>r.cur.t>0||r.cur.a>0)}; }
function renderReport(){
  const el=$("#v-report"); if(!S.vehLoaded){el.innerHTML=filterBar();return}
  const {R,rows}=reportRows(), c=R.c, sk=S.sort.k, dir=S.sort.dir;

function kmBetween(a,b,c,d){ const r=x=>x*Math.PI/180; return 2*6371*Math.asin(Math.sqrt(Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2)); }
function previewCls(o){ const s=cfg(); if(o.cls) return o.cls; const org=(s.origins||{})[o.branch]||{}; const near=num(org.nearKm)||25;
  if(o.place_id){ const p=(s.places||[]).find(x=>x.id===o.place_id); if(p){ const c=p.cls||"auto"; if(c==="قريب") return "n"; if(c==="بعيد") return "f"; if(c==="جدة والطائف") return "j";
      if(p.city==="جدة"||p.city==="الطائف") return "j"; if(p.km!==""&&p.km!=null) return num(p.km)<=near?"n":"f"; } }
  if(o.lat!=null&&o.lng!=null&&o.lat!==""){ for(const z of (s.jtZones||[])) if(kmBetween(+o.lat,+o.lng,z.lat,z.lng)<=z.km) return "j";
    if(org.lat!=null&&org.lat!=="") return kmBetween(+o.lat,+o.lng,+org.lat,+org.lng)<=near?"n":"f"; }
  return null; }
function parseCoords(s){ s=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".").replace(/%2C/gi,",");
  const pats=[/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/[?&](?:q|ll|query|destination|daddr|center)=(?:loc:)?(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/^\s*(-?\d{1,2}\.\d+)\s*[,،]\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const p of pats){ const m=s.match(p); if(m){ const lat=+m[1], lng=+m[2]; if(Math.abs(lat)<=90&&Math.abs(lng)<=180) return {lat,lng}; } }
  return null; }

  const lanes=B.lanes.map(l=>Object.assign({},l,{key:l.lane})); const extN=new Set((B.ext_lanes||[]).map(Number)); (S2.extLanes[p.branch+"|"+p.date]||[]).forEach(n=>extN.add(n));
  [...extN].sort((a,b)=>a-b).forEach(n=>lanes.push({key:"EXT"+n,lane:"EXT"+n,ext:true,code:null,plate:"ناقل خارجي "+n,type:"",cap:null,used:null}));
  const tripSt={}; (B.trips||[]).forEach(t=>tripSt[t.lane+"#"+t.trip_no]=t);
  const byLane={}; const pool=[], reserve=[];
  B.orders.forEach(o=>{ if(o.lane&&o.shift_date===p.date&&["assigned","in_progress","delivered"].includes(o.status)){ (byLane[o.lane]=byLane[o.lane]||[]).push(o); }
    else if(o.status==="reserve") reserve.push(o); else if(["new","pending","planned","postponed"].includes(o.status)) pool.push(o); });
  lanes.forEach(l=>{ const os=(byLane[l.key]||[]).sort((a,b)=>(a.trip_no-b.trip_no)||(a.seq-b.seq)); const max=Math.max(0,...os.map(o=>o.trip_no||0));
    l.trips=[]; for(let t=1;t<=max;t++){ const items=os.filter(o=>o.trip_no===t); const st=tripSt[l.key+"#"+t]; l.trips.push({no:t,items,st:st?st.status:(items.length&&items.every(o=>o.status==="delivered")?"done":items.some(o=>o.status==="in_progress")?"in_progress":"open"),trip:st}); } });
  return {lanes,pool,reserve,B}; }
function chip(o,locked){ const s=S2.sel===o.id; return `<div class="ochip ${s?"sel":""} ${locked?"locked":""} st-${o.status}" ${locked||!canPlan()?"":`draggable="true" data-chip="${o.id}"`} title="${esc(itemsText(o.items))}">
   <span class="so" dir="ltr">${esc(o.so_number)}</span>${clsTag(o.cls_eff,!o.cls)}<span class="cn">${esc(o.customer||"—")}</span>
   <span class="meta">${esc(o.rep_name||"")}${o.requested_date!==planState().date?` · مطلوب ${fd(o.requested_date)}`:""}${o.status==="reserve"?` · احتياطي ${since(o.reserve_since)}`:""}${o.status==="postponed"?" · مؤجل":""}${o.status==="planned"?" · ضمن الخطة":""}${o.approved?" · معتمد":""}</span>
   ${o.status_reason&&o.status!=="delivered"?`<span class="meta reason">${esc(o.status_reason)}</span>`:""}</div>`; }
function dropZone(target,label){ return canPlan()?`<div class="dz" data-drop="${esc(target)}">${S2.sel?`<button type="button" class="btn sm" data-dropbtn="${esc(target)}">نقل المحدد هنا</button>`:esc(label)}</div>`:""; }
function paintBoard(){ const el=$("#v-plan"); if(!el||S.view!=="plan") return; const p=planState(); const M=boardModel(); const B=M.B;
  const real=M.lanes.filter(l=>!l.ext&&!l.lent_out&&l.cap>0); const cap=real.reduce((s,l)=>s+num(l.cap),0), used=real.reduce((s,l)=>s+num(l.used),0);
  const planned=M.lanes.reduce((s,l)=>s+l.trips.reduce((x,t)=>x+t.items.length,0),0); const trips=M.lanes.reduce((s,l)=>s+l.trips.filter(t=>t.items.length).length,0);

    <p class="small" style="margin:8px 0 0"><b>${esc(shiftText(p.branch,p.date))}</b></p>
    ${plan&&plan.approved_at?`<p class="small" style="margin:4px 0 0">✔ اعتمد الخطة: <b>${esc(plan.approved_by_name||"")}</b> · ${fmtDT(plan.approved_at)}</p>`:`<p class="small muted" style="margin:4px 0 0">الخطة غير معتمدة بعد.</p>`}
    ${canPlan()?`<div class="row" style="margin-top:10px"><button class="btn primary" id="pl-auto">توزيع تلقائي</button><button class="btn" id="pl-approve">اعتماد الخطة</button><button class="btn" id="pl-ext">+ ناقل خارجي</button>
      ${others.length?`<select id="pl-borrow" style="width:auto"><option value="">+ سيارة من الفرع الآخر…</option>${others.map(v=>`<option value="${esc(v.id)}">${esc(vehLabel(v))} — ${esc(v.type)} (${esc(v.branch)})</option>`).join("")}</select>`:""}</div>

  <div class="kpis">${k("طلبات بانتظار التخصيص",M.pool.length,"var(--orange)")}${k("مخصصة على سيارات",planned,"var(--green)",`${trips} رد`)}${k("الاحتياطي",M.reserve.length,"var(--red)")}
    ${k("السيارات المتاحة",real.length,"var(--blue)",`من ${M.lanes.filter(l=>!l.ext).length} سيارة`)}${k("الطاقة / المستخدم",`${fmt(used,1)} / ${fmt(cap,1)}`,"var(--navy-ink)","بالردود")}${k("نسبة الاستغلال",cap?pct(used/cap,0):"—",used>cap?"var(--red)":"var(--lime)")}</div>

   <aside class="pool"><div class="panel"><h2>بانتظار التخصيص <span class="q">${M.pool.length}</span></h2>${dropZone("POOL","أفلت هنا لإرجاع الطلب لقائمة الانتظار")}<div class="chips-col">${M.pool.map(o=>chip(o,false)).join("")||`<p class="small muted">لا يوجد.</p>`}</div></div>
    <div class="panel"><h2>الاحتياطي <span class="q">${M.reserve.length}</span></h2>${dropZone("RESERVE","أفلت هنا للتحويل للاحتياطي (يطلب سبب)")}<div class="chips-col">${M.reserve.map(o=>chip(o,false)).join("")||`<p class="small muted">لا يوجد.</p>`}</div></div></aside>
   <div class="lanes">${M.lanes.filter(l=>!p.busy||l.ext||l.trips.length).map(laneHtml).join("")||`<div class="panel empty">لا توجد سيارات لهذا الفرع.</div>`}</div></div>`}`; }
function laneHtml(l){ const p=planState(); const over=l.cap!=null&&num(l.used)>num(l.cap); const pc=l.cap?Math.min(100,num(l.used)/num(l.cap)*100):0;
  const dis=l.lent_out||(l.cap===0&&!l.ext&&!l.trips.length);
  const head=l.ext?`<b>${esc(l.plate)}</b>`:`${l.code?`<span class="code">${esc(l.code)}</span>`:""}<b>${esc(l.plate)}</b><span class="muted small">${esc(l.type)} · ${esc(l.driver||"")}</span>${l.lent?`<span class="tag">من فرع ${esc(l.home_branch)}</span>`:""}${l.lent_out?`<span class="tag">معارة للفرع الآخر</span>`:""}${l.maint?`<a class="mtag" data-mopen="${l.maint.id}">🔧 صيانة: ${esc(l.maint.category)}</a>`:""}`;
  const sched=!l.ext&&canPlan()&&!l.lent_out?`<label class="small sched"><input type="checkbox" data-sched="${esc(l.key)}" ${l.cap>0?"checked":""}> ${l.maint&&!(l.cap>0)?"إرجاعها للتخطيط رغم الصيانة":"تعمل هذه الوردية"}</label>`:"";

   ${l.ext?`<p class="small muted" style="margin:0">ناقل مستأجر — يُحسب في عدّاد الناقل الخارجي عند إغلاق الرد.</p>`:`<div class="capbar" title="المستخدم من الطاقة"><i style="width:${pc}%"></i><span>${fmt(l.used,1)} / ${fmt(l.cap,1)} رد</span></div>`}
   ${l.maint?`<p class="small reason" style="margin:0">في الصيانة منذ ${fd(l.maint.opened_on)}: ${esc(l.maint.description)}${l.maint.expected_return?` · الرجوع المتوقع ${fd(l.maint.expected_return)}`:""}</p>`:""}
   ${l.over_reason?`<p class="small reason" style="margin:0">سبب التجاوز: ${esc(l.over_reason)}</p>`:""}
   ${l.trips.map(t=>tripHtml(l,t)).join("")}
   ${dis?"":dropZone(l.key+"#new","+ رد جديد — أفلت هنا")}</div>`; }
function tripHtml(l,t){ const closed=t.st==="done"||t.st==="failed"; const has=t.items.length;
  const stl={open:"",in_progress:`<span class="st blue">جارٍ التوصيل</span>`,done:`<span class="st done">تم التنفيذ${t.trip&&t.trip.cls?" · "+CLS_L[t.trip.cls]:""}</span>`,failed:`<span class="st bad">لم يُنفذ</span>`}[t.st]||"";
  const acts=canPlan()&&has?[t.st==="open"&&t.items.some(o=>o.status==="assigned")?`<button class="btn sm" data-trip="start" data-lane="${esc(l.key)}" data-no="${t.no}">بدء</button>`:"",
    !closed&&t.items.some(o=>OPEN_ST.includes(o.status))?`<button class="btn sm primary" data-trip="close" data-lane="${esc(l.key)}" data-no="${t.no}">إغلاق الرد</button>`:"",
    closed&&isRole("sysadmin")?`<button class="btn sm ghost" data-trip="reopen" data-lane="${esc(l.key)}" data-no="${t.no}">إعادة فتح</button>`:""].join(""):"";
  return `<div class="trip ${closed?"closed":""}" ${!closed&&canPlan()?`data-drop="${esc(l.key)}#${t.no}"`:""}><div class="th"><b>رد ${t.no}</b>${stl}<span class="ta">${acts}</span></div>
   <div class="chips-col">${t.items.map(o=>chip(o,closed||o.status==="delivered")).join("")||`<span class="small muted">فاضي</span>`}</div>
   ${!closed&&S2.sel&&canPlan()?`<button type="button" class="btn sm" data-dropbtn="${esc(l.key)}#${t.no}">نقل المحدد لهذا الرد</button>`:""}${t.trip&&t.trip.fail_reason?`<div class="small reason">${esc(t.trip.fail_reason)}</div>`:""}</div>`; }
function laneLayout(M,key){ const l=M.lanes.find(x=>x.key===key); if(!l) return {lane:key,trips:[]}; return {lane:key,trips:l.trips.map(t=>t.st==="done"||t.st==="failed"?[]:t.items.filter(o=>OPEN_ST.includes(o.status)).map(o=>o.id))}; }
function trimLayout(L){ while(L.trips.length&&!L.trips[L.trips.length-1].length) L.trips.pop(); return L; }
async function moveOrder(id,target){ const p=planState(), M=boardModel(); const o=(p.board.orders||[]).find(x=>x.id===id); if(!o) return;
  const src=o.lane&&o.shift_date===p.date&&OPEN_ST.includes(o.status)?o.lane:null;
  try{
    if(target==="POOL"){ if(o.status==="pending"||o.status==="new"||o.status==="planned"&&o.shift_date===p.date) return; await api("fleet_order_action",{p_id:id,p_action:"plan",a:{date:p.date}}); }
    else if(target==="RESERVE"){ if(o.status==="reserve") return; const v=await askReason(`تحويل SO ${o.so_number} للاحتياطي`,{label:"سبب التحويل للاحتياطي",suggest:["تجاوز الطاقة التشغيلية","عدم توفر سيارات كافية","تعذّر إدراجه في خطة اليوم","ظروف تشغيلية","طلب العميل"]}); if(!v) return;
      await api("fleet_order_action",{p_id:id,p_action:"reserve",a:{reason:v.reason}}); }
    else { const [lane,tn]=[target.slice(0,target.lastIndexOf("#")),target.slice(target.lastIndexOf("#")+1)];

      if(src) layouts[src].trips=layouts[src].trips.map(t=>t.filter(x=>x!==id));
      const T=layouts[lane].trips; let idx=tn==="new"?T.length:Number(tn)-1; while(T.length<=idx) T.push([]); if(tn==="new"&&T.length&&idx>0&&!T[idx-1].length&&false) idx--;
      T[idx]=T[idx].filter(x=>x!==id).concat([id]);

  }catch(e){ toast(errMsg(e),"err"); } }
async function laneSet(L,over){ const p=planState();

    if(!v) throw new Error("تم إلغاء النقل"); const o2={}; probs.forEach(x=>o2[x.lane]=v["r_"+x.lane]); await api("fleet_lane_set",{p_branch:p.branch,p_date:p.date,p_layout:L,p_over:o2}); } }

document.addEventListener("change",async e=>{

function repState(){ if(!S2.rep){ const t=today(); S2.rep={from:t.slice(0,8)+"01",to:t,branch:"",data:null}; } return S2.rep; }
async function loadRep(){ const r=repState(); r.loading=true; try{ r.data=await api("fleet_reports",{p_from:r.from,p_to:r.to,p_branch:r.branch||null}); }catch(e){ toast(errMsg(e),"err"); } r.loading=false; paintRep(); }
function renderDReports(){ newView("dreports",()=>{ paintRep(); if(!repState().data) loadRep(); }); }
function computeRep(){ const r=repState(), D=r.data||{orders:[],reserve_now:[],actions:[]}; const os=D.orders.filter(o=>!o.deleted);
  const reps={}; os.forEach(o=>{ const k=o.rep_id; const x=reps[k]=reps[k]||{name:o.rep_name||"—",reg:0,del:0,ontime:0,res:0,canc:0,open:0}; x.reg++; if(o.status==="delivered"){ x.del++; if((o.shift_date||o.requested_date)<=o.requested_date) x.ontime++; } if(o.reserve_since) x.res++; if(o.status==="cancelled") x.canc++; if(!["delivered","cancelled"].includes(o.status)) x.open++; });
  const veh={}; os.filter(o=>o.lane&&["assigned","in_progress","delivered"].includes(o.status)).forEach(o=>{ const v=veh[o.lane]=veh[o.lane]||{lane:o.lane,planned:new Set(),done:new Set(),days:new Set()}; const tk=o.shift_date+"#"+o.trip_no; v.planned.add(tk); v.days.add(o.shift_date); if(o.status==="delivered") v.done.add(tk); });
  const vrows=Object.values(veh).map(v=>{ const veh=vehById(v.lane); let cap=0; if(veh) v.days.forEach(d=>{ cap+=dayTarget(cfg(),{type:veh.type,branch:veh.branch,friRef:veh.fri_ref},d,{n:1}); });
    return {lane:v.lane,name:laneName(v.lane),planned:v.planned.size,done:v.done.size,days:v.days.size,avg:v.days.size?v.done.size/v.days.size:0,cap,util:cap?v.done.size/cap:null}; }).sort((a,b)=>b.done-a.done);
  const reasons={}; os.filter(o=>o.status_reason&&o.status!=="delivered").forEach(o=>{ const k=o.status_reason.replace(/\(.*\)/,"").replace(/يوم \d{2}\/\d{2}\/\d{4}/,"").trim(); reasons[k]=(reasons[k]||0)+1; });
  const disp={}; (D.actions||[]).forEach(a=>{ const x=disp[a.username]=disp[a.username]||{}; x[a.action]=(x[a.action]||0)+a.n; });
  const tot={reg:os.length,del:os.filter(o=>o.status==="delivered").length,res:os.filter(o=>o.reserve_since).length,resNow:(D.reserve_now||[]).length};
  const dl=os.filter(o=>o.status==="delivered"); tot.ontime=dl.length?dl.filter(o=>(o.shift_date||o.requested_date)<=o.requested_date).length/dl.length:null;
  return {reps:Object.values(reps).sort((a,b)=>b.reg-a.reg),vrows,reasons:Object.entries(reasons).sort((a,b)=>b[1]-a[1]),disp,tot,D}; }

  ${!X?`<div class="panel empty">${r.loading?"جاري التحميل…":"لا توجد بيانات"}</div>`:`
  <div class="kpis">${k("الطلبات المسجلة",X.tot.reg,"var(--navy-ink)")}${k("المنفذة",X.tot.del,"var(--green)",X.tot.reg?pct(X.tot.del/X.tot.reg,0):"")}${k("نسبة التنفيذ في الموعد",X.tot.ontime==null?"—":pct(X.tot.ontime,0),"var(--lime)")}
   ${k("مرّت بالاحتياطي",X.tot.res,"var(--orange)")}${k("في الاحتياطي الآن",X.tot.resNow,"var(--red)")}${k("سيارات شاركت",X.vrows.filter(v=>!/^EXT/.test(v.lane)).length,"var(--blue)",`ناقل خارجي: ${X.vrows.filter(v=>/^EXT/.test(v.lane)).reduce((s,v)=>s+v.done,0)} رد`)}</div>

   ${X.vrows.map(v=>`<tr><td class="txt">${esc(v.name)}</td><td>${v.planned}</td><td>${v.done}</td><td>${v.days}</td><td>${fmt(v.avg,1)}</td><td>${/^EXT/.test(v.lane)?"—":fmt(v.cap,1)}</td><td>${v.util==null?"—":pct(v.util,0)}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">لا يوجد</td></tr>`}</tbody></table></div>
   <p class="small muted">الطاقة هنا = مستهدف السيارة اليومي حسب قواعد الاحتساب في أيام عملها. الرد المنفذ يُعد رداً واحداً بغض النظر عن وزنه.</p></div>

const M_CATS=["ميكانيكي (مكينة / قير)","كهربائي","هيدروليك / الرافعة","كفرات","فرامل","حادث","صيانة دورية","أخرى"];

S2.maintOpen=[]; S2.mnt={status:"active",branch:"",vehicle:"",rows:null};
async function loadMaintOpen(){ if(!ME||!KPI_ROLES.includes(ME.role)) return; try{ S2.maintOpen=await api("fleet_maint_list",{f:{open_only:true}}); }catch(e){} }
function maintFor(vid,iso){ return S2.maintOpen.find(m=>m.vehicle_id===vid&&m.opened_on<=iso)||null; }
function breakdownIdx(){ return (cfg().reasons||[]).findIndex(r=>/(عطل|أعطال|اعطال|عطال)/.test(r.name||"")); }
async function maintForm(m,{vid,iso,title}={}){ const isNew=!m||!m.id; m=m||{};
  const vs=[...S.vehicles].filter(v=>v.active!==false&&(!ME.branch||ME.role!=="dispatcher"||v.branch===ME.branch)).sort(vehCmp);
  const v=await modal(title||(isNew?"طلب صيانة جديد":`تعديل طلب الصيانة #${m.id}`),`
    ${isNew&&!vid?`<label class="f">السيارة<select name="vehicle_id">${vs.map(x=>`<option value="${esc(x.id)}">${esc(vehLabel(x))} — ${esc(x.type)} (${esc(x.branch)})</option>`).join("")}</select></label>`:`<p><b>${esc(laneName(vid||m.vehicle_id))}</b></p>`}

     <label class="f">نوع العطل<select name="category">${M_CATS.map(c=>`<option ${m.category===c?"selected":""}>${c}</option>`).join("")}</select></label></div>
    <label class="f">تفاصيل العطل *<textarea name="description" rows="3" placeholder="وش صار بالضبط؟ مثال: تسريب زيت من خرطوم الرافعة">${esc(m.description||"")}</textarea></label>
    <label class="f">ملاحظات (اختياري)<textarea name="notes" rows="2" placeholder="مين بلّغ، مكان السيارة، قطع مطلوبة…">${esc(m.notes||"")}</textarea></label>
    <label class="f">الرجوع المتوقع (اختياري)<input type="date" name="expected_return" value="${esc(m.expected_return||"")}"></label>
    ${isNew?`<p class="small muted">طول ما الطلب مفتوح تطلع السيارة من تخطيط الردود تلقائياً، وتقدر ترجعها يدوي من شاشة التخطيط.</p>`:`<label class="f">سبب التعديل (اختياري)<input type="text" name="reason"></label>`}`,
    {ok:isNew?"فتح طلب الصيانة":"حفظ",wide:true,validate:x=>!x.description?"اكتب تفاصيل العطل":!x.opened_on?"حدد تاريخ العطل":null});
  if(!v) return null; const p=Object.assign({},v); if(isNew){ if(vid) p.vehicle_id=vid; } else p.id=m.id;
  try{ const r=await api("fleet_maint_save",{p}); await loadMaintOpen(); toast(isNew?`تم فتح طلب الصيانة #${r.id}`:"تم الحفظ"); return r; }catch(e){ toast(errMsg(e),"err"); return null; } }

/* the daily entry: a new breakdown count opens the maintenance form first */
const _scheduleSave0=scheduleSave; const maintAsking={};
scheduleSave=function(vid,iso){ const bi=breakdownIdx(); if(bi<0) return _scheduleSave0(vid,iso);
  const day=readEditor(vid,iso), old=realDay(vid,iso); const nv=day&&day.r?num(day.r[bi]):0, ov=old&&old.r?num(old.r[bi]):0;
  if(nv>0&&ov===0&&!maintFor(vid,iso)){ const key=vid+"|"+iso; if(maintAsking[key]) return; maintAsking[key]=true;
    maintForm(null,{vid,iso,title:`عطل ${esc(laneName(vid))} — يوم ${fd(iso)}`}).then(r=>{ delete maintAsking[key];
      if(r){ _scheduleSave0(vid,iso); markMaintCards(); }
      else { const inp=document.querySelector(`[data-ed="${CSS.escape(key)}"][data-f="r${bi}"]`); if(inp){ inp.value=ov||""; updateDerived(vid,iso,true); } toast("ما انحفظ «أعطال» — لازم طلب صيانة يوضح العطل","err"); } });
    return; }
  _scheduleSave0(vid,iso); };
function markMaintCards(){ document.querySelectorAll("[data-card]").forEach(c=>{ const [vid,iso]=c.dataset.card.split("|"); const m=maintFor(vid,iso); const old=c.querySelector(".mtag"); if(old) old.remove();
  if(m) c.querySelector(".top").insertAdjacentHTML("beforeend",`<a class="mtag" data-mopen="${m.id}">🔧 في الصيانة منذ ${fd(m.opened_on)} — ${esc(m.category)}</a>`); }); }
const _renderEntry0=renderEntry; renderEntry=function(){ _renderEntry0(); markMaintCards(); };
const _renderVehicle0=renderVehicle; renderVehicle=function(){ _renderVehicle0(); const vid=S.vlog&&S.vlog.vid; const m=vid&&S2.maintOpen.find(x=>x.vehicle_id===vid); const el=$("#v-vehicle");
  if(m&&el&&!el.querySelector(".mnote")) el.insertAdjacentHTML("afterbegin",`<div class="notice warn mnote">🔧 السيارة في الصيانة منذ ${fd(m.opened_on)} — ${esc(m.category)}: ${esc(m.description)} <a class="lnk" data-mopen="${m.id}">فتح الطلب</a></div>`); };

  if(!ok||!out.length) return;

function drRepState(){ if(!DRV.rep){ const t=localToday(); DRV.rep={from:t.slice(0,8)+"01",to:t,branch:"",driver:"",data:null,loading:false}; } return DRV.rep; }
async function loadDriverReport(){ const r=drRepState(); r.loading=true; paintDrivers();
  try{ await Promise.all([loadDrivers(),loadDrvMaint(true)]); r.data=await api("fleet_entries",{p_from:r.from,p_to:r.to}); }catch(e){ toast(errMsg(e),"err"); r.data=[]; }
  r.loading=false; paintDrivers(); }
function computeDriverReport(){ const r=drRepState(), c=cfg(), today=localToday(); const by={}, subs=[], vehSub={};
  (r.data||[]).forEach(e=>{ const v=vehById(e.vehicle_id); if(!v) return; const iso=String(e.day).slice(0,10), day=e.data||{}; const x=calcDay(c,v,iso,day,today); if(!x.has) return;
    const all=dayDrivers(v,iso,day,x.a);
    all.forEach(dd=>{ const d=dd.d; const k=d?String(d.id):"?"+(dd.name||""); if(r.branch&&(d?d.branch||v.branch:v.branch)!==r.branch) return;
      const a=x.a*dd.share, t=x.t*dd.share, w=all.length>1?all.filter(o=>o!==dd).map(o=>o.name).join("، "):"";
      const A=by[k]=by[k]||{key:k,d,name:dd.name,branch:d?d.branch||"":v.branch,home:d&&d.vehicle_id,days:new Set(),veh:new Set(),t:0,a:0,own:0,other:0,sub:0,none:0,shared:0,rows:[]};
      A.days.add(iso); A.veh.add(v.id); A.t+=t; A.a+=a; A[dd.kind]+=a; if(w) A.shared++; A.rows.push({iso,v,a,t,kind:dd.kind,w});
      if(dd.kind==="sub"){ subs.push({iso,v,d,home:dd.home,maint:dd.maint,a,t}); const s=vehSub[v.id]=vehSub[v.id]||{v,a:0,days:new Set()}; s.a+=a; s.days.add(iso); } }); });
  Object.values(vehSub).forEach(s=>s.days=s.days.size);
  const list=Object.values(by).sort((a,b)=>b.a-a.a); subs.sort((a,b)=>a.iso<b.iso?-1:1);

/* ================= main dashboard: breakdown cover + customers behind delays (same period as the dashboard) ================= */
function fleetMgmtStats(from,to,branch){ const c=cfg(), today=localToday(), end=to>today?today:to; const li=lateIdx();
  const vs=activeVehicles().filter(v=>branch==="الكل"||!branch||v.branch===branch);
  const B={}; BRANCHES.forEach(b=>B[b]={b,mgr:(c.managers||{})[b]||"",down:0,covered:0,subA:0,subDays:0,late:0,lateDays:0,lateNoCust:0});
  const work=new Map(); const cust=new Map();
  if(to<from) return {B,cust:[]};
  activeVehicles().forEach(v=>{ for(let iso=from; iso<=end; iso=addDays(iso,1)){ const d=getDay(v.id,iso); if(!d) continue; const x=calcDay(c,v,iso,d,today); if(!x.has) continue;
      dayDrivers(v,iso,d,x.a).forEach(dd=>{ if(dd.kind==="sub"&&dd.d){ work.set(dd.d.id+"|"+iso,(work.get(dd.d.id+"|"+iso)||0)+x.a*dd.share); } }); } });
  vs.forEach(v=>{ const R=B[v.branch]; if(!R) return; const home=drvHome(v);
    for(let iso=from; iso<=end; iso=addDays(iso,1)){ const d=getDay(v.id,iso), x=calcDay(c,v,iso,d,today);
      if(vehDown(v.id,iso)&&dayTarget(c,v,iso,d)>0){ R.down++; if(home&&work.has(home.id+"|"+iso)) R.covered++; }
      if(x.has){ dayDrivers(v,iso,d,x.a).forEach(dd=>{ if(dd.kind==="sub"){ R.subA+=x.a*dd.share; } }); }
      if(li!==null&&x.has){ const n=num(d&&d.r?d.r[li]:0); if(n>0){ R.late+=n; R.lateDays++; const lc=Array.isArray(d.lc)?d.lc:[]; if(!lc.length) R.lateNoCust++;
          const k0=lc.filter(o=>o.n!=null).reduce((s,o)=>s+Number(o.n||0),0), unk=lc.filter(o=>o.n==null).length;
          lc.forEach(o=>{ const k=o.code||o.name; const C=cust.get(k)||{name:o.name,code:o.code||"",times:0,n:0,veh:new Set(),branches:new Set(),last:""}; C.times++; C.n+=o.n!=null?Number(o.n):(unk?Math.max(0,n-k0)/unk:0); C.veh.add(vehLabel(v)); C.branches.add(v.branch); if(iso>C.last) C.last=iso; cust.set(k,C); }); } } } });
  return {B,cust:[...cust.values()].sort((a,b)=>b.n-a.n||b.times-a.times)}; }
{ const _rd=renderDashboard; renderDashboard=function(){ _rd(); try{ dashMgmt(); }catch(e){ console.warn("dash mgmt",e); } }; }
function dashMgmt(){ const el=$("#v-dashboard"); if(!el||!S.vehLoaded) return;
  if(!DRV.list||!DRV.maint){ if(!DRV._dl){ DRV._dl=1; Promise.all([loadDrivers(),loadDrvMaint()]).then(()=>{ DRV._dl=0; if(S.view==="dashboard") render(true); }); } return; }
  const M=fleetMgmtStats(S.f.from,S.f.to,S.f.branch); const bs=BRANCHES.filter(b=>S.f.branch==="الكل"||S.f.branch===b).map(b=>M.B[b]);
  const T=bs.reduce((a,x)=>(a.down+=x.down,a.covered+=x.covered,a.subA+=x.subA,a.late+=x.late,a.lateNoCust+=x.lateNoCust,a),{down:0,covered:0,subA:0,late:0,lateNoCust:0});
  const kp=el.querySelector(".kpis"); if(kp&&!kp.querySelector("[data-kcover]")){ kp.style.gridTemplateColumns="repeat(auto-fit,minmax(150px,1fr))"; kp.insertAdjacentHTML("beforeend",`<div class="kpi" data-kcover style="--c:#B42318"><span class="l">تغطية الأعطال بسائق بديل</span><span class="v">${T.down?pct(T.covered/T.down,0):"—"}</span><span class="d">${T.down?`${T.covered} من ${T.down} يوم عطل · ${fmt(T.subA,1)} رد`:"لا توجد أعطال في الفترة"}</span></div>`); }
  const top=M.cust.slice(0,15);
  const html=`<div class="panel" id="dash-mgmt"><h2><span class="step">★</span>حسن تدبير مسؤول الحركة <span class="q">${fd(S.f.from)} ← ${fd(S.f.to>localToday()?localToday():S.f.to)}</span></h2>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">الفرع</th><th class="txt">مسؤول الحركة</th><th>أيام عطل السيارات</th><th>غُطّيت بسائق بديل</th><th>نسبة التغطية</th><th>ردود حققها السائق البديل</th><th>تأخر في الموقع (رد)</th><th>أيام تأخر بدون اسم العميل</th></tr></thead>
    <tbody>${bs.map(x=>`<tr><td class="txt"><b>${x.b}</b></td><td class="txt">${esc(x.mgr)||'<span class="muted">غير محدد</span>'}</td><td>${x.down}</td><td>${x.covered}</td><td><b>${x.down?pct(x.covered/x.down,0):"—"}</b></td><td>${fmt(x.subA,1)}</td><td>${fmt(x.late,1)}</td><td class="${x.lateNoCust?"neg":""}">${x.lateNoCust}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">يوم العطل = يوم عمل والسيارة عليها طلب صيانة مفتوح. «غُطّي» = سائقها اشتغل نفس اليوم على سيارة ثانية وحقق ردود. الردود البديلة محسوبة ضمن محقق السيارات اللي اشتغل عليها، وتفاصيلها في صفحة السائقين ← تقرير ردود السائقين.</p></div>
  <div class="panel" id="dash-late"><h2><span class="step">⏱</span>العملاء المتسببين في التأخير بالموقع <span class="q">نفس الفترة</span></h2>
    ${top.length?`<div class="tbl-wrap"><table><thead><tr><th class="txt">العميل</th><th>الكود</th><th>عدد المرات</th><th>ردود متأثرة</th><th class="txt">السيارات</th><th>آخر مرة</th></tr></thead><tbody>${top.map(x=>`<tr><td class="txt"><b>${esc(x.name)}</b></td><td>${esc(x.code)}</td><td>${x.times}</td><td>${fmt(x.n,1)}</td><td class="txt small">${[...x.veh].slice(0,4).map(esc).join("، ")}${x.veh.size>4?"…":""}</td><td>${fd(x.last)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">ما فيه تأخير مسجل بأسماء عملاء في الفترة.</div>`}
    <div class="row" style="gap:6px;margin-top:8px">${M.cust.length?`<button class="btn sm" id="dash-late-xls">تصدير كل العملاء (${M.cust.length})</button>`:""}${T.lateNoCust?`<span class="small neg">${T.lateNoCust} يوم تأخر مسجل بدون اسم العميل (قبل تفعيل الإلزام).</span>`:""}</div></div>`;
  const anchor=el.querySelector(".kpis")?.nextElementSibling; if(anchor) anchor.insertAdjacentHTML("afterend",html); else el.insertAdjacentHTML("beforeend",html);
  DRV._cust=M.cust; }
document.addEventListener("click",e=>{ if(e.target.closest("#dash-late-xls")) exportXLSX(`العملاء_المتسببين_في_التأخير_${S.f.from}_${S.f.to}.xlsx`,{"العملاء":(DRV._cust||[]).map(x=>({"العميل":x.name,"الكود":x.code,"عدد المرات":x.times,"ردود متأثرة":+x.n.toFixed(2),"الفروع":[...x.branches].join("، "),"السيارات":[...x.veh].join("، "),"آخر مرة":x.last}))}); });

start();
