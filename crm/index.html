  --warn:#F39235; --warn-ink:#F8B678; --warn-soft:#3D2A14;

  --info:#34BEF0; --info-ink:#86D8F7; --info-soft:#123449; --barfill:#34BEF0;

  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0E1C38; --sunk:#14264A; --line:#22365E;
  --ink:#E7EDF7; --muted:#9AAAC8; --brand:#0B2A63; --brand-ink:#FFFFFF;

<script>/* ============ Basics ============ */
let lang='ar';
function ls(k,v){try{if(v===undefined)return localStorage.getItem('alwady_crm_'+k);localStorage.setItem('alwady_crm_'+k,v)}catch(e){return null}}
lang=ls('lang')||'ar';
const L=(a,e)=>lang==='ar'?a:(e??a);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function isoDate(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const TODAY=()=>isoDate(new Date());
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return isoDate(d)}
function addMonths(s,n){const y=+s.slice(0,4),m=+s.slice(5,7)-1+n;return new Date(Date.UTC(y,m,1)).toISOString().slice(0,10)}

function haversine(a,b){if(!a||!b||a.lat==null||b.lat==null||a.lat===''||b.lat==='')return null;const R=6371,toR=x=>x*Math.PI/180;const dLa=toR(b.lat-a.lat),dLo=toR(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const AR_DIG=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function normTxt(s){return AR_DIG(String(s??'')).trim().toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْـ]/g,'').replace(/[\s_\-\.\/\\()#:,'"’]+/g,'')}
const normCode=s=>AR_DIG(String(s??'')).trim().toUpperCase().replace(/\s+/g,'');
const safeId=s=>normCode(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,c=>'_'+c.charCodeAt(0).toString(16)).slice(0,180)||'x';
function parseNum(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;let s=AR_DIG(v).replace(/[٬,\s]/g,'').replace('٫','.').replace(/(ر\.?س|sar|ريال)/gi,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);const n=Number(s);return s!==''&&isFinite(n)?n:NaN}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?NaN:isoDate(v);
  if(typeof v==='number'){if(v<20000||v>80000)return NaN;const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=AR_DIG(v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return fin(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return fin(y,+m[2],+m[1])}
  return NaN;
  function fin(y,mo,d){if(mo<1||mo>12||d<1||d>31||y<1990||y>2100)return NaN;const dt=new Date(Date.UTC(y,mo-1,d));if(dt.getUTCDate()!==d)return NaN;return dt.toISOString().slice(0,10)}
}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(16)}

async function write(col,obj){
  const o=clean(obj);const id=o.id;delete o.id;
  if(mode==='db'){await dbSet(col,id,o);if(col==='impUndo'){}}
  else{const arr=S[col]||(S[col]=[]);const i=arr.findIndex(x=>x.id===id);const full={...o,id};if(i>=0)arr[i]=full;else arr.push(full);dataVer++;scheduleRender()}
}

async function logAudit(e){try{await write('audit',{id:uid('au-'),at:new Date().toISOString(),actor:me().id,reason:'',changes:{},...e})}catch(err){console.warn(err)}}
async function save(col,obj,opts={}){
  const prev=byId(col,obj.id);const now=new Date().toISOString();
  obj={...obj};if(!obj.id)obj.id=uid(col.slice(0,2)+'-');
  if(!prev){obj.createdAt=obj.createdAt||now;obj.createdBy=obj.createdBy||me().id}
  obj.updatedAt=now;if(prev&&prev.lastImport&&!opts.keepImport)obj.lastImport=null;
  const ch=diff(prev,obj);
  if(prev&&!Object.keys(ch).length)return obj;
  try{
    await write(col,obj);
    if(col!=='audit')await write('audit',{id:uid('au-'),at:now,actor:me().id,col,docId:obj.id,action:opts.action||(prev?'update':'create'),changes:ch,reason:opts.reason||''});
  }catch(e){handleErr(e);throw e}
  return obj;
}
async function remove(col,id,reason){
  const prev=byId(col,id);if(!prev)return;
  try{await delDoc(col,id);await logAudit({col,docId:id,action:'delete',changes:{name:[brief(prev.name||prev.title||prev.no||id),'—']},reason:reason||''})}catch(e){handleErr(e);throw e}
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast(L('لا تملك صلاحية الحفظ في هذه الصفحة. اطلب من مالكها صلاحية مساهم.','You can’t save here. Ask the owner for Contributor access.'));
  else if(c==='quota_exceeded')toast(L('امتلأت سعة قاعدة البيانات. احذف سجلات قديمة أو تجريبية.','Storage is full. Delete old or demo records.'));
  else toast(L('تعذّر الحفظ، حاول مرة أخرى.','Could not save. Try again.'));
}
async function pool(tasks,conc,onp){let i=0,done=0;const errs=[];let stop=false;
  async function w(){while(!stop&&i<tasks.length){const k=i++;try{await tasks[k]()}catch(e){errs.push(e);stop=true}done++;onp&&onp(done,tasks.length)}}
  await Promise.all(Array.from({length:Math.min(conc,tasks.length||1)},w));return errs}

  const comp=vw.length?pct(vw.filter(v=>v.status==='done').length,vw.length):null;
  const op=S.opps.filter(o=>o.repId===rid);
  const open=op.filter(o=>!['order','lost'].includes(o.stage));
  const won=op.filter(o=>o.stage==='order').length,lost=op.filter(o=>o.stage==='lost').length;
  const newC=S.clients.filter(c=>c.repId===rid&&inMonth(c.createdAt)).length;
  const dim=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate();const prorate=(+t.slice(8,10))/dim;
  const target=+r.target||0;
  return {sales,coll,planned,done,eff,comp,open:open.length,openVal:open.reduce((s,o)=>s+(+o.value||0),0),conv:(won+lost)?pct(won,won+lost):null,newC,target,tPct:target?pct(sales,target):null,paceOk:!target||sales>=target*prorate*0.7};
}

let ALC={k:'',v:[]};
function computeAlerts(){
  const key=dataVer+'|'+me().id+'|'+TODAY()+'|'+lang;if(ALC.k===key)return ALC.v;
  const A=[];const t=TODAY();const lead=isLead();const C=cfg();const ix=I();
  const push=(sev,cat,title,desc,repId,open)=>A.push({sev,cat,title,desc,repId,open,key:cat+':'+open[0]+':'+open[1]+':'+title});
  vis(S.visits).filter(v=>v.status==='planned'&&v.date<t).forEach(v=>push('bad','visit',L('زيارة متأخرة لم تُنفّذ','Overdue visit'),`${cName(v.clientId)} · ${fdate(v.date)}`,v.repId,['visit',v.id]));
  vis(S.quotes).filter(q=>q.source!=='import'&&q.status==='sent'&&q.sentAt&&daysBetween(q.sentAt.slice(0,10),t)>7).forEach(q=>push('warn','quote',L('عرض سعر بلا رد من العميل','Quote awaiting client reply'),`${q.no} · ${cName(q.clientId)} · ${daysBetween(q.sentAt.slice(0,10),t)} ${L('يوم','days')}`,q.repId,['quote',q.id]));
  if(lead)vis(S.quotes).filter(q=>q.status==='pending'&&q.source!=='import').forEach(q=>push('info','quote',L('عرض سعر ينتظر اعتمادك','Quote needs your approval'),`${q.no} · ${cName(q.clientId)} · ${money(qTotal(q))}`,q.repId,['quote',q.id]));
  vis(S.opps).filter(o=>!['order','lost'].includes(o.stage)&&o.nextDate&&o.nextDate<t).forEach(o=>push('warn','opp',L('فرصة بيع متأخرة المتابعة','Opportunity follow-up overdue'),`${o.title} · ${o.nextStep||''}`,o.repId,['opp',o.id]));
  vis(S.invoices).filter(i=>(+i.amount)-(+i.paid)>0).forEach(i=>{const due=+i.amount-(+i.paid);const dd=daysBetween(t,i.dueDate);if(dd<0)push('bad','money',L('مبلغ متأخر التحصيل','Overdue collection'),`${i.no} · ${cName(i.clientId)} · ${money(due)} · ${-dd} ${L('يوم تأخير','days late')}`,i.repId,['client',i.clientId])});
  vis(S.complaints).filter(c=>c.status!=='closed'&&daysBetween(c.openedAt.slice(0,10),t)>5).forEach(c=>push('bad','complaint',L('شكوى مفتوحة أكثر من 5 أيام','Complaint open 5+ days'),`${cName(c.clientId)} · ${c.desc}`,c.repId,['complaint',c.id]));
  vis(S.samples).filter(s=>s.testResult==='pending'&&s.sentDate&&daysBetween(s.sentDate,t)>14).forEach(s=>push('warn','sample',L('عينة بلا نتيجة اختبار منذ أسبوعين','Sample result pending 2+ weeks'),`${prodName(s.product)} · ${cName(s.consultantId)}`,s.repId,['sample',s.id]));
  vis(S.comms).filter(c=>c.needsReply).forEach(c=>push('warn','comm',L('رسالة عميل تنتظر الرد','Client message awaiting reply'),`${cName(c.clientId)} · ${c.summary}`,c.repId,['comm',c.id]));
  // --- sales intelligence (last 90 days vs the 90 before) ---
  const c0=addDays(t,-89),p1=addDays(t,-179),p0=addDays(t,-90);
  const cur={},prv={},rc={},rp={},gc={};
  for(const r of ix.coll){if(r.d<p1||!rowOK({},r.rep,r.reg))continue;const inC=r.d>=c0;
    if(r.cid){if(inC)cur[r.cid]=(cur[r.cid]||0)+r.amt;else prv[r.cid]=(prv[r.cid]||0)+r.amt}
    if(r.rep){if(inC)rc[r.rep]=(rc[r.rep]||0)+r.amt;else rp[r.rep]=(rp[r.rep]||0)+r.amt}
    if(inC&&r.reg)gc[r.reg]=(gc[r.reg]||0)+r.amt}
  Object.keys({...cur,...prv}).forEach(cid=>{const c=byId('clients',cid);if(!c)return;const p=prv[cid]||0,n=cur[cid]||0;if(!p)return;
    if(n<p*(1-C.declinePct/100))push('warn','pipeline',L('تراجع تحصيل العميل','Customer collections declining'),`${c.name} · ${smoney(n)} ${L('مقابل','vs')} ${smoney(p)} ${L('في الـ90 يوماً السابقة','in prior 90 days')} (${Math.round((n/p-1)*100)}%)`,c.repId,['client',cid]);
    else if(n>p*(1+C.risePct/100))push('good','pipeline',L('ارتفاع ملحوظ في تحصيل العميل','Customer collections up sharply'),`${c.name} · ${smoney(n)} ${L('مقابل','vs')} ${smoney(p)} (+${Math.round((n/p-1)*100)}%)`,c.repId,['client',cid])});
  vis(S.clients).forEach(c=>{const s=segmentOf(c.id,t);if(s==='dormant'){const lt=lastBefore(ix.tx.get(c.id),t);push('warn','pipeline',L('عميل بلا تعاملات حديثة','No recent transactions'),`${c.name} · ${L('آخر تعامل','last')} ${fdate(lt)} (${daysBetween(lt,t)} ${L('يوم','d')})`,c.repId,['client',c.id])}});
  const openByCust={};
  ix.quotes.filter(q=>(q.st==='open'||q.st==='pending')&&rowOK({},q.rep,q.reg)).forEach(q=>{
    const ref=q.src==='import'?['iquote',q.id]:['quote',q.id];
    if(q.cid)openByCust[q.cid]=(openByCust[q.cid]||0)+q.value;
    if(q.value>=C.largeQuote)push('info','pipeline',L('عرض كبير مفتوح','Large open quotation'),`${q.no} · ${q.cname} · ${money(q.value)}`,q.rep,ref);
    if(q.exp){const dd=daysBetween(t,q.exp);if(dd<0)push('bad','pipeline',L('عرض تجاوز تاريخ الإغلاق المتوقع','Quotation past expected close'),`${q.no} · ${q.cname} · ${fdate(q.exp)}`,q.rep,ref);else if(dd<=C.expiryDays)push('warn','pipeline',L('عرض يقترب من الانتهاء','Quotation nearing expiry'),`${q.no} · ${q.cname} · ${dd} ${L('يوم متبقٍ','days left')}`,q.rep,ref)}});
  Object.entries(openByCust).forEach(([cid,v])=>{const la=lastActivity(cid);if(!la||daysBetween(la,t)>30){const c=byId('clients',cid);if(c)push('warn','pipeline',L('عرض مفتوح بلا نشاط مع العميل','Open quote but no recent activity'),`${c.name} · ${money(v)} · ${L('آخر نشاط','last activity')} ${fdate(la)}`,c.repId,['client',cid])}});
  if(lead){
    visibleReps().forEach(r=>{const p=rp[r.id]||0,n=rc[r.id]||0;if(p&&n<p*(1-C.declinePct/100))push('warn','perf',L('تراجع أداء مندوب في التحصيل','Rep collections declining'),`${r.name} · ${smoney(n)} ${L('مقابل','vs')} ${smoney(p)} (${Math.round((n/p-1)*100)}%)`,r.id,['rep',r.id]);
      const st=repStats(r.id);if(st.comp!=null&&st.comp<80)push('warn','perf',L('ضعف الالتزام بخطة الزيارات هذا الأسبوع','Low visit-plan adherence this week'),`${r.name} · ${st.comp}%`,r.id,['rep',r.id])});
    REGIONS.forEach(g=>{if(!rowOK({region:g.id},'',g.id)&&!isMgr())return;const reps=S.team.filter(x=>x.role==='rep'&&x.region===g.id);const tg=reps.reduce((a,r)=>a+(+r.collTarget||0),0)*90/30.4375;if(!tg)return;const a=(gc[g.id]||0)/tg;
      if(a<0.8)push('bad','perf',L('منطقة أقل من مستهدف التحصيل','Region below collection target'),`${L(g.ar,g.en)} · ${Math.round(a*100)}% ${L('من مستهدف آخر 90 يوماً','of last-90-day target')}`,supOf({region:g.id})||'',['region',g.id])});
  }
  const order={bad:0,warn:1,info:2,good:3};A.sort((a,b)=>order[a.sev]-order[b.sev]);
  ALC={k:key,v:A};return A;
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  const hdr=(rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,r[i]??''])));
}

function setProgress(done,total,label){const b=document.getElementById('progBar'),t=document.getElementById('progTxt');if(b)b.style.width=(total?done/total*100:0)+'%';if(t)t.textContent=(label||'')+` ${done} / ${total}`}

function chunkBy(items,maxBytes){const out=[];let cur=[],size=0;for(const it of items){const s=JSON.stringify(it).length;if(cur.length&&size+s>maxBytes){out.push(cur);cur=[];size=0}cur.push(it);size+=s}if(cur.length)out.push(cur);return out}
async function impRun(){
  if(!canImport())return;const res=IMP.res;const type=IMP.tab;
  const work=res.items.filter(i=>['new','update','unmatched'].includes(i.status));
  if(!work.length){toast(L('لا توجد سجلات جديدة للاستيراد','Nothing new to import'));return}
  const impId=uid('imp-');const now=new Date().toISOString();const by=me().id;
  const base={id:impId,type,fileName:IMP.fileName,hash:IMP.hash,at:now,by,period:type==='collections'?{...IMP.period}:{},counts:res.counts,amount:res.amount,status:'pending',chunks:[],undo:[]};
  progressModal(L('جارٍ الاستيراد','Importing'),'');
  try{
    await write('imports',base);
    const undo=[],chunks=[];const tasks=[];
    if(type==='collections'){
      const rows=work.map(i=>i.data);const parts=chunkBy(rows,200000);
      parts.forEach((p,n)=>{const id=impId+'_'+n;chunks.push(id);tasks.push(()=>write('collChunks',{id,importId:impId,rows:p,createdAt:now,createdBy:by}))});
    }else{
      const col=IMP_COL[type];
      work.forEach(it=>{const prev=byId(col,it.id);const p=prev?clean(prev):null;if(p)delete p.id;undo.push({col,id:it.id,prev:p});
        let doc;

          doc.hist=[...(prev?.hist||[]).slice(-19),{at:now,imp:impId,ch:prev?it.ch:'create'}];
        }else if(type==='items'){
          doc=prev?{...prev,...it.data}:{createdAt:now,createdBy:by,...it.data};
        }else{
          doc=prev?{...prev,...it.data,history:[...(prev.history||[]),{at:now,imp:impId,ch:it.ch}]}:{source:'import',history:[],createdAt:now,createdBy:by,importId:impId,...it.data};
        }

    }

    if(errs.length)throw errs[0];
    const undoIds=[];
    if(undo.length){const parts=chunkBy(undo,180000);for(let n=0;n<parts.length;n++){const id=impId+'_u'+n;undoIds.push(id);await write('impUndo',{id,importId:impId,items:parts[n]})}}
    const done=new Date().toISOString();
    await write('imports',{...base,status:'active',chunks,undo:undoIds,doneAt:done});
    await logAudit({col:'imports',docId:impId,action:'import',changes:{[L('الملف','file')]:['—',IMP.fileName],[L('النوع','type')]:['—',L(IMP_DEF[type].ar,IMP_DEF[type].en)],[L('المعالج','processed')]:['—',String(res.counts.processed)],[L('المكرر','duplicates')]:['—',String(res.counts.duplicates)],[L('المرفوض','rejected')]:['—',String(res.counts.rejected)]}});
    try{const all=(S.settings.find(x=>x.id==='impcfg')||{}).types||{};const cur=all[type]||{};await write('settings',{id:'impcfg',types:{...all,[type]:{...cur,lastMap:{...IMP.map}}}})}catch(e){console.warn('impcfg',e)}
    endProgress();closeModal();
    IMP={tab:type,step:'done',last:{...base,status:'active'},period:IMP.period};render();
    toast(L('اكتمل الاستيراد وتم تحديث المؤشرات','Import complete — KPIs updated'));
  }catch(e){endProgress();console.error(e);closeModal();handleErr(e);
    toast(L('توقف الاستيراد قبل اكتماله. يمكنك التراجع عنه من «سجل الاستيراد».','Import stopped before finishing. You can reverse it from Import history.'));render()}
}

  return S.impUndo.filter(u=>u.importId===imp.id).flatMap(u=>u.items||[]);
}
function canReverse(imp){
  if(!canImport()||imp.status==='reversed')return false;
  if(imp.type==='collections')return true;
  const latest=S.imports.filter(i=>i.type===imp.type&&i.status!=='reversed').sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
  return latest&&latest.id===imp.id;
}
async function reverseImport(imp,reason){
  progressModal(L('جارٍ التراجع عن الاستيراد','Reversing import'),'');
  try{
    let skipped=0,restored=0,removed=0;
    if(imp.type!=='collections'){
      const items=await getUndo(imp);const doneAt=imp.doneAt||imp.at;const tasks=[];
      items.forEach(u=>{const cur=byId(u.col,u.id);
        if(cur&&cur.lastImport!==imp.id&&(cur.updatedAt||'')>doneAt){skipped++;return}
        if(u.prev==null){if(cur){removed++;tasks.push(()=>delDoc(u.col,u.id))}}
        else{restored++;tasks.push(()=>write(u.col,{...u.prev,id:u.id}))}});
      const errs=await pool(tasks,4,(d,n)=>setProgress(d,n,L('تمت معالجة','Processed')));if(errs.length)throw errs[0];
    }
    const now=new Date().toISOString();
    await write('imports',{...imp,status:'reversed',reversedAt:now,reversedBy:me().id,reverseReason:reason,reverseStats:{restored,removed,skipped}});
    await logAudit({col:'imports',docId:imp.id,action:'reverse',reason,changes:{[L('الملف','file')]:[imp.fileName,'—'],[L('مُستعاد','restored')]:['—',String(restored)],[L('مُزال','removed')]:['—',String(removed)],[L('متروك لتعديله بعد الاستيراد','skipped (edited later)')]:['—',String(skipped)]}});
    endProgress();closeModal();
    toast(imp.type==='collections'?L('تم التراجع. سجلات هذا الاستيراد محفوظة في السجل ومستبعدة من الحسابات.','Reversed. Records kept in history and excluded from calculations.'):L(`تم التراجع: استعادة ${restored}، إزالة ${removed}${skipped?`، وتُرك ${skipped} سجل عُدّل بعد الاستيراد`:''}`,`Reversed: ${restored} restored, ${removed} removed${skipped?`, ${skipped} edited later were left`:''}`));
  }catch(e){endProgress();closeModal();handleErr(e)}
}

      plugins:{legend:{display:s.series.length>1||s.type==='doughnut',position:'bottom',rtl,labels:{boxWidth:12,usePointStyle:true}},tooltip:{rtl,callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${s.type==='doughnut'?num(c.parsed):fmt(horiz?c.parsed.x:c.parsed.y)}`}}},

function fbar(o={}){

function kpiTable(k){

}

function plCalc(doc){
  const C=cfg();const v=plVat();const ix=I();const mk=doc.month;
  const collByCid={};let outside=0;
  ix.coll.forEach(r=>{if(r.d.slice(0,7)!==mk||!r.cid)return;collByCid[r.cid]=(collByCid[r.cid]||0)+r.amt});
  const used=new Set();
  const rows=(doc.opps||[]).map(o=>{const amt=+parseNum(o.amount)||0;const ex=amt/v;const pr=o.prob===''||o.prob==null?0:+parseNum(o.prob)||0;const prob=pr>1?pr/100:pr;const net=ex*prob;
    const cid=plCustId(o.name,o.cid);let auto=0;if(cid&&!used.has(cid)){auto=collByCid[cid]||0;used.add(cid)}
    const manual=o.actual!==''&&o.actual!=null&&!isNaN(parseNum(o.actual));const actIn=manual?+parseNum(o.actual):auto;const actEx=actIn/v;
    return {o,cid,amt,ex,prob,net,auto,manual,actIn,actEx,diff:actEx-net}});
  // collections in the month from this rep's customers that are not on the sheet
  ix.coll.forEach(r=>{if(r.d.slice(0,7)===mk&&r.rep===doc.repId&&r.cid&&!used.has(r.cid))outside+=r.amt});
  const sum=k=>rows.reduce((s,r)=>s+r[k],0);
  const target=+parseNum(doc.target)||0;const amt=sum('amt'),ex=sum('ex'),net=sum('net'),actIn=sum('actIn')+outside,actEx=actIn/v,auto=sum('auto');
  const b3=(doc.backlog3||[]).reduce((s,b)=>s+(+parseNum(b.value)||0),0),bl=(doc.backlogLater||[]).reduce((s,b)=>s+(+parseNum(b.value)||0),0);
  const nw=rows.filter(r=>r.o.status==='new'),od=rows.filter(r=>r.o.status!=='new');
  const newAct=nw.filter(r=>r.actIn>0).length;
  return {rows,amt,ex,net,actIn,actEx,outside,outsideEx:outside/v,target,cover:target?net/target:null,reqNet:target*(C.pipeCover??1.5),gapNet:net-target*(C.pipeCover??1.5),
    ach:target?actEx/target:null,diff:actEx-net,b3,bl,reqBack:target*(C.backCover??3),backCover:target?b3/(target*(C.backCover??3)):null,
    newCount:newAct,newTarget:+parseNum(doc.newTarget)||0,newVal:nw.reduce((s,r)=>s+r.actEx,0),oldVal:od.reduce((s,r)=>s+r.actEx,0)+outside/v,auto};
}

async function plImportFile(file){
  if(typeof XLSX==='undefined'){toast(L('تعذّر تحميل مكتبة Excel','Excel library failed to load'));return}
  const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});const sheets=[];let yearSeen='';
  wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});const s=plParseSheet(rows,sn);if(s){if(s.year)yearSeen=s.year;sheets.push(s)}});
  sheets.forEach(s=>{if(!s.year)s.year=yearSeen||TODAY().slice(0,4);s.month=s.mi?`${s.year}-${String(s.mi).padStart(2,'0')}`:TODAY().slice(0,7);s.repId=repOf(s.repName)||''});
  if(!sheets.length){toast(L('لم أجد أوراق مندوبين بنفس تنسيق ملف البايب لاين','No rep sheets in the pipeline format were found'));return}
  PLI={file:file.name,sheets,region:me().region||(/jed|جد/i.test(file.name)?'jed':/mak|مك/i.test(file.name)?'mak':'jed')};plImportReview();
}
let PLI=null;
function plParseSheet(rows,sn){
  const cell=(r,c)=>rows[r]?.[c];const txt=(r,c)=>String(cell(r,c)??'').trim();
  const findLab=(lab)=>{for(let r=0;r<10;r++)for(let c=0;c<6;c++)if(normTxt(cell(r,c)).startsWith(lab))return r;return -1};
  const rr=findLab('اسمالمندوب');if(rr<0)return null;
  const val=r=>{for(let c=2;c<8;c++){const v=cell(r,c);if(v!==''&&v!=null)return v}return ''};
  const repName=String(val(rr)).trim();const mr=findLab('الشهر');let mi=0,year='';
  if(mr>=0){for(let c=2;c<8;c++){const v=cell(mr,c);const n=normTxt(v);const k=AR_MONTHS.findIndex(m=>normTxt(m)===n||n.startsWith(normTxt(m)));if(k>=0&&!mi)mi=k+1;if(/^\d{4}$/.test(String(v).trim()))year=String(v).trim();if(v instanceof Date){mi=v.getMonth()+1;year=String(v.getFullYear())}}}
  const tr=findLab('التارجت');const target=tr>=0?parseNum(val(tr)):0;
  let hr=-1;for(let r=0;r<20;r++){if(normTxt(cell(r,1)).startsWith('اسمالعميل')){hr=r;break}}if(hr<0)return null;
  const opps=[],risks=[],b3=[],bl=[];const st=v=>/جديد/.test(v)?'new':'old';const sz=v=>/كبير/.test(v)?'large':/صغير/.test(v)?'small':/متوسط/.test(v)?'medium':'';
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r]||[];if(row.some(v=>{const n=normTxt(v);return n.includes('نسبهالتحقيق')||n==='البيان'}))break;
    const name=txt(r,1);if(name){const pr=parseNum(cell(r,6));opps.push({name,status:st(txt(r,2)),size:sz(txt(r,3)),amount:parseNum(cell(r,4))??'',prob:pr==null||isNaN(pr)?'':(pr<=1?Math.round(pr*1000)/10:pr),actual:parseNum(cell(r,8))??''})}
    const rn=txt(r,12);if(rn)risks.push({name:rn,reason:txt(r,13)});
    const bn=txt(r,14);if(bn)b3.push({name:bn,value:parseNum(cell(r,15))??''});
    const ln=txt(r,16);if(ln)bl.push({name:ln,value:''});
  }
  opps.forEach(o=>{for(const k of ['amount','actual'])if(typeof o[k]==='number'&&isNaN(o[k]))o[k]=''});
  return {sn,repName,mi,year,target:isNaN(target)?0:Math.round(target||0),opps,risks,b3,bl};
}

/* ============ Data integrity & reconciliation ============ */
V.integrity=()=>{
  if(!isMgr())return `<div class="card empty">${L('متاح لمدير النظام ومدير المبيعات.','Available to the admin and sales manager.')}</div>`;
  const ix=I();
  const unm={};ix.coll.filter(r=>!r.cid).forEach(r=>{const k=normCode(r.code);unm[k]=unm[k]||{code:r.code,name:r.cn,n:0,amt:0,last:''};unm[k].n++;unm[k].amt+=r.amt;if(r.d>unm[k].last)unm[k].last=r.d});
  const unmQ={};ix.quotes.filter(q=>q.src==='import'&&!q.cid).forEach(q=>{const k=normCode(q.code);unmQ[k]=unmQ[k]||{code:q.code,name:q.cname,n:0,val:0};unmQ[k].n++;unmQ[k].val+=q.value});
  const codes={};S.clients.forEach(c=>{if(!c.code)return;const k=normCode(c.code);(codes[k]=codes[k]||[]).push(c)});const dupCodes=Object.values(codes).filter(a=>a.length>1);
  const noCode=S.clients.filter(c=>!c.code);const noRep=S.clients.filter(c=>!c.repId||!byId('team',c.repId));
  const vc={};ix.coll.forEach(r=>{const k=normCode(r.v);vc[k]=(vc[k]||0)+1});const dupV=Object.entries(vc).filter(x=>x[1]>1);
  const recon=S.imports.filter(i=>i.type==='collections').map(i=>{const rows=S.collChunks.filter(c=>c.importId===i.id).flatMap(c=>c.rows||[]);const sum=rows.reduce((s,r)=>s+(+r.a||0),0);return {i,id:null,n:rows.length,sum,ok:Math.abs(sum-(i.amount||0))<1&&rows.length===(i.counts?.processed??rows.length)}});
  const okP=b=>b?pill(L('سليم','OK'),'ok'):pill(L('يحتاج مراجعة','Check'),'bad');

/* ============ Field-work views (from v1, preserved) ============ */
V.field=()=>{
  const reps=visibleReps();const st=reps.map(r=>({r,...repStats(r.id)}));
  const sum=k=>st.reduce((s,x)=>s+(x[k]||0),0);
  const sales=sum('sales'),coll=sum('coll'),target=sum('target'),planned=sum('planned'),done=sum('done'),eff=sum('eff'),open=sum('open'),openVal=sum('openVal');
  const op=vis(S.opps);const won=op.filter(o=>o.stage==='order').length,lost=op.filter(o=>o.stage==='lost').length;const tp=pct(sales,target);
  let h=`<div class="kpis">
   ${kpiTile(L('طلبات البيع هذا الشهر','Sales orders this month'),smoney(sales),target?`${tp}% ${L('من مستهدف الطلبات','of order target')} ${smoney(target)}`:L('لا يوجد مستهدف','No target'),meter(tp,tp<50?'w':''))}
   ${kpiTile(L('التحصيل هذا الشهر','Collected this month'),smoney(coll),L('من سندات القبض المستوردة','From imported vouchers'))}
   ${kpiTile(L('الزيارات المنفذة / المخططة','Visits done / planned'),`${done} / ${planned}`,`${L('فعّالة','Effective')}: ${eff} (${pct(eff,done)}%)`,meter(pct(done,planned)))}
   ${kpiTile(L('فرص البيع المفتوحة','Open opportunities'),open,`${smoney(openVal)} · ${L('تحويل','win rate')} ${(won+lost)?pct(won,won+lost)+'%':'—'}`)}</div>`;
  h+=`<div class="card"><h2>${L('أداء المندوبين الميداني','Field performance by rep')}<span class="sub">${L('الشهر الحالي','This month')}</span></h2>`+
   table([{l:L('المندوب','Rep'),f:x=>`<b>${esc(x.r.name)}</b><div class="small muted">${regName(x.r.region)}</div>`},{l:L('طلبات البيع','Orders'),c:'n',f:x=>money(x.sales)},{l:L('المستهدف','Target'),c:'n',f:x=>x.tPct==null?'—':`${x.tPct}%${meter(x.tPct,x.paceOk?'':'w')}`},{l:L('التحصيل','Collected'),c:'n',f:x=>money(x.coll)},{l:L('زيارات','Visits'),c:'n',f:x=>`${x.done}/${x.planned}`},{l:L('فعّالة','Effective'),c:'n',f:x=>x.eff},{l:L('التزام الأسبوع','Week adherence'),c:'n',f:x=>x.comp==null?'—':pill(x.comp+'%',x.comp>=80?'ok':'warn')},{l:L('فرص مفتوحة','Open deals'),c:'n',f:x=>x.open},{l:L('تحويل الفرص','Win rate'),c:'n',f:x=>x.conv==null?'—':x.conv+'%'}],
   st.sort((a,b)=>b.sales-a.sales).map(x=>({...x,id:x.r.id})),'rep')+`</div>`;
  const ordered=vis(S.quotes).filter(q=>q.status==='ordered'&&q.source!=='import');
  const byFam={};ordered.forEach(q=>(q.lines||[]).forEach(l=>{const f=PRODUCTS.find(p=>p.id===l.product)?.fam||'other';byFam[f]=(byFam[f]||0)+(+l.qty||0)*(+l.price||0)*(1-(+q.discount||0)/100)}));
  const openO=op.filter(o=>!['order','lost'].includes(o.stage));
  const st2=OPP_STAGES.filter(s=>!['order','lost'].includes(s[0])).map(s=>{const os=openO.filter(o=>o.stage===s[0]);return {l:L(s[1],s[2]),v:os.reduce((a,o)=>a+(+o.value||0),0),w:os.reduce((a,o)=>a+(+o.value||0)*(+o.prob||0)/100,0),n:os.length}});
  h+=`<div class="grid g2"><div class="card"><h2>${L('تحليل المنتجات (طلبات البيع)','Product analysis (sales orders)')}</h2>${bars(Object.keys(FAMILIES).map(k=>({l:lab(FAMILIES,k),v:byFam[k]||0})).sort((a,b)=>b.v-a.v),smoney)}</div>
   <div class="card"><h2>${L('توقع فرص البيع','Opportunity forecast')}<span class="sub">${L('القيمة × احتمال الفوز','value × win probability')}</span></h2>${table([{l:L('المرحلة','Stage'),f:x=>esc(x.l)},{l:L('عدد','Count'),c:'n',f:x=>x.n},{l:L('القيمة','Value'),c:'n',f:x=>smoney(x.v)},{l:L('المرجّحة','Weighted'),c:'n',f:x=>smoney(x.w)}],st2)}</div></div>`;
  return h;
};
function routeKm(vs){let km=0;for(let i=1;i<vs.length;i++){const a=byId('clients',vs[i-1].clientId),b=byId('clients',vs[i].clientId);km+=haversine(a,b)||0}return km}
V.plan=()=>{
  const reps=visibleReps();let rid=fv('planRep',role()==='rep'?me().id:(reps[0]?.id||''));if(!reps.some(r=>r.id===rid))rid=reps[0]?.id||'';
  const ws=fv('planWeek',weekStart(TODAY()));const days=[0,1,2,3,4].map(i=>addDays(ws,i));
  const wk=S.visits.filter(v=>v.repId===rid&&v.date>=ws&&v.date<=addDays(ws,6));
  const wd=wk.filter(v=>v.status==='done').length,wp=wk.filter(v=>v.planned!==false).length;
  let h=`<div class="toolbar">${isLead()?`<select id="planRep" data-act="filtSel" data-k="planRep">${opt(reps.map(r=>[r.id,r.name]),rid)}</select>`:''}
   <button class="btn" data-act="week" data-d="-7">${L('الأسبوع السابق','Prev week')}</button><b>${fdate(ws)} – ${fdate(addDays(ws,4))}</b><button class="btn" data-act="week" data-d="7">${L('الأسبوع التالي','Next week')}</button>
   <span class="grow"></span><span class="pill ${pct(wd,wp)>=80?'ok':'warn'}">${L('الالتزام','Adherence')}: ${wd}/${wp}</span></div>`;
  h+=`<div class="week">${days.map(d=>{const vs=wk.filter(v=>v.date===d).sort((a,b)=>(a.seq||0)-(b.seq||0));const km=routeKm(vs);
   return `<div class="day ${d===TODAY()?'today':''}"><h4><span>${new Date(d+'T12:00:00').toLocaleDateString(loc(),{weekday:'long'})} ${fdate(d)}</span><span class="muted small">${vs.length?`${km.toFixed(1)} ${L('كم','km')}`:''}</span></h4>
    ${vs.map(v=>{const c=byId('clients',v.clientId);const fl=visitFlags(v);return `<div class="pv" data-open="visit" data-id="${v.id}"><span class="seq">${v.seq||'·'}</span><div style="min-width:0;flex:1"><b>${esc(c?.name||'—')}</b><div class="small muted">${esc(c?.district||'')}${v.projectId?' · '+esc(pName(v.projectId)):''}</div>${v.status==='done'?pill(L('منفذة','Done'),'ok'):v.status==='cancelled'?pill(L('ملغاة','Cancelled')):fl.length?pill(fl[0][1],'bad'):pill(L('مخططة','Planned'),'info')}</div></div>`}).join('')}
    <div class="toolbar"><button class="btn s" data-act="addPlan" data-d="${d}" data-r="${rid}">+ ${L('زيارة','Visit')}</button>${vs.filter(v=>v.status==='planned').length>2?`<button class="btn s" data-act="optimize" data-d="${d}" data-r="${rid}">${L('ترتيب مقترح','Optimise route')}</button>`:''}</div></div>`}).join('')}</div>`;
  const t=TODAY();

/* ============ Forms ============ */
let FORM=null;
function field(f,val){
  if(f.t==='html')return f.html||'';
  const req=f.req?' <span class="req">*</span>':'';const id='f_'+f.k;const ro=f.ro?'disabled':'';let inp='';
  if(f.t==='sel')inp=`<select id="${id}" name="${f.k}" ${ro}>${opt(f.opts,val,f.empty??'—')}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}" ${ro}>${esc(val??'')}</textarea>`;
  else if(f.t==='check')inp=`<div class="chk"><label><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''} ${ro}> ${f.cl||''}</label></div>`;
  else if(f.t==='multi')inp=`<div class="chk">${f.opts.map(([v,l])=>`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(val||[]).includes(v)?'checked':''}> ${esc(l)}</label>`).join('')}</div>`;
  else if(f.t==='rows'){FORM.rows[f.k]=(val||[]).map(x=>({...x}));inp=`<div class="rows" id="rows_${f.k}"></div><button type="button" class="btn s" data-act="addRow" data-k="${f.k}">+ ${f.add||L('إضافة','Add')}</button>`}
  else inp=`<input id="${id}" name="${f.k}" type="${f.t==='num'?'number':f.t==='date'?'date':'text'}" ${f.t==='num'?'step="any"':''} value="${esc(val??'')}" ${ro} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld ${f.full||['area','rows','multi'].includes(f.t)?'full':''}"><label for="${id}">${f.l}${req}</label>${inp}${f.hint?`<span class="small muted">${f.hint}</span>`:''}</div>`;
}
function renderRows(k){
  const f=FORM.fields.find(x=>x.k===k);const box=document.getElementById('rows_'+k);if(!box)return;
  box.innerHTML=FORM.rows[k].map((r,i)=>`<div class="rowi">${f.sub.map(s=>`<div class="fld"><label class="small">${s.l}</label>${s.t==='sel'?`<select data-row="${k}" data-i="${i}" data-sk="${s.k}">${opt(s.opts,r[s.k],'—')}</select>`:`<input data-row="${k}" data-i="${i}" data-sk="${s.k}" type="${s.t==='num'?'number':'text'}" step="any" value="${esc(r[s.k]??'')}">`}</div>`).join('')}<button type="button" class="btn s d" data-act="delRow" data-k="${k}" data-i="${i}">${L('حذف','Remove')}</button></div>`).join('')||`<div class="small muted">${L('لا توجد بنود','No lines')}</div>`;
}
function openForm({title,fields,data={},onSave,extra='',del}){
  FORM={fields,rows:{},onSave,data,del};
  const html=`<form id="theform" novalidate>${extra}<div class="fgrid">${fields.map(f=>field(f,data[f.k])).join('')}</div><div id="ferr" class="flag"></div><div class="formbar">${del?`<button type="button" class="btn d" data-act="formDel">${L('حذف','Delete')}</button>`:''}<span class="grow" style="flex:1"></span><button type="button" class="btn" data-act="closeModal">${L('إلغاء','Cancel')}</button><button type="submit" class="btn p">${L('حفظ','Save')}</button></div></form>`;
  openModal(title,html);fields.filter(f=>f.t==='rows').forEach(f=>renderRows(f.k));
}
function collect(){
  const out={};const form=document.getElementById('theform');
  FORM.fields.forEach(f=>{
    if(f.t==='html')return;
    if(f.ro){out[f.k]=FORM.data[f.k];return}
    if(f.t==='multi')out[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.t==='check')out[f.k]=form.querySelector(`[name="${f.k}"]`).checked;
    else if(f.t==='rows')out[f.k]=FORM.rows[f.k].map(r=>{const o={...r};f.sub.forEach(s=>{if(s.t==='num')o[s.k]=+o[s.k]||0});return o});
    else{const v=form.querySelector(`[name="${f.k}"]`).value;out[f.k]=f.t==='num'?(v===''?null:+v):v.trim()}
  });return out;
}
async function submitForm(){
  const vals=collect();const miss=FORM.fields.filter(f=>f.req&&(vals[f.k]==null||vals[f.k]===''||(Array.isArray(vals[f.k])&&!vals[f.k].length)));
  if(miss.length){document.getElementById('ferr').textContent=L('أكمل الحقول المطلوبة: ','Please complete: ')+miss.map(f=>f.l).join('، ');return}
  try{await FORM.onSave(vals);closeModal();toast(L('تم الحفظ','Saved'))}catch(e){console.error(e)}
}

async function stampPhoto(file,label){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,720/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);g.fillStyle='rgba(5,29,72,.75)';g.fillRect(0,cv.height-34,cv.width,34);g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textBaseline='middle';g.fillText(label,10,cv.height-17);
  return cv.toDataURL('image/jpeg',0.6);
}

async function optimizeDay(date,rid){
  const vs=S.visits.filter(v=>v.repId===rid&&v.date===date&&v.status==='planned').sort((a,b)=>(a.seq||0)-(b.seq||0));if(vs.length<3)return;const before=routeKm(vs);
  const rest=[...vs];const outv=[rest.shift()];
  while(rest.length){const last=byId('clients',outv[outv.length-1].clientId);let bi=0,bd=1e9;rest.forEach((v,i)=>{const d=haversine(last,byId('clients',v.clientId))??1e6;if(d<bd){bd=d;bi=i}});outv.push(rest.splice(bi,1)[0])}
  const after=routeKm(outv);if(after>=before-0.05){toast(L('الترتيب الحالي هو الأقصر','Current order is already shortest'));return}
  for(let i=0;i<outv.length;i++)if(outv[i].seq!==i+1)await save('visits',{...outv[i],seq:i+1});
  toast(L(`تم الترتيب: ${before.toFixed(1)} ← ${after.toFixed(1)} كم`,`Reordered: ${before.toFixed(1)} → ${after.toFixed(1)} km`));
}

async function writeAllDemo(title){
  const D=demoData(TODAY());const tasks=[];const partial=(metaDoc().demoVer||0)>=2&&hasDemo();
  for(const [col,arr] of Object.entries(D)){if(partial&&col!=='pipeline')continue;for(const o of arr)tasks.push(()=>write(col,o))}
  if(!S.settings.find(x=>x.id==='kpi'))tasks.push(()=>write('settings',{id:'kpi',...clean(DEFAULT_CFG)}));
  progressModal(title,'');
  const errs=await pool(tasks,4,(d,n)=>setProgress(d,n,L('تم حفظ','Saved')));
  if(!errs.length)await write('settings',{id:'meta',demoVer:DEMO_VER,upgradedAt:new Date().toISOString(),by:me().id});
  endProgress();closeModal();
  if(errs.length){handleErr(errs[0]);return false}
  await logAudit({col:'system',docId:'demo',action:'upgrade',changes:{[L('البيانات التجريبية','demo data')]:['—','v'+DEMO_VER]}});
  return true;
}

  await logAudit({col:'system',docId:'demo',action:'delete',changes:{[L('البيانات التجريبية','demo data')]:[String(tasks.length),'0']}});

}

let rq=0;

function render(){
  const ae=document.activeElement;const aid=ae&&ae.id&&ae.closest('#view, #top')?ae.id:null;const sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const cur=NAV.find(n=>n[0]===route);if(cur&&cur[3]&&!cur[3]())route='dash';
  renderChrome();
  let body='';CHQ.length=0;
  if(mode==='init'||(mode==='db'&&!(loaded.has('team')&&loaded.has('clients')&&loaded.has('collChunks')&&loaded.has('imports'))))body=`<div class="card empty">${L('جارٍ تحميل البيانات…','Loading…')}</div>`;
  else{try{body=banners()+(V[route]?V[route]():'')}catch(e){console.error(e);body=`<div class="card empty">${L('حدث خطأ في عرض الصفحة','Something went wrong')}</div>`}}
  document.getElementById('view').innerHTML=body;
  if(aid){const el=document.getElementById(aid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(drawer)refreshDrawer();
  mountCharts();
}

/* ---- pipeline: fill the rep's sheet from his customers, open quotations and open orders ---- */
function plSources(rep,month){
  const repOfQ=q=>q.repId||byId('clients',q.clientId)?.repId||'';
  const mEnd=addMonths(month+'-01',1);const b3End=addMonths(month+'-01',4);
  const qs=S.quotes.filter(q=>repOfQ(q)===rep&&['open','pending','accepted'].includes(q.status)&&!(q.status==='accepted'&&q.closeDate&&q.closeDate<month+'-01')&&!S.orders.some(o=>o.quoteId===q.id||(o.quoteNo&&normCode(o.quoteNo)===normCode(q.no))));
  const os=S.orders.filter(o=>o.repId===rep&&(o.status==='open'||o.status==='partial'));
  return {qs,os,mEnd,b3End};
}
function plFillFromQuotes(){
  const {rep,month}=plCurrent();if(!plCanEdit(rep))return;const d=PL.doc;const {qs,os,mEnd,b3End}=plSources(rep,month);
  const have=new Set([...(d.opps||[]),...(d.backlog3||[]),...(d.backlogLater||[])].map(o=>normTxt(o.name)));
  const sizeOf=v=>v>=500000?'large':v>=100000?'medium':'small';
  const newDays=cfg().newDays||90;const isNew=cid=>{const c=byId('clients',cid);if(!c)return true;if(c.status==='prospect')return true;const at=c.createdAt||'';return at&&daysBetween(at.slice(0,10),TODAY())<=newDays&&!(c.histValue>0)};
  let a=0,b=0,c=0;
  const byClient=new Map();
  os.forEach(o=>{const k=o.clientId||normCode(o.clientCode);const x=byClient.get(k)||{name:o.cname||cName(o.clientId),cid:o.clientId,amt:0,prob:90,when:month+'-01',src:'order'};x.amt+=+o.value||0;byClient.set(k,x)});
  qs.forEach(q=>{const when=q.expClose||q.date||'';const k=q.clientId||normCode(q.clientCode);const pr=q.status==='accepted'?80:q.status==='pending'?50:30;
    if(!when||when<mEnd){const x=byClient.get(k)||{name:q.cname||cName(q.clientId),cid:q.clientId,amt:0,prob:pr,when,src:'quote'};x.amt+=+q.value||0;x.prob=Math.max(x.prob,pr);byClient.set(k,x)}
    else{const nm=q.cname||cName(q.clientId);if(have.has(normTxt(nm)))return;const row={name:nm,value:+q.value||0};if(when<b3End){(d.backlog3=d.backlog3||[]).push(row);b++}else{(d.backlogLater=d.backlogLater||[]).push(row);c++}have.add(normTxt(nm))}});
  byClient.forEach(x=>{if(!x.name||have.has(normTxt(x.name)))return;(d.opps=d.opps||[]).push({name:x.name,cid:x.cid||'',status:isNew(x.cid)?'new':'old',size:sizeOf(x.amt),amount:Math.round(x.amt),prob:x.prob,actual:''});have.add(normTxt(x.name));a++});
  if(!a&&!b&&!c){toast(L('لا توجد عروض أسعار أو أوامر بيع مفتوحة جديدة لهذا المندوب','No new open quotations or orders for this rep'));return}
  plDirty();render();toast(L(`أُضيف ${a} عميل للشهر، و${b} للـ Back log خلال 3 أشهر، و${c} بعدها. راجع النسب ثم احفظ.`,`Added ${a} for the month, ${b} to 3-month backlog, ${c} later. Review and save.`));
}

  const box=`<div class="banner info"><span class="sp">${L(`عملاء المندوب: <b>${mine}</b> · عروض أسعار مفتوحة: <b>${qs.length}</b> (${smoney(qs.reduce((s,q)=>s+(+q.value||0),0))}) · أوامر بيع مفتوحة: <b>${os.length}</b>. اضغط «تعبئة من العروض والأوامر» ليُبنى البايب لاين منها: المتوقع إغلاقه هذا الشهر في جدول الفرص، والباقي في الـ Back log حسب تاريخ الإغلاق المتوقع.`,`Rep customers: <b>${mine}</b> · open quotations: <b>${qs.length}</b> · open orders: <b>${os.length}</b>. Use “Fill from quotations & orders” to build the sheet.`)}</span>${qs.length||os.length?`<button class="btn s p" data-act="plFromQuotes">${L('تعبئة من العروض والأوامر','Fill from quotations & orders')}</button>`:''}</div>`;

/* ============ Verified field visits: real GPS, distance check, server time, photos in storage ============ */
const VISIT_RADIUS=()=>+(cfg().visitRadiusM||300);           // metres from the customer's site
const GPS_MAX_ACC=()=>+(cfg().gpsMaxAccM||150);               // accuracy worse than this is flagged
function getGPS(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error(L('الجهاز لا يدعم تحديد الموقع','This device has no location service')));
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),t:new Date().toISOString(),src:'gps'}),
      e=>rej(new Error(e.code===1?L('رفضت إذن الموقع. فعّل الموقع لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة.','Location permission denied. Allow location in the browser settings and retry.'):e.code===3?L('انتهت مهلة تحديد الموقع — تأكد إن GPS شغّال وجرب مرة ثانية.','Timed out — make sure GPS is on and retry.'):L('تعذّر تحديد الموقع','Could not get the location'))),
      {enableHighAccuracy:true,timeout:25000,maximumAge:0});
  });
}
const distM=(a,b)=>{const k=haversine(a,b);return k==null?null:Math.round(k*1000)};
const fmtDist=m=>m==null?'—':m<1000?`${m} ${L('م','m')}`:`${(m/1000).toFixed(1)} ${L('كم','km')}`;
function gpsBox(g,c){
  if(!g)return `<div class="banner"><span class="sp">${L('جاري تحديد موقعك من GPS…','Getting your GPS location…')}</span></div>`;
  const d=distM(g,c);const far=d!=null&&d>VISIT_RADIUS();const weak=g.acc>GPS_MAX_ACC();
  return `<dl class="kv card"><dt>${L('موقعك الآن','Your location')}</dt><dd dir="ltr">${g.lat}, ${g.lng} <a href="https://maps.google.com/?q=${g.lat},${g.lng}" target="_blank" rel="noopener">${L('خريطة','map')}</a></dd>
   <dt>${L('دقة GPS','GPS accuracy')}</dt><dd>±${g.acc} ${L('م','m')} ${weak?pill(L('ضعيفة','weak'),'warn'):pill(L('جيدة','good'),'ok')}</dd>
   <dt>${L('البعد عن موقع العميل','Distance to site')}</dt><dd>${c&&c.lat!=null&&c.lat!==''?`${fmtDist(d)} ${far?pill(L('خارج النطاق','outside range'),'bad'):pill(L('داخل النطاق','in range'),'ok')}`:`<span class="muted">${L('العميل ما له موقع مسجل','No site location on file')}</span>`}</dd></dl>
   ${far?`<div class="banner bad"><span class="sp">${L(`أنت على بعد ${fmtDist(d)} من موقع العميل (المسموح ${VISIT_RADIUS()} م). تقدر تكمل، بس الزيارة بتظهر للمشرف كـ«بعيدة عن الموقع» واكتب السبب.`,`You are ${fmtDist(d)} away (allowed ${VISIT_RADIUS()} m). You can continue but it will be flagged; give a reason.`)}</span></div>`:''}`;
}

async function stampPhoto2(file,label){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,1280/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);const lines=String(label).split('\n');const h=22*lines.length+12;
  g.fillStyle='rgba(5,29,72,.78)';g.fillRect(0,cv.height-h,cv.width,h);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textBaseline='middle';
  lines.forEach((ln,i)=>g.fillText(ln,10,cv.height-h+17+i*22));
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.72));
}
async function storePhoto(blob){
  try{const a=await window.claude?.use?.('assets');if(a){const r=await a.upload(new File([blob],'visit.jpg',{type:'image/jpeg'}));return r.url}}catch(e){console.warn('photo upload',e)}
  return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
}

visitFlags=function(v){
  const f=[];const c=byId('clients',v.clientId);const t=TODAY();const R=VISIT_RADIUS();
  if(v.status==='planned'&&v.date<t)f.push(['missed',L('فائتة','Missed')]);
  const ci=v.checkIn,co=v.checkOut;
  if(ci){
    if(ci.src==='none'||ci.lat===''||ci.lat==null)f.push(['nogps',L('بدون موقع GPS','No GPS')+(ci.reason?` — ${ci.reason}`:'')]);
    else{const d=ci.dist!=null?ci.dist:distM(ci,c);if(d!=null&&d>R)f.push(['far',L('بعيدة عن موقع العميل','Away from site')+` (${fmtDist(d)})`]);
      if(ci.acc!=null&&ci.acc>GPS_MAX_ACC())f.push(['lowacc',L('دقة GPS ضعيفة','Weak GPS')+` (±${ci.acc} ${L('م','m')})`])}
    if(ci.srv&&ci.t&&Math.abs(new Date(ci.srv)-new Date(ci.t))>30*6e4)f.push(['late',L('وقت الجهاز يختلف عن وقت الخادم','Device time differs from server')]);
  }
