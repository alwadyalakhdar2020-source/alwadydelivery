/* ============ Communication Center — phases 5–7: client history, call outcome, dashboard ============ */
const CM_OUT=[['reached','تم التواصل'],['interested','مهتم'],['quote','يطلب عرض سعر'],['visit','يطلب زيارة'],['complaint','شكوى / ملاحظة'],['not_interested','غير مهتم'],['no_answer','لم يرد'],['wrong','رقم خاطئ']];
const CM_ST={ringing:['يرن','info'],answered:['تم الرد','ok'],completed:['مكتملة','ok'],missed:['فائتة','bad'],busy:['مشغول','warn'],failed:['فشلت','bad'],transferred:['محوّلة','info'],
  received:['واردة','info'],queued:['بالانتظار',''],sent:['أُرسلت',''],delivered:['وصلت','info'],read:['قُرئت','ok']};
const cmDur=s=>{s=Math.round(+s||0);if(!s)return '—';const m=Math.floor(s/60),x=s%60;return m?`${m}:${String(x).padStart(2,'0')}`:`${x} ث`};
const cmSt=s=>{const v=CM_ST[s];return v?pill(v[0],v[1]):pill(s||'—')};
const CMT={};  // client id -> timeline cache

function cmTimelineHtml(id){const t=CMT[id];const manual=(S.comms||[]).filter(c=>c.clientId===id);const tasks=(typeof tkAll==='function'?tkAll():(S.tasks||[])).filter(x=>x.clientId===id);
  if(!t)return `<div class="muted small">${L('جاري تحميل سجل التواصل…','Loading…')}</div>`;
  if(t.err)return `<div class="muted small">${esc(t.err)}</div>`;
  const items=[
    ...(t.calls||[]).map(c=>({at:c.at,h:`<div class="li"><div class="main"><div class="t">📞 ${c.dir==='in'?L('مكالمة واردة','Incoming call'):L('مكالمة صادرة','Outgoing call')} ${cmSt(c.status)} <span class="small muted">${cmDur(c.duration_s)}</span></div>
      <div class="m">${fdt(c.at)} · ${esc(c.user||'—')} · <span dir="ltr">${esc(c.number||'')}</span></div>${(c.notes||[]).map(n=>`<div class="m">📝 ${esc((CM_OUT.find(o=>o[0]===n.outcome)||[,n.outcome||''])[1])}${n.note?' — '+esc(n.note):''} <span class="muted">(${esc(n.by||'')})</span></div>`).join('')}</div>
      <div class="end"><button class="btn s" data-act="cmOutcome" data-id="${c.id}" data-c="${esc(id)}">${L('النتيجة','Outcome')}</button></div></div>`})),
    ...(t.messages||[]).map(m=>({at:m.at,h:`<div class="li"><div class="main"><div class="t">${m.channel==='whatsapp'?'🟢 WhatsApp':'✉️ SMS'} ${m.dir==='in'?L('وارد','in'):L('صادر','out')} ${cmSt(m.status)}</div><div class="m">${esc(m.template?'['+m.template+'] ':'')}${esc(m.body||(m.type!=='text'?m.type:''))}</div><div class="m">${fdt(m.at)} · ${esc(m.user||'—')}</div></div></div>`})),
    ...manual.map(c=>({at:c.at,h:`<div class="li" data-open="comm" data-id="${c.id}"><div class="main"><div class="t">🗒️ ${L('ملاحظة تواصل','Logged contact')} · ${lab(CHANNELS,c.channel)} ${c.dir==='in'?L('وارد','in'):L('صادر','out')}</div><div class="m">${esc(c.summary||'')}</div><div class="m">${fdt(c.at)} · ${esc(tName(c.repId))}</div></div></div>`})),
    ...tasks.map(x=>({at:(x.date||'')+'T'+(x.time||'00:00'),h:`<div class="li" data-act="tkOpen" data-id="${x.id}"><div class="main"><div class="t">${(TASK_KINDS[x.kind]||[])[2]||'📌'} ${esc(x.title||'')}</div><div class="m">${fdate(x.date)}${x.time?' '+x.time:''} · ${esc(tName(x.repId))}</div></div><div class="end">${x.status==='done'?pill(L('منجزة','Done'),'ok'):pill(L('مفتوحة','Open'),'info')}</div></div>`}))
  ].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))).slice(0,60);
  return items.length?`<div class="list">${items.map(i=>i.h).join('')}</div>`:`<div class="muted small">${L('لا يوجد تواصل مسجّل بعد','Nothing yet')}</div>`}
async function cmTimelineLoad(id){try{CMT[id]=await cmRpc('comm_timeline',{p_client:id})}catch(e){CMT[id]={err:e.message}}const el=document.getElementById('cm-tl');if(el&&el.dataset.c===id)el.innerHTML=cmTimelineHtml(id)}
{const _oc=OPEN.client;OPEN.client=(id,refresh)=>{_oc(id,refresh);const mb=document.getElementById('mbody');if(!mb||!byId('clients',id))return;
  const h=sec(L('سجل التواصل','Communication history'),`<button class="btn s" data-act="newComm" data-c="${esc(id)}">+ ${L('ملاحظة','Note')}</button>`,`<div id="cm-tl" data-c="${esc(id)}">${cmTimelineHtml(id)}</div>`);
  const first=mb.querySelector('.sec');if(first)first.insertAdjacentHTML('beforebegin',h);else mb.insertAdjacentHTML('beforeend',h);
  if(!refresh||!CMT[id])cmTimelineLoad(id)}}

  {k:'task',l:L('مهمة متابعة','Follow-up'),t:'check',cl:L('إنشاء مهمة متابعة','Create a follow-up task')},{k:'tdate',l:L('تاريخ المتابعة','Follow-up date'),t:'date'}],

/* ---- dashboard ---- */
const CD={d:null,busy:false,err:null,key:''};
function cdF(){const t=TODAY();return {from:fv('cd_from',t.slice(0,8)+'01'),to:fv('cd_to',t),user:fv('cd_user',''),sup:fv('cd_sup',''),region:fv('cd_reg',''),ch:fv('cd_ch','')}}
async function cdLoad(){const f=cdF(),k=JSON.stringify(f);if(CD.busy)return;CD.busy=true;
  try{CD.d=await cmRpc('comm_dashboard',{p_from:f.from,p_to:f.to,p_user:f.user||null,p_sup:f.sup||null,p_region:f.region||null,p_channel:f.ch||null});CD.err=null;CD.key=k}catch(e){CD.err=e.message;CD.key=k}
  CD.busy=false;if(route==='commdash')render()}
const cdT=s=>{s=+s;if(!s&&s!==0||isNaN(s))return '—';if(s<60)return Math.round(s)+L(' ث',' s');if(s<3600)return Math.round(s/60)+L(' د',' min');return (s/3600).toFixed(1)+L(' س',' h')};
const cdN=v=>v==null?'—':(+v).toLocaleString('en-US');
V.commdash=()=>{const f=cdF(),k=JSON.stringify(f);if(CD.key!==k&&!CD.busy)cdLoad();
  const sel=(id,opts,val,all)=>`<select id="${id}" data-act="filtSel" data-k="${id}">${`<option value="">${all}</option>`}${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const team=S.team.filter(t=>t.id===me().id||inScope({repId:t.id}));const sups=S.team.filter(t=>t.role==='sup');
  const bar=`<div class="toolbar" style="flex-wrap:wrap;gap:6px"><label class="small">${L('من','From')} <input type="date" id="cd_from" data-act="filtSel" data-k="cd_from" value="${f.from}"></label><label class="small">${L('إلى','To')} <input type="date" id="cd_to" data-act="filtSel" data-k="cd_to" value="${f.to}"></label>
    ${team.length>1?sel('cd_user',team.map(t=>[t.id,t.username||t.name]),f.user,L('كل الموظفين','All employees')):''}${isMgr()||isAdmin()?sel('cd_sup',sups.map(t=>[t.id,t.username||t.name]),f.sup,L('كل المشرفين','All supervisors')):''}
    ${sel('cd_reg',REGIONS.map(r=>[r.id,L(r.ar,r.en)]),f.region,L('كل المناطق','All regions'))}${sel('cd_ch',[['call',L('مكالمات','Calls')],['whatsapp','WhatsApp'],['sms','SMS']],f.ch,L('كل القنوات','All channels'))}</div>`;
  const d=CD.d;if(!d)return bar+`<div class="card empty">${CD.err?esc(CD.err):L('جاري التحميل…','Loading…')}</div>`;
  const T=d.totals||{};const k2=(l,v,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div></div>`;
  const cost=(+T.cost_calls||0)+(+T.cost_msgs||0);
  return bar+(!d.live?`<div class="banner info"><span class="sp">${L('لا يوجد مزوّد اتصالات فعلي مفعّل بعد، فاللوحة فاضية. تعرض بيانات حقيقية فقط وتبدأ تمتلئ تلقائياً بعد ربط المزوّد (المرحلتان 3 و4).','No live provider yet — the dashboard shows real data only and fills once a provider is connected.')}</span></div>`:'')
   +(!d.hours_set?`<div class="banner warn"><span class="sp">${L('ساعات العمل الرسمية غير محددة، فالتنبيهات والتصعيد متوقفة. حددها من «إعدادات مركز التواصل».','Working hours are not set, so alerts are paused.')}</span></div>`:'')
   +`<div class="kpis">${k2(L('إجمالي المكالمات','Calls'),cdN(T.calls))}${k2(L('واردة / صادرة','In / out'),`${cdN(T.c_in)} / ${cdN(T.c_out)}`)}${k2(L('مجابة / فائتة (الوارد)','Answered / missed'),`${cdN(T.ans_in)} / ${cdN(T.miss_in)}`)}
     ${k2(L('نسبة الرد على الوارد','Answer rate'),T.answer_rate==null?'—':T.answer_rate+'%')}${k2(L('متوسط زمن الرد','Avg time to answer'),cdT(T.avg_ring_s))}${k2(L('متوسط مدة المكالمة','Avg call length'),cdT(T.avg_dur_s))}
     ${k2(L('رسائل واردة / صادرة','Messages in / out'),`${cdN(T.msg_in)} / ${cdN(T.msg_out)}`)}${k2(L('رسائل بلا رد','Unanswered messages'),cdN(T.no_reply),T.no_reply?'bad':'')}${k2(L('متوسط زمن الاستجابة للرسائل','Avg reply time'),cdT(T.avg_reply_s))}
     ${k2(L('فائتة لم يُعد الاتصال بها','Missed, not returned'),cdN(T.missed_not_returned),T.missed_not_returned?'bad':'')}${k2(L('مهام متابعة مفتوحة','Open follow-ups'),cdN(T.tasks_open))}${k2(L('تنبيهات متأخرة (مصعّدة)','Escalated alerts'),cdN(T.alerts_late),T.alerts_late?'bad':'')}
     ${k2(L('تكلفة الاتصالات','Cost'),cost?cost.toLocaleString('en-US',{maximumFractionDigits:2}):'—')}</div>
   <div class="card"><h3>${L('مقارنة الموظفين','By employee')}</h3>${table([{l:L('الموظف','Employee'),f:u=>`<b>${esc(u.name)}</b>`},{l:L('مكالمات','Calls'),f:u=>cdN(u.calls)},{l:L('وارد','In'),f:u=>cdN(u.in)},{l:L('صادر','Out'),f:u=>cdN(u.out)},
     {l:L('نسبة الرد','Answer rate'),f:u=>u.in?Math.round(u.answered/u.in*100)+'%':'—'},{l:L('فائتة','Missed'),f:u=>cdN(u.missed)},{l:L('متوسط المدة','Avg length'),f:u=>cdT(u.avg_dur_s)},
     {l:L('رسائل وارد/صادر','Msgs in/out'),f:u=>`${cdN(u.msg_in)} / ${cdN(u.msg_out)}`},{l:L('بلا رد','Unanswered'),f:u=>cdN(u.no_reply)},{l:L('زمن الاستجابة','Reply time'),f:u=>cdT(u.avg_reply_s)},{l:L('تنبيهات مفتوحة','Open alerts'),f:u=>cdN(u.alerts)}],d.by_user||[])}</div>
   <div class="card"><h3>${L('مقارنة المناطق','By region')}</h3>${table([{l:L('المنطقة','Region'),f:r=>esc(r.region?regName(r.region):L('غير محددة','Not set'))},{l:L('مكالمات','Calls'),f:r=>cdN(r.calls)},{l:L('وارد','In'),f:r=>cdN(r.in)},{l:L('نسبة الرد','Answer rate'),f:r=>r.in?Math.round(r.answered/r.in*100)+'%':'—'},{l:L('فائتة','Missed'),f:r=>cdN(r.missed)},{l:L('رسائل','Messages'),f:r=>cdN(r.msgs)}],d.by_region||[])}</div>
   <div class="card"><h3>${L('مكالمات فائتة لم يُعد الاتصال بها','Missed calls not returned')}</h3>${table([{l:L('الوقت','Time'),f:m=>fdt(m.at)},{l:L('العميل','Client'),f:m=>m.client_id?`<a href="#" data-open="client" data-id="${esc(m.client_id)}">${esc(m.client||'')}</a>`:`<span class="muted">${L('غير محدد','Unknown')}</span>`},{l:L('الرقم','Number'),f:m=>`<span dir="ltr">${esc(m.number||'')}</span>`},{l:L('الموظف','Employee'),f:m=>esc(m.user||'—')}],d.missed||[])}</div>`};

/* ============ Project radar: candidate projects from free public news sources, by region ============ */
const RD={d:null,busy:false,key:'',err:null,qs:null};
const RD_ST={new:['جديد','info'],review:['قيد المراجعة','warn'],converted:['تحوّل لمشروع','ok'],dismissed:['مستبعد','']};
const RD_STAGE={tender:['طرح / منافسة','warn'],award:['ترسية / عقد','ok'],execution:['تنفيذ / تدشين','info'],design:['تصميم / تخطيط',''],done:['مكتمل','']};
const RD_PSTAGE={tender:'tender',award:'award',execution:'execution',design:'design',done:'done'};
const rdCan=()=>isAdmin()||['rep','sup','mgr'].includes(role());
const rdF=()=>({st:fv('rd_st','new'),reg:fv('rd_reg',''),q:fv('rd_q','')});
async function rdLoad(){const f=rdF(),k=JSON.stringify(f);if(RD.busy)return;RD.busy=true;
  try{RD.d=await cmRpc('radar_list',{p_status:f.st,p_region:f.reg||null,p_q:f.q,p_limit:80,p_offset:0});RD.err=null}catch(e){RD.err=e.message}RD.key=k;RD.busy=false;if(route==='radar')render()}
V.radar=()=>{if(!rdCan())return `<div class="card empty">${L('غير مصرح','Not allowed')}</div>`;
  const f=rdF(),k=JSON.stringify(f);if(RD.key!==k&&!RD.busy)rdLoad();const d=RD.d;
  const tab=(s,l)=>`<button class="tab ${f.st===s?'on':''}" data-act="filt" data-k="rd_st" data-v="${s}">${l}${d&&d.counts&&d.counts[s]?` ${d.counts[s]}`:''}</button>`;
  const head=`<div class="banner info"><span class="sp">${L('رادار المشاريع يجمع يومياً (5:10 صباحاً) أخبار المشاريع الجديدة من مصادر عامة مجانية (بحث الأخبار العربية — أخبار الصحف والجهات الحكومية)، ويصنّفها حسب المنطقة ونوع المشروع والمرحلة ويرتّبها حسب مناسبتها لمنتجاتنا. هذه ترشيحات من الأخبار تحتاج تحقق قبل التواصل.','The radar collects new-project news daily from free public sources, classifies it by region/type/stage and ranks it. These are leads to verify.')}</span></div>
   <div class="toolbar" style="flex-wrap:wrap;gap:6px"><div class="tabs">${tab('new',L('جديد','New'))}${tab('review',L('قيد المراجعة','Reviewing'))}${tab('converted',L('تحوّل لمشروع','Converted'))}${tab('dismissed',L('مستبعد','Dismissed'))}${tab('all',L('الكل','All'))}</div>
    <span class="grow" style="flex:1"></span><select data-act="filtSel" data-k="rd_reg"><option value="">${L('كل المناطق','All regions')}</option>${(d?.regions||[]).map(r=>`<option value="${esc(r.region==='غير محددة'?'':r.region)}" ${f.reg===r.region?'selected':''}>${esc(r.region)} (${r.n})</option>`).join('')}<option value="jed" ${f.reg==='jed'?'selected':''}>${L('جدة فقط','Jeddah only')}</option><option value="mak" ${f.reg==='mak'?'selected':''}>${L('مكة فقط','Makkah only')}</option></select>
    <input type="search" id="rd_q" placeholder="${L('بحث في العناوين','Search titles')}" value="${esc(f.q)}"><button class="btn s" data-act="rdFind">${L('بحث','Search')}</button>
    ${isAdmin()||['mgr','sup'].includes(role())?`<button class="btn s" data-act="rdRun">${L('تحديث الآن','Refresh now')}</button>`:''}${isAdmin()||role()==='mgr'?`<button class="btn s" data-act="rdQs">${L('عبارات البحث','Search phrases')}</button>`:''}</div>
   ${d&&d.last_run?`<div class="small muted" style="margin:4px 0">${L('آخر تحديث','Last run')}: ${fdt(d.last_run.at)} — ${esc(d.last_run.msg||'')}</div>`:''}`;
  if(!d)return head+`<div class="card empty">${RD.err?esc(RD.err):L('جاري التحميل…','Loading…')}</div>`;
  return head+`<div class="list">${(d.rows||[]).map(r=>{const sg=RD_STAGE[r.stage];return `<div class="card" style="padding:12px">
    <div style="display:flex;gap:8px;align-items:flex-start"><div style="min-width:44px;text-align:center"><div style="font-size:20px;font-weight:800;color:${r.score>=60?'var(--ok,#1e8e3e)':r.score>=35?'var(--warn,#b26a00)':'var(--muted,#888)'}">${r.score}</div><div class="small muted">${L('أولوية','score')}</div></div>
     <div style="flex:1"><a href="${esc(r.link)}" target="_blank" rel="noopener" style="font-weight:700">${esc(r.title)}</a>
      <div class="small muted" style="margin:3px 0">${esc(r.source||'')} · ${r.published_at?fdt(r.published_at):''}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">${r.region?pill(r.region+(r.city?' — '+r.city.replace(/ه( |$)/g,'ة$1'):''),'info'):pill(L('منطقة غير محددة','Region unknown'))}${r.ptype?pill(r.ptype):''}${sg?pill(sg[0],sg[1]):''}${pill(RD_ST[r.status][0],RD_ST[r.status][1])}</div>
      ${r.snippet?`<div class="small" style="margin-top:4px">${esc(r.snippet.slice(0,220))}</div>`:''}${r.note?`<div class="small muted">📝 ${esc(r.note)}</div>`:''}</div>
     <div style="display:flex;flex-direction:column;gap:4px">${r.status!=='converted'?`<button class="btn p s" data-act="rdConv" data-id="${r.id}">${L('تحويل لمشروع','Make project')}</button>`:''}${r.status==='new'?`<button class="btn s" data-act="rdSet" data-id="${r.id}" data-s="review">${L('للمراجعة','Review')}</button>`:''}${r.status!=='dismissed'&&r.status!=='converted'?`<button class="btn s" data-act="rdSet" data-id="${r.id}" data-s="dismissed">${L('استبعاد','Dismiss')}</button>`:''}${r.status==='dismissed'?`<button class="btn s" data-act="rdSet" data-id="${r.id}" data-s="new">${L('إرجاع','Restore')}</button>`:''}</div></div></div>`}).join('')||`<div class="card empty">${L('لا توجد مشاريع في هذا التصنيف','Nothing here')}</div>`}</div>`};
ACT.rdFind=()=>{F.rd_q=(document.getElementById('rd_q')||{}).value||'';render()};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='rd_q'){e.preventDefault();ACT.rdFind()}});

const LC_ST={draft:['مسودة',''],pending:['بانتظار الاعتماد','warn'],returned:['معاد للاستكمال','info'],approved:['معتمد','ok'],rejected:['مرفوض','bad'],cancelled:['ملغى','']};
const LC_CTYPE=[['credit','اتفاقية تسهيلات ائتمانية'],['supply','عقد توريد'],['frame','اتفاقية إطارية للتوريد'],['price','اتفاقية أسعار'],['other','أخرى']];
const LC_GUAR=[['cheque','شيك بنكي'],['promissory','سند لأمر'],['lc','اعتماد مستندي'],['none','بدون']];

const LC_ACT={create:'إنشاء',save_draft:'حفظ مسودة',submit:'إرسال للاعتماد',submit_blocked:'محاولة إرسال مرفوضة',approve:'موافقة',reject:'رفض',return:'إعادة للاستكمال',issued:'إصدار الخطاب',
  self_blocked:'محاولة اعتماد طلب ذاتي',decide_denied:'محاولة قرار بدون صلاحية',cancel:'إلغاء',signed:'تسجيل توقيع العقد واستلام الضمانات',account_opened:'تسجيل فتح الحساب في SAP',
  auto_from_credit:'إنشاء تلقائي بعد اعتماد طلب التسهيلات',contract_issued:'إصدار العقد تلقائياً',auto_from_contract:'إنشاء تلقائي بعد توقيع العقد'};
const LCX={rows:null,flows:{},tpls:[],form:[],names:{},profiles:[],ce:{sm:[],gm:[]},busy:false,at:0,err:null};
const lcRef=d=>(LC_KIND[d.kind]?.pre||'')+(d.kno||d.no);
const lcName=id=>id?(LCX.names[id]||byId('team',id)?.name||'—'):'—';
const lcGuar=g=>(g||[]).map(x=>(LC_GUAR.find(y=>y[0]===x)||[,x])[1]).join('، ');
const lcSt=d=>pill(LC_ST[d.status]?.[0]||d.status,LC_ST[d.status]?.[1]||'')+(d.status==='approved'&&d.closed_at?' '+pill(d.kind==='contract'?L('موقّع','Signed'):L('الحساب مفتوح','Account opened'),'ok')

const lcCur=d=>d.status==='pending'&&d.cur?(d.route||[])[d.cur-1]:null;
const lcMyTurn=d=>{const s=lcCur(d);return !!s&&(s.approvers||[]).includes(me().id)&&d.created_by!==me().id};
const lcLastAppr=d=>{const done=(d.route||[]).filter(s=>s.state==='done');return done.length?done[done.length-1].approvers||[]:[]};

  return isMgr()||lcCfg()||(d.kind==='contract'&&[d.created_by,d.rep_id,d.sup_id].includes(u))||(d.kind==='account'&&lcLastAppr(d).includes(u))};

async function lcLoad(force){if(LCX.busy||(!force&&LCX.rows&&Date.now()-LCX.at<30000))return;LCX.busy=true;
  try{const sb=window.__sb;const [r,f,t,p,fm,ce]=await Promise.all([sb.from('lc_docs').select('*').order('created_at',{ascending:false}).limit(3000),sb.from('lc_flows').select('*'),
      sb.from('lc_templates').select('*').eq('active',true).order('name'),sb.from('profiles').select('id,full_name,role,active'),sb.from('lc_forms').select('*'),sb.from('ce_settings').select('sm_ids,gm_ids').eq('id',1).maybeSingle()]);
    if(r.error)throw r.error;LCX.rows=r.data||[];LCX.flows={};(f.data||[]).forEach(x=>LCX.flows[x.kind]=x.steps||[]);LCX.tpls=t.data||[];
    LCX.form=((fm.data||[]).find(x=>x.kind==='account')||{}).fields||[];const c=ce&&ce.data&&!Array.isArray(ce.data)?ce.data:{};LCX.ce={sm:c.sm_ids||[],gm:c.gm_ids||[]};
    (p.data||[]).forEach(x=>LCX.names[x.id]=x.full_name);LCX.profiles=(p.data||[]).filter(x=>x.active).sort((a,b)=>(a.full_name||'').localeCompare(b.full_name||'','ar'));LCX.at=Date.now();LCX.err=null}
  catch(e){LCX.err=e.message||String(e);LCX.rows=LCX.rows||[]}LCX.busy=false;render()}
const lcRpc=async(fn,args)=>{const {data,error}=await window.__sb.rpc(fn,args);if(error)throw new Error(error.message);return data};
const lcErr=r=>toast((r.errors||[]).join(' · '));
function lcWords(n){n=Math.floor(Math.abs(+n||0));if(!n)return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u3=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+' و'+tens[t]:tens[t])}}return p.join(' و')};
  const sc=[['',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];const parts=[];let i=0;
  while(n>0&&i<4){const g=n%1000;if(g){let w;if(i===0)w=u3(g);else if(g===1)w=sc[i][0];else if(g===2)w=sc[i][1];else if(g<=10)w=u3(g)+' '+sc[i][2];else w=u3(g)+' '+sc[i][0];parts.unshift(w)}n=Math.floor(n/1000);i++}
  return parts.join(' و')}
const lcBody=d=>(d.body||'').split('(يُحدد عند الحفظ)').join(lcRef(d)).split('__WORDS__').join(lcWords(d.amount)).split('__HIJRI__').join('......');

  const rows=LCX.rows.filter(d=>d.kind===kind);const tk='lcTab_'+kind,tab=fv(tk,'queue');const q=rows.filter(lcMine);const nl=LC_KIND[kind].newL;
  let h=`<div class="toolbar">${nl&&lcLvl(kind)>=3?`<button class="btn p" data-act="lcNew" data-k="${kind}">${nl()}</button>`:''}<button class="btn s" data-act="lcRe">${L('تحديث','Refresh')}</button><span class="grow"></span>
    <span class="small muted">${kind==='letter'&&!(LCX.flows.letter||[]).length?L('الخطابات تصدر مباشرة بدون اعتماد (تقدر تضيف مراحل من الإعدادات)','Letters are issued directly'):L('دورة الموافقات: ','Approval route: ')+(lcStepsTxt(kind)||`<span class="flag">${L('لسا ما تحددت','not set')}</span>`)}</span></div>

   ${kind==='credit'?`<div class="banner info"><span class="sp">${L('بعد اعتماد الطلب من كل المراحل، النظام يجهز العقد تلقائياً ويرسله للمندوب ليوقعه العميل مع الضمانات المطلوبة. وبعد تسجيل التوقيع يطلع طلب فتح الحساب.','After full approval the contract is generated for the customer to sign; after signing, an account-opening request is created.')}</span></div>`:''}
   ${kind==='account'?`<div class="banner info"><span class="sp">${L('طلبات فتح الحساب تنشأ تلقائياً بعد تسجيل توقيع عقد التسهيلات. المندوب يكمل النموذج ويرسله، والمرحلة الأخيرة للحسابات اللي تفتح الحساب في SAP.','Created automatically after the credit contract is signed.')}</span></div>`:''}
   <div class="tabs">${[['queue',L('بانتظار إجراء مني','My queue')+` (${q.length})`],['list',L('الكل','All')],['help',L('دليل الوحدة','Guide')]].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-act="filt" data-k="${tk}" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(tab==='queue')return h+lcTable(kind,q,L('ما فيه شي ينتظر إجراء منك','Nothing waiting for you'));
  if(tab==='help')return h+lcHelp(kind);
  const s=normTxt(fv('lcQ_'+kind,'')),st=fv('lcS_'+kind,'');
  const list=rows.filter(d=>(!st||d.status===st)&&(!s||normTxt(`${lcRef(d)} ${d.client_name||''} ${d.client_code||''} ${d.title||''}`).includes(s)));
  return h+`<div class="fbar"><label class="fl">${L('بحث بالرقم أو العميل أو العنوان','Search')}<input type="search" value="${esc(fv('lcQ_'+kind,''))}" data-act="filtIn" data-k="lcQ_${kind}"></label>
    <label class="fl">${L('الحالة','Status')}<select data-act="filtSel" data-k="lcS_${kind}">${opt(Object.entries(LC_ST).map(([k,v])=>[k,v[0]]),st,L('الكل','All'))}</select></label></div>`+lcTable(kind,list,L('ما فيه سجلات','No records'))}
function lcTable(kind,rows,emp){if(!rows.length)return `<div class="card empty">${emp}</div>`;
  const cols={contract:[{l:L('العنوان','Title'),f:d=>esc(d.title||'—')},{l:L('القيمة / الحد','Value'),c:'n',f:d=>d.amount!=null?money(d.amount):'—'}],
    credit:[{l:L('الحد المطلوب','Requested limit'),c:'n',f:d=>d.amount!=null?money(d.amount):'—'},{l:L('مدة السداد','Term'),f:d=>d.fields?.term_days?`${d.fields.term_days} ${L('يوم','days')}`:'—'},{l:L('الضمانات','Guarantees'),f:d=>esc(lcGuar(d.fields?.guarantees))||'—'}],

    letter:[{l:L('الموضوع','Subject'),f:d=>esc(d.title||'—')}],

  return `<div class="card">${table([{l:L('الرقم','No.'),f:d=>`<a href="#" data-act="lcOpen" data-id="${d._id}"><b>${lcRef(d)}</b></a>`},{l:L('العميل','Customer'),f:d=>`${esc(d.client_name||'')} <span class="small muted">${esc(d.client_code||'')}</span>`},

  const vat=SDE.lines.reduce((s,l)=>s+sdLineNet(l)*(1-hd/100)*(/0%|EX|ZR/i.test(l.vat_group||'')?0:0.15),0);return {net0,net,disc:net0-net,vat,total:net+vat}}

async function sdBpSearch(t){const box=document.getElementById('sd_bpres');if(!box)return;if((t||'').trim().length<2){box.innerHTML='';return}box.innerHTML=`<div class="small muted">${L('جاري البحث…','Searching…')}</div>`;

async function sdPickClient(code){const box=document.getElementById('sd_cust');if(!box||!SDE)return;if(code&&SDE.cust&&SDE.cust.CardCode===code)return;if(code&&SDE.loading===code)return;SDE.loading=code;
  SDE.cust=null;SDE.lines=SDE.lines.filter(l=>!l.base_entry);sdPaint();if(!code){box.innerHTML='';SDE.loading=null;return}
  box.innerHTML=`<span class="small muted">${L('جاري جلب بيانات العميل من ساب…','Loading the customer from SAP…')}</span>`;
  try{const r=await sdRead('customer',{code});SDE.cust=r.customer;SD_VAT[code]=r.customer.FederalTaxID||'';const ci=document.getElementById('sd_client');if(ci&&!ci.value.startsWith(code))ci.value=`${code} — ${r.customer.CardName}`;
    if(SDE.kind==='payment')await sdPayLoad();sdPaint();sdCatalog(r.customer.PriceListNum).catch(()=>{});const qi=document.getElementById('sd_q');if(qi&&!SDE.lines.length)setTimeout(()=>qi.focus(),50)}
  catch(e){box.innerHTML=`<span class="flag">${esc(e.message)}</span>`}finally{SDE.loading=null}}
/* credit panel — mirrors the server rule: orders always count; deliveries and invoices count unless every line is copied from a base */
function sdCredit(){const box=document.getElementById('sd_cust');const c=SDE&&SDE.cust;SDE&&(SDE.over=false);if(!box||!c)return;
  const credit=SD_CREDIT.has(SDE.kind);const hd=sdNum(SDE.disc);
  const t=credit?SDE.lines.filter(l=>+l.base_type!==15).reduce((s,l)=>s+sdLineNet(l)*(1-hd/100)*(/0%|EX|ZR/i.test(l.vat_group||'')?1:1.15),0):0; // lines copied from a delivery are already in the exposure
  const after=c.Exposure+t;const over=credit&&t>0&&after>sdNum(c.CreditLimit)+0.005;const frozen=c.Frozen==='tYES'||c.Valid==='tNO';
  box.innerHTML=`<div class="sd-cr ${over||frozen?'over':''}"><div><b>${esc(c.CardName)}</b> — ${esc(c.CardCode)}${c.FederalTaxID?` · ${L('الرقم الضريبي','VAT no.')} ${esc(c.FederalTaxID)}`:''} · ${L('قائمة الأسعار','Price list')}: ${esc(c.PriceListName||c.PriceListNum)}</div>
   <div class="sd-crg"><span>${L('الحد الائتماني','Credit limit')}<b>${sdM(c.CreditLimit||0)}</b></span><span>${L('رصيد الحساب','Account balance')}<b>${sdM(c.CurrentAccountBalance||0)}</b></span>    <span>${L('تسليمات مفتوحة','Open deliveries')}<b>${sdM(c.OpenDeliveryNotesBalance||0)}</b></span><span>${L('المتاح','Available')}<b>${sdM(c.Available)}</b></span>${credit&&t>0?`<span>${L('المتاح بعد هذا المستند','Available after')}<b>${sdM(sdNum(c.CreditLimit)-after)}</b></span>`:''}</div>
   ${!credit?`<div class="small muted" style="margin-top:4px">${L('عروض الأسعار وأوامر البيع ما ترتبط بالحد الائتماني؛ الفحص يكون عند التسليم والفاتورة.','Quotations and orders are not credit-checked; delivery and invoice are.')}</div>`:''}${frozen&&credit?`<div class="flag">${L('العميل موقوف في ساب','Customer is frozen in SAP')}</div>`:''}${over?`<div class="flag">${L('المستند يتجاوز الحد الائتماني للعميل في ساب، وما ينرحّل. خفّض الكمية، أو حصّل من العميل، أو قدّم طلب تسهيلات ائتمانية.','This document exceeds the customer credit limit in SAP and cannot be posted.')}</div>`:''}</div>`;
  SDE.over=over||(frozen&&credit)}
async function sdSearch(t){const res=document.getElementById('sd_res');if(!res)return;if(!SDE.cust){res.innerHTML=`<div class="small muted">${L('اختر العميل أولاً','Pick the customer first')}</div>`;return}

  catch(e){res.innerHTML=`<span class="flag">${esc(e.message)}</span>`}}

     <td>${b?sdM(l.price):`<input type="number" step="any" min="0" data-sdl="${i}" data-f="price" value="${esc(l.price??'')}" style="width:90px">`}</td>

     <td class="n sd-lt">${sdM(sdLineNet(l))}</td><td class="small">${b?`${sdN(SD_TYPE_OF[l.base_type])} ${l.base_num||''}`:''}</td><td><button class="btn s d" data-act="sdDel" data-i="${i}">×</button></td></tr>`}).join('')}</tbody></table></div>`}

    <tr><th>${L('خصم %','Discount %')}</th><td><input type="number" step="any" min="0" max="100" id="sd_disc" value="${esc(SDE.disc||0)}" style="width:70px"> <span class="small">${sdM(t.disc)}</span></td></tr>
    <tr><th>${L('الضريبة (تقديرية، ساب يحسبها)','Tax (estimate; SAP computes it)')}</th><td>${sdM(t.vat)}</td></tr><tr class="sd-gt"><th>${L('الإجمالي','Total')}</th><td>${sdM(t.total)}</td></tr></table>`;
    const di=document.getElementById('sd_disc');di.addEventListener('change',()=>{SDE.disc=di.value;sdPaint()})}
  sdCredit()}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||el.dataset.sdl==null||!SDE)return;const l=SDE.lines[+el.dataset.sdl];if(!l)return;l[el.dataset.f]=el.value;
  const tr=el.closest('tr');if(tr){const c=tr.querySelector('.sd-lt');if(c)c.textContent=sdM(sdLineNet(l))}

    if(f&&f.dataset&&f.dataset.sdl==null&&f.closest&&f.closest('.sw-lines'))return; sdPaint();
    if(k){const n=document.querySelector(`[data-sdl="${k[0]}"][data-f="${k[1]}"]`);if(n){n.focus();try{n.setSelectionRange(k[2],k[3])}catch(x){}}}},600)},true);


/* ---------- item catalog from SAP (cached per price list) and the quick item entry ---------- */
SDX.cat={};
async function sdCatalog(pl){const k=String(pl);if(SDX.cat[k]&&(SDX.cat[k].items||SDX.cat[k].p))return SDX.cat[k].items||SDX.cat[k].p;
  const p=sdRead('items_all',{price_list:pl}).then(r=>{const items=(r.items||[]).map(x=>({...x,label:x.name,sub:[x.unit,x.en,`${L('المخزون','Stock')} ${num(x.stock||0)}`].filter(Boolean).join(' · '),
      right:x.price!=null?`<b>${sdM(x.price)}</b>`:`<span style="color:#B42318">${L('بدون سعر','No price')}</span>`}));
    items.sort((a,b)=>(a.price==null)-(b.price==null));SDX.cat[k]={items};return items}).catch(e=>{delete SDX.cat[k];throw e});SDX.cat[k]={p};return p}
function sdItemCombo(qi){wCombo(qi,{limit:50,width:520,empty:L('ما فيه صنف مطابق','No matching item'),
  source:q=>{if(!SDE||!SDE.cust)return Promise.reject(new Error(L('اختر العميل أولاً عشان تطلع أسعار قائمته','Pick the customer first')));
    const c=SDX.cat[String(SDE.cust.PriceListNum)];if(c&&c.items)return wpFind(c.items,q,50);return sdCatalog(SDE.cust.PriceListNum).then(items=>wpFind(items,qi.value,50))},
  pick:x=>{SDE.lines.push({item_code:x.code,name:x.name,unit:x.unit,qty:1,price:x.price,disc:0,vat_group:x.vat||'',wh:x.wh});qi.value='';sdPaint();
    const i=SDE.lines.length-1;const n=document.querySelector(`[data-sdl="${i}"][data-f="qty"]`);if(n){n.focus();n.select()}
    if(x.price==null)toast(L('الصنف ما له سعر في قائمة أسعار العميل؛ اكتب السعر','No list price for this item; type the price'))}})}
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter'||!t.dataset||t.dataset.sdl==null||!SDE)return;e.preventDefault();
  const f=t.dataset.f;const i=+t.dataset.sdl;const nxt=f==='qty'?document.querySelector(`[data-sdl="${i}"][data-f="price"]`):null;
  if(nxt&&(SDE.lines[i].price==null||SDE.lines[i].price===''))nxt.focus();else{const qi=document.getElementById('sd_q');if(qi)qi.focus()}},true);

async function sdCopyFrom(){if(!SDE.cust)return toast(L('اختر العميل أولاً','Pick the customer first'));const types=SD_BASES[SDE.kind];
  const box=document.getElementById('sd_res');box.innerHTML=`<div class="small muted">${L('جاري جلب المستندات المفتوحة…','Loading open documents…')}</div>`;
  try{const all=[];for(const t of types){const r=await sdRead('open_docs',{type:t,card:SDE.cust.CardCode});(r.docs||[]).forEach(d=>all.push({...d,type:t}))}SDE.bases=all;
    box.innerHTML=all.length?`<div class="small muted">${L('اختر المستند اللي تنسخ منه:','Choose the document to copy from:')}</div>`+all.map((d,i)=>`<div class="li" data-act="sdBase" data-i="${i}"><div class="main"><div class="t">${sdN(d.type)} ${d.num} — ${sdD(d.date)} — ${sdM(d.total)}</div><div class="m">${d.lines.length} ${L('سطر مفتوح','open lines')}${d.ref?' · '+esc(d.ref):''}</div></div></div>`).join('')
      :`<div class="small muted">${L('ما فيه مستندات مفتوحة لهذا العميل','No open documents for this customer')} (${types.map(sdN).join(L(' أو ',' or '))})</div>`}catch(e){box.innerHTML=`<span class="flag">${esc(e.message)}</span>`}}
async function sdAddBase(d){const bt=SD_T[d.type][2];const add=d.lines.filter(l=>sdNum(l.open)>0&&l.code!=='T0001'&&!SDE.lines.some(x=>x.base_entry===d.entry&&x.base_line===l.line))
    .map(l=>({item_code:l.code,name:l.name,qty:l.open,open:l.open,price:l.price,disc:l.disc||0,vat_group:l.vat,wh:l.wh,base_type:bt,base_entry:d.entry,base_line:l.line,base_num:d.num}));
  if(!add.length)toast(L('ما فيه أسطر مفتوحة في هذا المستند','No open lines on this document'));
  SDE.lines.push(...add);const r=document.getElementById('sd_ref');if(d.ref&&r&&!r.value)r.value=d.ref;
  const res=document.getElementById('sd_res');if(res)res.innerHTML='';sdPaint();
  if(SDE.kind==='delivery'&&d.type==='order'){SDE.order=d;const fb=document.getElementById('sd_fleetbox');try{const {data}=await window.__sb.rpc('sap_fleet_orders',{p_so:String(d.num)});SDE.fleet=data||[];
    fb.innerHTML=`<label>${L('ربط بطلب التوصيل والسيارة (تطبيق الحركة)','Link to the fleet delivery & vehicle')}</label><select id="sd_fleet">${opt(SDE.fleet.map(f=>[f.id,`#${f.id} — ${f.date||''} — ${f.vehicle?L('سيارة ','Vehicle ')+f.vehicle:L('بدون سيارة','no vehicle')}${f.driver?' — '+f.driver:''} — ${f.status}${f.dlv?' — '+L('عليه تسليم ','has delivery ')+f.dlv:''}`]),'',SDE.fleet.length?L('— بدون ربط —','— no link —'):L('ما فيه طلب توصيل لهذا الأمر في تطبيق الحركة','No fleet delivery for this order'))}</select>`}catch(e){fb.innerHTML=''}}}
async function sdPrefill(pre){const ci=document.getElementById('sd_client');ci.value=pre.card;await sdPickClient(pre.card);if(!SDE||!SDE.cust)return;
  if(pre.doc&&SDE.kind!=='payment'){try{const r=await sdRead('doc',{type:pre.doc.type,entry:pre.doc.entry});const d={...r.doc,type:pre.doc.type};d.lines=d.lines.filter(l=>l.status!=='bost_Close');await sdAddBase(d)}catch(e){toast(e.message)}}
  if(pre.doc&&SDE.kind==='payment'){const x=SDE.pay.invoices.find(i=>i.entry===pre.doc.entry);if(x){x.applied=x.due;sdPayPaint()}}}

  BUSY=true;try{const {data,error}=await window.__sb.rpc('sap_doc_submit',{p_type:k,p});BUSY=false;if(error)throw error;
    if(!data.ok){err.innerHTML=(data.errors||[]).map(esc).join('<br>');return}closeModal();toast(L('انرسل لساب، الرقم يطلع خلال ثواني','Sent to SAP; the number appears shortly'));F.sdTab=k;sdLoad(true)}
  catch(e){BUSY=false;err.textContent=e.message}}

     ${p&&p.status==='review'&&MKX.me.approve?`<button class="btn p" data-act="mkDecideOpen" data-id="${p.id}">${L('اعتماد / إرجاع','Approve / return')}</button>`:''}</div>
   </div>
   ${!ro&&mkCanPost()?`<div class="mk-ai"><b>✦ ${L('اكتب بالذكاء الاصطناعي','Write with AI')}</b>

     <div class="fld"><label>${L('المنتج','Product')}</label><select id="mk_ai_fam">${opt(Object.entries(typeof FAMILIES!=='undefined'?FAMILIES:{}).map(([k,v])=>[k,L(v[0],v[1])]),'',L('— عام —','— general —'))}</select></div>
     <div class="fld"><label>${L('النبرة','Tone')}</label><select id="mk_ai_tone">${opt([['pro',L('مهنية للمقاولين والاستشاريين','Professional')],['friendly',L('قريبة من الناس','Friendly')],['promo',L('عرض ترويجي','Promotional')],['edu',L('تثقيفية ونصائح','Educational')]],'pro')}</select></div>
     <button class="btn p" data-act="mkAi" data-t="post" style="width:100%">${L('اكتب المنشور','Write the post')}</button>

     <div class="small muted" style="margin-top:8px">${L('النص المقترح مسودة؛ راجع أي معلومة فنية قبل الإرسال للاعتماد. ما يُكتب بين [يُستكمل] لازم يتعبأ.','AI text is a draft; check any technical claim.')}</div></div>`:''}

    [['mk_ar','mk_cnt_ar'],['mk_en','mk_cnt_en']].forEach(([a,b])=>{const n=document.getElementById(a).value.length+extra;const el=document.getElementById(b);el.textContent=`${n}${lim<99999?' / '+lim:''} ${L('حرف مع الوسوم','chars incl. hashtags')}`;el.style.color=n>lim?'#D92D20':''})};
  ['mk_ar','mk_en','mk_tags'].forEach(id=>document.getElementById(id).addEventListener('input',upd));document.querySelectorAll('.mk_pl').forEach(x=>x.addEventListener('change',upd));upd()}
function mkForm(){const g=id=>(document.getElementById(id)||{}).value||'';const w=g('mk_when');
  return {id:MKE.id,title:g('mk_title').trim(),kind:g('mk_kind'),campaign_id:g('mk_camp')||null,platforms:[...document.querySelectorAll('.mk_pl:checked')].map(x=>x.value),
    scheduled_at:w?w+':00+03:00':null,body_ar:g('mk_ar'),body_en:g('mk_en'),hashtags:g('mk_tags'),cta:g('mk_cta'),design_brief:g('mk_brief'),media:g('mk_media').split('\n').map(s=>s.trim()).filter(Boolean)}}
const mkJson=t=>{const s=String(t||'').replace(/```(json)?/g,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw new Error(L('رد المساعد مو بالصيغة المتوقعة، جرّب مرة ثانية','Unexpected AI reply; try again'));return JSON.parse(s.slice(a,b+1))};
async function mkAi(task,question,context){const {data,error}=await window.__sb.functions.invoke('ai-assist',{body:{app:'mk',task,question,context}});
  if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(m)}if(data?.error)throw new Error(data.error);return data.answer||''}
function mkCtx(extra){const camp=mkCamp((document.getElementById('mk_camp')||{}).value);const fam=(document.getElementById('mk_ai_fam')||{}).value||camp?.product_family||'';
  const items=(S.items||[]).filter(x=>x.active!==false&&(!fam||x.family===fam)).slice(0,60).map(x=>({name:x.name,family:x.family,size:x.size,unit:x.unit}));
  return {company:{name:'الوادي الأخضر المميز',name_en:'Al Wady Al Akhdar Al Momayaz',branches:['مكة المكرمة','عسفان']},campaign:camp?{name:camp.name,goal:camp.goal,audience:camp.audience,product_family:camp.product_family}:null,
    products:items,recent_titles:MKX.posts.slice(-30).map(p=>p.title),...extra}}

/* ---------- AI month plan ---------- */
async function mkPlan(m){openModal(L('خطة محتوى الشهر','Month content plan'),`<div class="fgrid"><div class="fld"><label>${L('عدد المنشورات','Number of posts')}</label><input type="number" id="mkp_n" value="12" min="1" max="40"></div>
  <div class="fld"><label>${L('الحملة','Campaign')}</label><select id="mk_camp">${opt(MKX.camps.filter(c=>c.status==='active'||c.status==='planned').map(c=>[String(c.id),c.name]),'',L('— بدون —','— none —'))}</select></div></div>
  <div class="fld"><label>${L('المنصات','Platforms')}</label><div class="mk-pls">${Object.keys(MK_PL).map(k=>`<label class="mk-plck" style="--c:${MK_PL[k][2]}"><input type="checkbox" class="mk_pl" value="${k}" ${['instagram','x','linkedin','tiktok'].includes(k)?'checked':''}> ${mkN(MK_PL,k)}</label>`).join('')}</div></div>
  <div class="fld"><label>${L('توجيهات إضافية','Extra guidance')}</label><textarea id="mkp_q" rows="2" placeholder="${L('مثال: ركز على البلك البركاني والإنترلوك، وموسم بداية المشاريع','e.g. focus on volcanic block')}"></textarea></div>
  <div class="formbar"><span class="grow"></span><button class="btn p" data-act="mkPlanRun" data-m="${m}">${L('اقترح الخطة','Suggest plan')}</button></div><div id="mkp_out"></div>`)}
async function mkPlanRun(m){const out=document.getElementById('mkp_out');const n=Math.min(40,Math.max(1,+document.getElementById('mkp_n').value||12));const pls=[...document.querySelectorAll('.mk_pl:checked')].map(x=>x.value);
  if(!pls.length)return toast(L('اختر منصة','Pick a platform'));out.innerHTML=`<div class="small muted">${L('جاري التخطيط…','Planning…')}</div>`;
  try{const [y,mo]=m.split('-').map(Number);const last=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);
    const ans=await mkAi('calendar',`الفترة من ${m}-01 إلى ${last}. عدد المنشورات ${n}. المنصات: ${pls.join(', ')}. ${document.getElementById('mkp_q').value||''}`,mkCtx({period:{from:m+'-01',to:last},platforms:pls,already_scheduled:MKX.posts.filter(p=>p.scheduled_at&&mkDay(p.scheduled_at).startsWith(m)).map(p=>({date:mkDay(p.scheduled_at),title:p.title}))}));
    const j=mkJson(ans);MKE={plan:(j.posts||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)).slice(0,n),camp:document.getElementById('mk_camp').value};
    out.innerHTML=`<div class="card">${MKE.plan.map((x,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0"><input type="checkbox" class="mkp_ck" value="${i}" checked style="width:auto;margin-top:4px"><span><b>${fdate(x.date)} ${esc(x.time||'')}</b> — ${esc(x.title||'')} <span class="small muted">${mkN(MK_KIND,x.kind)}</span><br>${(x.platforms||[]).filter(k=>MK_PL[k]).map(mkPl).join(' ')}<div class="small">${esc(x.idea||'')}</div></span></label>`).join('')}
      ${j.notes?`<div class="small muted">${esc(j.notes)}</div>`:''}</div><div class="formbar"><span class="grow"></span><button class="btn p" data-act="mkPlanSave">${L('أنشئ المحدد كمسودات','Create selected as drafts')}</button></div>`}
  catch(e){out.innerHTML=`<span class="flag">${esc(e.message)}</span>`}}

/* ---------- approval ---------- */
V.mkapprove=()=>{const h=mkHead();if(h&&!MKX.loaded)return h;
  const q=MKX.posts.filter(p=>p.status==='review').sort((a,b)=>String(a.scheduled_at||'9').localeCompare(String(b.scheduled_at||'9')));
  const ready=MKX.posts.filter(p=>p.status==='approved').sort((a,b)=>String(a.scheduled_at||'9').localeCompare(String(b.scheduled_at||'9')));
  const card=p=>`<div class="card mk-rev"><div class="toolbar"><b>${esc(p.title)}</b>${mkSt(p.status)}<span class="small muted">${mkWhen(p.scheduled_at)} · ${L('الكاتب','By')} ${mkUser(p.created_by)}</span><span class="grow"></span>${p.platforms.map(mkPl).join(' ')}</div>
    <div class="mk-prev">${p.body_ar?`<div class="mk-txt">${esc(p.body_ar)}</div>`:''}${p.body_en?`<div class="mk-txt" dir="ltr">${esc(p.body_en)}</div>`:''}${p.hashtags?`<div class="mk-tags">${esc(p.hashtags)}</div>`:''}${p.cta?`<div class="small"><b>CTA:</b> ${esc(p.cta)}</div>`:''}
     ${p.design_brief?`<div class="small"><b>${L('التصميم:','Design:')}</b> ${esc(p.design_brief)}</div>`:''}${(p.media||[]).map(u=>`<div class="small"><a href="${esc(u)}" target="_blank" rel="noopener" dir="ltr">${esc(u)}</a></div>`).join('')}</div>
    <div class="formbar"><button class="btn s" data-act="mkOpen" data-id="${p.id}">${L('فتح','Open')}</button><span class="grow"></span>
     ${p.status==='review'&&MKX.me.approve?`<button class="btn d" data-act="mkDecide" data-id="${p.id}" data-d="rejected">${L('رفض','Reject')}</button><button class="btn s" data-act="mkDecide" data-id="${p.id}" data-d="returned">${L('إرجاع للتعديل','Return')}</button><button class="btn p" data-act="mkDecide" data-id="${p.id}" data-d="approved">${L('اعتماد','Approve')}</button>`:''}
     ${p.status==='approved'&&MKX.me.approve?`<button class="btn s" data-act="mkDecide" data-id="${p.id}" data-d="reopen">${L('إرجاع للتعديل','Reopen')}</button>`:''}${p.status==='approved'&&mkCanPost()?`<button class="btn p" data-act="mkPub" data-id="${p.id}">${L('نشر الآن','Publish now')}</button>`:''}</div></div>`;
  return (h||'')+`${!MKX.me.approve?`<div class="banner"><span class="sp">${L('تقدر تشوف قائمة الاعتماد؛ الاعتماد نفسه لصاحب صلاحية «تعديل» على هذه الصفحة.','You can view; approving needs edit access on this page.')}</span></div>`:''}
   <h3>${L('بانتظار الاعتماد','Waiting for approval')} (${q.length})</h3>${q.length?q.map(card).join(''):`<div class="card empty">${L('ما فيه منشورات بانتظار الاعتماد','Nothing waiting')}</div>`}
   <h3>${L('معتمدة وجاهزة للنشر','Approved, ready to publish')} (${ready.length})</h3>${ready.length?ready.map(card).join(''):`<div class="card empty">${L('ما فيه','None')}</div>`}`};
function mkDecide(id,d){const p=MKX.posts.find(x=>x.id===id);const need=d!=='approved';
  openModal(`${{approved:L('اعتماد','Approve'),returned:L('إرجاع للتعديل','Return'),rejected:L('رفض','Reject'),reopen:L('إرجاع للتعديل','Reopen')}[d]} — ${esc(p?.title||'')}`,
   `<div class="fld"><label>${need?L('السبب (يشوفه الكاتب)','Reason (shown to the author)'):L('ملاحظة (اختياري)','Note (optional)')}</label><textarea id="mk_dn" rows="3"></textarea></div><div id="mk_err" class="flag"></div>

/* ---------- performance reports ---------- */
function mkTotals(rows){const last={};rows.forEach(m=>{const k=m.post_id?`p${m.post_id}:${m.platform||''}`:m.account_id?`a${m.account_id}`:`r${m.id}`;if(!last[k]||last[k].at<m.at||(last[k].at===m.at&&last[k].id<m.id))last[k]=m});
  const t={impressions:0,reach:0,engagements:0,clicks:0,leads:0,spend:0};Object.values(last).forEach(m=>{if(m.account_id&&!m.post_id&&!m.campaign_id)return;for(const k in t)t[k]+=mkInt(m[k])});return t}
V.mkreport=()=>{const h=mkHead();if(h&&!MKX.loaded)return h;const can=(MKX.me.report||0)>=3;
  const from=fv('mkrFrom',addDays(TODAY(),-30)),to=fv('mkrTo',TODAY()),cp=fv('mkrCp','');
  const pub=MKX.posts.filter(p=>p.status==='published'&&(!cp||String(p.campaign_id)===cp)&&(()=>{const d=mkDay(p.published_at||p.scheduled_at);return d>=from&&d<=to})());
  const ms=MKX.metrics.filter(m=>m.at>=from&&m.at<=to&&(!cp||String(m.campaign_id)===cp||pub.some(p=>p.id===m.post_id)));const t=mkTotals(ms);
  const er=t.reach?t.engagements/t.reach*100:null;const cpl=t.leads?t.spend/t.leads:null;
  const byPl={};pub.forEach(p=>p.platforms.forEach(k=>{byPl[k]=byPl[k]||{n:0,...mkTotals([])};byPl[k].n++}));
  Object.keys(byPl).forEach(k=>Object.assign(byPl[k],mkTotals(ms.filter(m=>m.platform===k&&m.post_id))));
  const postRow=p=>{const r=mkTotals(MKX.metrics.filter(m=>m.post_id===p.id));return {...p,_id:p.id,id:null,r}};
  return (h||'')+`<div class="fbar"><label class="fl">${L('من','From')}<input type="date" data-act="filtIn" data-k="mkrFrom" value="${esc(from)}"></label><label class="fl">${L('إلى','To')}<input type="date" data-act="filtIn" data-k="mkrTo" value="${esc(to)}"></label>
    <label class="fl">${L('الحملة','Campaign')}<select data-act="filtSel" data-k="mkrCp">${opt(MKX.camps.map(c=>[String(c.id),c.name]),cp,L('— الكل —','— all —'))}</select></label><span class="grow"></span>
    ${can?`<button class="btn s" data-act="mkTpl">${L('نموذج Excel للأرقام','Excel template')}</button><label class="btn s">${L('استيراد أرقام من Excel','Import from Excel')}<input type="file" id="mk_imp" accept=".xlsx,.xls,.csv" hidden></label><button class="btn p" data-act="mkMet">+ ${L('إدخال أرقام','Enter figures')}</button>`:''}</div>
   <div class="kpis"><div class="kpi"><div class="kl">${L('منشورات منشورة','Published posts')}</div><div class="kv">${pub.length}</div></div><div class="kpi"><div class="kl">${L('الظهور','Impressions')}</div><div class="kv">${num(t.impressions)}</div></div>
    <div class="kpi"><div class="kl">${L('الوصول','Reach')}</div><div class="kv">${num(t.reach)}</div></div><div class="kpi"><div class="kl">${L('التفاعل','Engagements')}</div><div class="kv">${num(t.engagements)}</div></div>
    <div class="kpi"><div class="kl">${L('نسبة التفاعل','Engagement rate')}</div><div class="kv">${er==null?'—':er.toFixed(1)+'%'}</div></div><div class="kpi"><div class="kl">${L('النقرات','Clicks')}</div><div class="kv">${num(t.clicks)}</div></div>
    <div class="kpi"><div class="kl">${L('عملاء محتملون','Leads')}</div><div class="kv">${num(t.leads)}</div></div><div class="kpi"><div class="kl">${L('المصروف','Spend')}</div><div class="kv">${money(t.spend)}</div></div>
    <div class="kpi"><div class="kl">${L('تكلفة العميل المحتمل','Cost per lead')}</div><div class="kv">${cpl==null?'—':money(cpl)}</div></div></div>
   ${!MKX.metrics.length?`<div class="banner warn"><span class="sp">${L('ما فيه أرقام أداء مدخلة بعد. الأرقام تُدخل من إحصائيات كل منصة (يدوياً أو من ملف Excel) لين تنربط الحسابات تلقائياً.','No figures entered yet.')}</span></div>`:''}
   <div class="card"><b>${L('حسب المنصة','By platform')}</b>${Object.keys(byPl).length?table([{l:L('المنصة','Platform'),f:x=>mkPl(x.k)},{l:L('منشورات','Posts'),c:'n',f:x=>x.n},{l:L('الوصول','Reach'),c:'n',f:x=>num(x.reach)},{l:L('التفاعل','Engagements'),c:'n',f:x=>num(x.engagements)},
     {l:L('نسبة التفاعل','ER'),c:'n',f:x=>x.reach?(x.engagements/x.reach*100).toFixed(1)+'%':'—'},{l:L('النقرات','Clicks'),c:'n',f:x=>num(x.clicks)},{l:L('عملاء محتملون','Leads'),c:'n',f:x=>num(x.leads)}],Object.entries(byPl).map(([k,v])=>({k,...v,id:null}))):`<div class="small muted">${L('ما فيه منشورات في الفترة','No posts in period')}</div>`}</div>
   <div class="card"><b>${L('المنشورات','Posts')}</b>${pub.length?table([{l:L('التاريخ','Date'),c:'nw',f:p=>fdate(mkDay(p.published_at||p.scheduled_at))},{l:L('المنشور','Post'),f:p=>`<a href="#" data-act="mkOpen" data-id="${p._id}">${esc(p.title)}</a>`},{l:L('المنصات','Platforms'),f:p=>p.platforms.map(mkPl).join(' ')},
     {l:L('الوصول','Reach'),c:'n',f:p=>p.r.reach?num(p.r.reach):'—'},{l:L('التفاعل','Eng.'),c:'n',f:p=>p.r.engagements?num(p.r.engagements):'—'},{l:L('النقرات','Clicks'),c:'n',f:p=>p.r.clicks?num(p.r.clicks):'—'},{l:L('عملاء','Leads'),c:'n',f:p=>p.r.leads?num(p.r.leads):'—'},
     {l:'',f:p=>can?`<button class="btn s" data-act="mkMet" data-p="${p._id}">${L('أرقام','Figures')}</button>`:''}],pub.map(postRow)):`<div class="small muted">${L('ما فيه','None')}</div>`}</div>
   <div class="card"><b>${L('آخر الأرقام المدخلة','Latest entries')}</b>${ms.length?table([{l:L('التاريخ','Date'),f:m=>fdate(m.at)},{l:L('على','For'),f:m=>m.post_id?esc(MKX.posts.find(p=>p.id===m.post_id)?.title||'#'+m.post_id):m.account_id?esc(MKX.accts.find(a=>a.id===m.account_id)?.name||''):esc(mkCamp(m.campaign_id)?.name||'')},
     {l:L('المنصة','Platform'),f:m=>m.platform?mkPl(m.platform):''},{l:L('الوصول','Reach'),c:'n',f:m=>m.reach??''},{l:L('التفاعل','Eng.'),c:'n',f:m=>m.engagements??''},{l:L('النقرات','Clicks'),c:'n',f:m=>m.clicks??''},{l:L('عملاء','Leads'),c:'n',f:m=>m.leads??''},{l:L('متابعون','Followers'),c:'n',f:m=>m.followers??''},{l:L('مصروف','Spend'),c:'n',f:m=>m.spend??''},
     {l:'',f:m=>can?`<button class="btn s d" data-act="mkMetDel" data-id="${m._id}">×</button>`:''}],ms.slice(0,100).map(m=>({...m,_id:m.id,id:null}))):`<div class="small muted">${L('ما فيه','None')}</div>`}
    <div class="small muted" style="margin-top:6px">${L('لكل منشور ومنصة تُحسب آخر قراءة فقط (الأرقام تراكمية من المنصة)، فإدخال قراءة جديدة ما يضاعف الأرقام.','The latest reading per post and platform is used, so new readings do not double count.')}</div></div>`};
function mkMet(postId){const p=MKX.posts.find(x=>x.id===+postId);
  openModal(L('إدخال أرقام الأداء','Enter figures'),`<div class="fgrid"><div class="fld"><label>${L('على','For')}</label><select id="mm_for">${opt([...MKX.posts.filter(x=>x.status==='published').map(x=>['p'+x.id,L('منشور: ','Post: ')+x.title]),...MKX.accts.map(a=>['a'+a.id,L('صفحة: ','Page: ')+a.name+' ('+mkN(MK_PL,a.platform)+')']),...MKX.camps.map(c=>['c'+c.id,L('حملة (مصروف/عملاء): ','Campaign: ')+c.name])],p?'p'+p.id:'')}</select></div>

   ${[['impressions','الظهور','Impressions'],['reach','الوصول','Reach'],['engagements','التفاعل (إعجاب+تعليق+مشاركة+حفظ)','Engagements'],['clicks','النقرات','Clicks'],['leads','عملاء محتملون (رسائل/اتصالات/طلبات)','Leads'],['followers','عدد المتابعين (للصفحة)','Followers'],['spend','المصروف الإعلاني (ر.س)','Ad spend (SAR)']].map(([k,a,e])=>`<div class="fld"><label>${L(a,e)}</label><input type="number" min="0" step="any" id="mm_${k}"></div>`).join('')}</div>

async function mkImport(file){if(typeof XLSX==='undefined')return toast(L('مكتبة Excel غير متاحة','Excel library unavailable'));
  try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
    const pick=(r,...ks)=>{for(const k of ks)if(r[k]!==undefined&&r[k]!=='')return r[k];return ''};const bad=[];
    const out=rows.map((r,i)=>{const id=+pick(r,'رقم المنشور','post_id');const pl=String(pick(r,'المنصة','platform')).trim().toLowerCase();const at=pick(r,'التاريخ','date');
      const d=at instanceof Date?at.toISOString().slice(0,10):String(at).slice(0,10);if(!MKX.posts.some(p=>p.id===id)){bad.push(i+2);return null}
      return {post_id:id,platform:MK_PL[pl]?pl:'',at:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:TODAY(),impressions:pick(r,'الظهور','impressions'),reach:pick(r,'الوصول','reach'),engagements:pick(r,'التفاعل','engagements'),clicks:pick(r,'النقرات','clicks'),leads:pick(r,'عملاء محتملون','leads'),spend:pick(r,'المصروف','spend')}}).filter(x=>x&&['impressions','reach','engagements','clicks','leads','spend'].some(k=>x[k]!==''));
    if(!out.length)return toast(L('ما فيه صفوف فيها أرقام','No rows with figures'));
    const r=await mkRpc('mk_metrics_save',{p:out.map(x=>{const o={...x};for(const k in o)o[k]=String(o[k]);o.campaign_id=String(MKX.posts.find(p=>p.id===x.post_id)?.campaign_id||'');return o})});
    toast(`${L('تم استيراد','Imported')} ${r.n}${bad.length?` — ${L('صفوف بدون رقم منشور صحيح:','rows with unknown post:')} ${bad.join(', ')}`:''}`);mkLoad(true)}catch(e){toast(e.message)}}

/* ===== Smart search pickers (البحث السريع) — used across the platform.
   1) wCombo(input, opts): type-ahead search on any text input (local lists or async sources such as SAP),
      Arabic-aware matching (أ/إ/آ=ا، ى=ي، ة=ه، حركات، أرقام هندية), multi-word, highlighted matches,
      keyboard (↑ ↓ Enter Esc) and a bottom sheet on phones.
   2) Every long <select> (8+ options) on any screen is turned into a searchable picker automatically;
      the original <select> stays as the value holder, so saving and filters keep working unchanged. ===== */
const WP={pop:null,cur:null,seq:0,t:null};
const wpMap={'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ى':'ي','ة':'ه','ؤ':'و','ئ':'ي','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
const wpN1=c=>/[ً-ٰٟـ]/.test(c)?'':/[\s\-_/.,،()]/.test(c)?' ':(wpMap[c]||c.toLowerCase());
const wpNorm=s=>{let o='';for(const c of String(s??''))o+=wpN1(c);return o.replace(/\s+/g,' ').trim()};
function wpHi(t,q){t=String(t??'');const toks=wpNorm(q).split(' ').filter(Boolean);if(!toks.length)return esc(t);
  let n='';const idx=[];for(let i=0;i<t.length;i++){for(const ch of wpN1(t[i])){n+=ch;idx.push(i)}}
  const mark=new Array(t.length).fill(false);for(const tok of toks){let p=n.indexOf(tok);while(p>=0){for(let j=p;j<p+tok.length;j++)mark[idx[j]]=true;p=n.indexOf(tok,p+tok.length)}}
  let out='',on=false;for(let i=0;i<t.length;i++){if(mark[i]&&!on){out+='<mark>';on=true}else if(!mark[i]&&on){out+='</mark>';on=false}out+=esc(t[i])}return out+(on?'</mark>':'')}
/* rank: exact code, code prefix, text prefix, word prefix, contains */
function wpFind(list,q,limit=60){const toks=wpNorm(q).split(' ').filter(Boolean);if(!toks.length)return list.slice(0,limit);const res=[];
  for(let i=0;i<list.length;i++){const x=list[i];const k=x._k||(x._k=wpNorm([x.code,x.label,x.sub,x.keys].filter(Boolean).join(' ')));if(!toks.every(t=>k.includes(t)))continue;

function swBindCust(ci){ci.addEventListener('keydown',e=>{if(e.key!=='Tab'&&e.key!=='Enter')return;const v=ci.value.trim();if(e.shiftKey)return;

  if(ex){ci.value=ex.code;document.getElementById('sw_name').value=ex.label;sdPickClient(ex.code)}else swCflBP(v)});

const _sdCreditOld=sdCredit;
sdCredit=function(){if(!document.querySelector('.sw')||SW.mode!=='add')return _sdCreditOld();const box=document.getElementById('sd_cust');const c=SDE&&SDE.cust;SDE&&(SDE.over=false);if(!box)return;

  if(SDE._ca!==c.CardCode){SDE._ca=c.CardCode;swApplyCust(c)}
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v??''};const ci=document.getElementById('sd_client');if(ci&&document.activeElement!==ci)ci.value=c.CardCode;
  set('sw_name',c.CardName);set('sw_pl',c.PriceListName||c.PriceListNum);set('sw_pt',c.PayTermsGrpCode!=null?String(c.PayTermsGrpCode):'');set('sw_vat',c.FederalTaxID||'');

  const t=credit?SDE.lines.filter(l=>+l.base_type!==15).reduce((s,l)=>s+sdLineNet(l)*(1-hd/100)*(/0%|EX|ZR/i.test(l.vat_group||'')?1:1.15),0):0;
  const after=c.Exposure+t;const over=credit&&t>0&&after>sdNum(c.CreditLimit)+0.005;const frozen=c.Frozen==='tYES'||c.Valid==='tNO';
  const f=(l,ar,v,cls)=>`<div class="sw-crf ${cls||''}" title="${ar}"><span>${l}</span><b>${swM(v)}</b></div>`;
  const strip=`${f('Credit Limit','الحد الائتماني',c.CreditLimit||0)}${f('Balance','الرصيد',c.CurrentAccountBalance||0)}${f('Deliveries','تسليمات مفتوحة',c.OpenDeliveryNotesBalance||0)}${f('Available','المتاح',c.Available,c.Available<0?'neg':'')}${credit&&t>0?f('After Document','بعد المستند',sdNum(c.CreditLimit)-after,sdNum(c.CreditLimit)-after<0?'neg':''):''}`;
  box.innerHTML=strip;const ac=document.getElementById('sw_credit');if(ac)ac.innerHTML=`<div class="sw-crt">Credit — الائتمان</div>${strip}<div class="sw-mut" style="margin-top:6px">${credit?'Checked on Add against SAP live balances — يُفحص عند الإضافة من أرصدة ساب':'Quotations and orders are not credit-checked — عروض الأسعار وأوامر البيع بدون فحص ائتمان'}</div>`;
  if(frozen&&credit)swMsg('Business partner is inactive (frozen) in SAP — العميل موقوف في ساب','err');
  else if(over)swMsg(`Credit limit exceeded by ${swM(after-sdNum(c.CreditLimit))} SAR — the document cannot be added. يتجاوز الحد الائتماني`,'err');
  else{const s=document.getElementById('sd_err');if(s&&/Credit limit|frozen/.test(s.textContent))swMsg('')}
  SDE.over=over||(frozen&&credit)};

/* ---------- header data from SAP: branches, numbering series, sales employees (read once per page) ---------- */
function swSetup(){if(SDX.setup)return Promise.resolve(SDX.setup);if(SDX.setupP)return SDX.setupP;
  SDX.setupP=sdRead('setup',{}).then(r=>{SDX.setup=r;SDX.setupP=null;return r}).catch(e=>{SDX.setupP=null;throw e});return SDX.setupP}
const swWh=()=>{const b=(SDX.setup?.branches||[]).find(x=>String(x.id)===String(SDE?.bpl));return b?.wh||''};
/* the row warehouse: the item's default warehouse (as SAP does), moved to the chosen branch's matching warehouse
   (Makkah 00x ↔ Jeddah 100x); falls back to the branch default when SAP has no such warehouse for the item */
function swWhFor(l){const bw=swWh();const iw=String(l._dwh||'');if(!bw)return iw||l.wh||'';if(!iw)return bw;
  const jed=/^10\d\d$/.test(bw);let w=jed?(/^\d{3}$/.test(iw)?'1'+iw:iw):(/^10\d\d$/.test(iw)?iw.slice(1):iw);
  if(l._whs&&!l._whs.some(x=>String(x.wh)===w))w=bw;return w}
