<style>
/* Layout: operations console — fixed nav rail (desktop) / bottom tab bar (phone), one working column of filter bar, KPI tiles, charts and lists */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF3; --line:#D9DFEA;
  --ink:#051D48; --muted:#5A6885; --brand:#051D48; --brand-ink:#FFFFFF;
  --accent:#38AC57; --accent-ink:#1E7A3A; --accent-soft:#E2F4E7;
  --warn:#F39235; --warn-ink:#9A4F07; --warn-soft:#FDEEDC;
  --bad:#D23F3F; --bad-ink:#A12424; --bad-soft:#FBE3E3;
  --info:#34BEF0; --info-ink:#0C6E94; --info-soft:#DDF3FC;
  --barfill:#051D48;
  --c1:#051D48; --c2:#38AC57; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#A3AEC4;
  --font:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(5,29,72,.06),0 4px 14px rgba(5,29,72,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071226; --surface:#0E1C38; --sunk:#14264A; --line:#22365E;
  --ink:#E7EDF7; --muted:#9AAAC8; --brand:#0B2A63; --brand-ink:#FFFFFF;
  --accent:#45BF65; --accent-ink:#7EDB97; --accent-soft:#15382A;
  --warn:#F39235; --warn-ink:#F8B678; --warn-soft:#3D2A14;
  --bad:#E25858; --bad-ink:#F29393; --bad-soft:#3E1C22;
  --info:#34BEF0; --info-ink:#86D8F7; --info-soft:#123449; --barfill:#34BEF0;
  --c1:#7FA6E8; --c2:#45BF65; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#5A6885;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0E1C38; --sunk:#14264A; --line:#22365E;
  --ink:#E7EDF7; --muted:#9AAAC8; --brand:#0B2A63; --brand-ink:#FFFFFF;
  --accent:#45BF65; --accent-ink:#7EDB97; --accent-soft:#15382A;
  --warn:#F39235; --warn-ink:#F8B678; --warn-soft:#3D2A14;
  --bad:#E25858; --bad-ink:#F29393; --bad-soft:#3E1C22;
  --info:#34BEF0; --info-ink:#86D8F7; --info-soft:#123449; --barfill:#34BEF0;
  --c1:#7FA6E8; --c2:#45BF65; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#5A6885;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
#side{background:var(--brand);color:var(--brand-ink);padding-block:18px;padding-inline:12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{opacity:.7;font-size:12px}
.navgrp{font-size:11px;letter-spacing:.06em;opacity:.55;padding-inline:8px;margin-top:6px}
#side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;opacity:.85;border:0;background:none;width:100%;text-align:start;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.08);opacity:1}
.nv.on{background:rgba(255,255,255,.14);opacity:1;font-weight:700}
.nv svg{width:18px;height:18px;flex:none}
.nv .cnt{margin-inline-start:auto;background:var(--warn);color:#2b1600;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#top h1{font-size:18px;margin:0;font-weight:800;flex:1;min-width:0;text-wrap:balance}
.asbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.asbox select{max-width:220px}
#view{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
#tabbar{display:none}
.banner{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--info-soft);color:var(--info-ink)}
.banner.ok{background:var(--accent-soft);color:var(--accent-ink)}
.banner.bad{background:var(--bad-soft);color:var(--bad-ink)}
.banner .sp{flex:1;min-width:200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:500;color:var(--muted);font-size:12px}
.card h2 .end{margin-inline-start:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--accent-ink);font-weight:700} .down{color:var(--bad-ink);font-weight:700}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter.w i{background:var(--warn)} .meter.b i{background:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fbar .fl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.fbar .fl select,.fbar .fl input{width:auto;min-width:130px}
.fbar .per{font-size:12px;color:var(--muted);margin-inline-start:auto;align-self:center}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;width:100%}
textarea{min-height:76px;resize:vertical}
.toolbar input,.toolbar select{width:auto}
.toolbar .grow input{width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:36px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(.95)}
.btn.d{color:var(--bad-ink);border-color:var(--bad)}
.btn.s{padding:4px 9px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}
.pill.strong{background:var(--brand);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0;text-align:start;width:100%}
.li:hover{border-color:var(--muted)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end;flex:none}
.li.sev-bad{border-inline-start:4px solid var(--bad)} .li.sev-warn{border-inline-start:4px solid var(--warn)} .li.sev-info{border-inline-start:4px solid var(--info)} .li.sev-good{border-inline-start:4px solid var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--sunk)}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:var(--sunk)}
td.n,th.n{text-align:end;white-space:nowrap}
td.nw{white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:22px}
.muted{color:var(--muted)} .small{font-size:12px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:13px;margin:2px 4px;display:flex;justify-content:space-between;gap:6px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kc .t{font-weight:700;font-size:14px}
.kc .row{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{outline:2px solid var(--accent)}
.day h4{margin:2px 4px;font-size:13px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.pv .seq{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--barfill);border-radius:6px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartbox{position:relative;width:100%;min-width:0}
.chartbox canvas{max-width:100%}
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.flag{font-size:12px;color:var(--bad-ink)}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:30px;font-weight:800;line-height:1}
.prog{height:12px;background:var(--sunk);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.steps span{padding:4px 10px;border-radius:20px;background:var(--sunk);color:var(--muted);font-weight:700}
.steps span.on{background:var(--brand);color:#fff}
.steps span.done{background:var(--accent-soft);color:var(--accent-ink)}
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.req{color:var(--bad)}
/* modal */
#modal{position:fixed;inset:0;z-index:30;background:rgba(3,12,30,.5);display:flex;justify-content:flex-end}
#modal .sheet{background:var(--bg);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#modal header{display:flex;align-items:center;gap:10px;padding-block:12px;padding-inline:16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
#modal header h3{margin:0;font-size:17px;flex:1;min-width:0}
#modal .body{overflow:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:500;color:var(--ink);cursor:pointer}
.chk input{width:auto;min-height:0}
.rows{display:flex;flex-direction:column;gap:8px}
.rowi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;align-items:end}
.formbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:700;font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{flex:1;min-width:70px;text-align:center;font-size:12px;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.timeline span.done{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.timeline span.cur{background:var(--accent);color:#fff;font-weight:800}
.audit-ch{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kw{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center}
.kw input{width:110px}
@media (max-width:1180px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{display:none}
  #top h1{font-size:16px;flex-basis:100%}
  .asbox{flex:1}
  .asbox select{max-width:none;flex:1}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .fbar .fl{flex:1 1 140px}
  .fbar .fl select,.fbar .fl input{min-width:0;width:100%}
  .fbar .per{flex-basis:100%;margin-inline-start:0}
  #tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #tabbar button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  #tabbar button.on{color:var(--accent-ink);font-weight:800}
  #tabbar svg{width:22px;height:22px}
  #tabbar .dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--warn);color:#2b1600;font-size:10px;border-radius:10px;padding:0 5px;font-weight:800}
  .bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}
}
@media (max-width:420px){.kpis,.kpis.k5{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.rk-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.rk{background:var(--card,#fff);border:1px solid var(--line,#E3E8F0);border-radius:12px;padding:12px 14px;border-top:3px solid #38AC57}.rk .l{display:block;font-size:12px;color:var(--muted,#5A6A82)}.rk .v{display:block;font-size:22px;font-weight:800;margin-top:2px}.rk .s{display:block;font-size:11.5px;color:var(--muted,#5A6A82)}
.rk-bar{position:relative;height:16px;background:rgba(127,140,160,.15);border-radius:4px;min-width:90px}.rk-bar i{position:absolute;inset-inline-start:0;top:0;bottom:0;background:#38AC57;border-radius:4px}.rk-bar span{position:absolute;inset-inline-end:6px;top:0;font-size:11px;font-weight:700;line-height:16px}
.rk-t tr.rk-grp td{background:#051D48;color:#fff;font-weight:800}.rk-t tr.rk-grp td span{font-weight:400;opacity:.85}.rk-t tr.rk-c0 td{border-top:1.5px solid rgba(127,140,160,.5)}

const AR_DIG=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

function parseNum(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;let s=AR_DIG(v).replace(/[٬,\s]/g,'').replace('٫','.').replace(/(ر\.?س|sar|ريال)/gi,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);const n=Number(s);return s!==''&&isFinite(n)?n:NaN}
function parseDate(v){
  if(v==null||v==='')return null;

}

  let ix=BYID_IX.get(arr);if(!ix||ix.v!==dataVer||ix.n!==arr.length){const m=new Map();for(const x of arr)if(x&&x.id!=null)m.set(x.id,x);ix={v:dataVer,n:arr.length,m};BYID_IX.set(arr,ix)}

const inScope=r=>{const ids=scopeIds();if(!ids)return true;if(ids.includes(r.repId))return true;if(r.repTxt&&sellerSet(ids).has(normTxt(r.repTxt)))return true;return role()==='sup'&&!r.repId&&r.region&&r.region===me().region};

function brief(v){if(v==null||v==='')return '—';if(typeof v==='string')return v.startsWith('data:')?'[ملف]':v.slice(0,60);if(Array.isArray(v))return '['+v.length+']';if(typeof v==='object')return JSON.stringify(v).slice(0,60);return String(v)}
function diff(a,b){const out={};const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);keys.forEach(k=>{if(SKIP_DIFF.has(k))return;const x=JSON.stringify(a?.[k]),y=JSON.stringify(b?.[k]);if(x!==y)out[k]=[brief(a?.[k]),brief(b?.[k])]});return out}
const RETRY=new Set(['resource_exhausted','unavailable']);
async function dbSet(col,id,data){for(let a=0;;a++){try{return await db.collection(col).doc(id).set(data)}catch(e){if(a<5&&e&&RETRY.has(e.code)){await sleep(400*2**a+Math.random()*300);continue}throw e}}}
async function dbDel(col,id){for(let a=0;;a++){try{return await db.collection(col).doc(id).delete()}catch(e){if(a<5&&e&&RETRY.has(e.code)){await sleep(400*2**a+Math.random()*300);continue}throw e}}}
async function write(col,obj){
  const o=clean(obj);const id=o.id;delete o.id;
  if(mode==='db'){await dbSet(col,id,o);if(col==='impUndo'){}}
  else{const arr=S[col]||(S[col]=[]);const i=arr.findIndex(x=>x.id===id);const full={...o,id};if(i>=0)arr[i]=full;else arr.push(full);dataVer++;scheduleRender()}
}
async function delDoc(col,id){if(mode==='db')await dbDel(col,id);else{S[col]=(S[col]||[]).filter(x=>x.id!==id);dataVer++;scheduleRender()}}
async function logAudit(e){try{await write('audit',{id:uid('au-'),at:new Date().toISOString(),actor:me().id,reason:'',changes:{},...e})}catch(err){console.warn(err)}}
async function save(col,obj,opts={}){
  const prev=byId(col,obj.id);const now=new Date().toISOString();
  obj={...obj};if(!obj.id)obj.id=uid(col.slice(0,2)+'-');
  if(!prev){obj.createdAt=obj.createdAt||now;obj.createdBy=obj.createdBy||me().id}
  obj.updatedAt=now;if(prev&&prev.lastImport&&!opts.keepImport)obj.lastImport=null;
  const ch=diff(prev,obj);
  if(prev&&!Object.keys(ch).length)return obj;
  try{
    await write(col,obj);
    if(col!=='audit')await write('audit',{id:uid('au-'),at:now,actor:me().id,col,docId:obj.id,action:opts.action||(prev?'update':'create'),changes:ch,reason:opts.reason||''});
  }catch(e){handleErr(e);throw e}
  return obj;
}
async function remove(col,id,reason){
  const prev=byId(col,id);if(!prev)return;
  try{await delDoc(col,id);await logAudit({col,docId:id,action:'delete',changes:{name:[brief(prev.name||prev.title||prev.no||id),'—']},reason:reason||''})}catch(e){handleErr(e);throw e}
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast(L('لا تملك صلاحية الحفظ في هذه الصفحة. اطلب من مالكها صلاحية مساهم.','You can’t save here. Ask the owner for Contributor access.'));
  else if(c==='quota_exceeded')toast(L('امتلأت سعة قاعدة البيانات. احذف سجلات قديمة أو تجريبية.','Storage is full. Delete old or demo records.'));
  else toast(L('تعذّر الحفظ، حاول مرة أخرى.','Could not save. Try again.'));
}
async function pool(tasks,conc,onp){let i=0,done=0;const errs=[];let stop=false;
  async function w(){while(!stop&&i<tasks.length){const k=i++;try{await tasks[k]()}catch(e){errs.push(e);stop=true}done++;onp&&onp(done,tasks.length)}}
  await Promise.all(Array.from({length:Math.min(conc,tasks.length||1)},w));return errs}

  const at=(n,h,m)=>{const x=new Date(d(n)+'T00:00:00');x.setHours(h,m||0,0,0);return x.toISOString()};

function rowOK(f,rep,reg){

/* ============ Metrics & KPI engine ============ */
function metrics(f,P){
  const ix=I(),C=cfg();const {from,to,pf,pt}=P;
  const custs=S.clients.filter(c=>rowOK(f,c.repId,c.region));
  const seg={strategic:0,active:0,new:0,potential:0,dormant:0,lost:0};const custByReg={};const asPrev=addDays(from,-1);
  let newN=0,retBase=0,retKept=0;
  for(const c of custs){const s=segmentOf(c.id,to);seg[s]++;custByReg[c.region]=(custByReg[c.region]||0)+1;
    const ft=ix.first.get(c.id);if(ft&&ft>=from&&ft<=to)newN++;
    if(isActiveSeg(segmentOf(c.id,asPrev))){retBase++;if(hasTx(c.id,from,to))retKept++}}
  const activeN=seg.strategic+seg.active+seg.new;
  let coll=0,prev=0,n=0;const byRep={},byReg={},byCust={};
  for(const r of ix.coll){const inC=r.d>=from&&r.d<=to,inP=r.d>=pf&&r.d<=pt;if(!inC&&!inP)continue;if(!rowOK(f,r.rep,r.reg))continue;
    if(inC){coll+=r.amt;n++;byRep[r.rep||'']=(byRep[r.rep||'']||0)+r.amt;byReg[r.reg||'']=(byReg[r.reg||'']||0)+r.amt;const k=r.cid||('?'+r.code);byCust[k]=(byCust[k]||0)+r.amt}
    if(inP)prev+=r.amt}
  let openVal=0,openN=0,accVal=0,accN=0,rejVal=0,rejN=0,expN=0,quoteVal=0,quoteN=0;const openByReg={};
  for(const q of ix.quotes){if(!rowOK(f,q.rep,q.reg))continue;
    if((q.st==='open'||q.st==='pending')&&q.date<=to){openVal+=q.value;openN++;openByReg[q.reg]=(openByReg[q.reg]||0)+q.value}
    if(q.date>=from&&q.date<=to){quoteVal+=q.value;quoteN++}
    const bd=C.convBasis==='close'?q.close:q.date;
    if(bd&&bd>=from&&bd<=to){if(q.st==='accepted'){accVal+=q.value;accN++}else if(q.st==='rejected'){rejVal+=q.value;rejN++}else if(q.st==='expired')expN++}}
  const decided=accN+rejN+expN;
  return {custs,seg,assigned:custs.length,activeN,newN,dormantN:seg.dormant,lostN:seg.lost,inactiveN:seg.dormant+seg.lost,custByReg,
    coll,prev,n,growth:prev?(coll-prev)/prev:null,byRep,byReg,byCust,
    openVal,openN,openByReg,accVal,accN,rejVal,rejN,expN,quoteVal,quoteN,conv:decided?accN/decided:null,
    retention:retBase?retKept/retBase:null,retBase,activation:custs.length?activeN/custs.length:null,
    avgPerActive:activeN?coll/activeN:0,hist:custs.reduce((s,c)=>s+(+c.histValue||0),0)};
}
function kpiFor(f,P){
  const C=cfg();const m=metrics(f,P);const months=(daysBetween(P.from,P.to)+1)/30.4375;
  const reps=repsFor(f);const collT=reps.reduce((s,r)=>s+(+r.collTarget||0),0)*months,newT=reps.reduce((s,r)=>s+(+r.newTarget||0),0)*months;
  const T=C.targets;
  const items=[
    {k:'coll',actual:m.coll,target:collT,ach:collT?m.coll/collT:null,fmt:'money'},
    {k:'act',actual:m.activation,target:T.act/100,ach:m.activation==null||!T.act?null:m.activation/(T.act/100),fmt:'pct'},
    {k:'newc',actual:m.newN,target:newT,ach:newT?m.newN/newT:null,fmt:'num'},
    {k:'conv',actual:m.conv,target:T.conv/100,ach:m.conv==null||!T.conv?null:m.conv/(T.conv/100),fmt:'pct'},
    {k:'ret',actual:m.retention,target:T.ret/100,ach:m.retention==null||!T.ret?null:m.retention/(T.ret/100),fmt:'pct'}];
  const cap=C.cap>0?C.cap/100:Infinity;let ws=0,sc=0;
  items.forEach(it=>{it.w=+C.weights[it.k]||0;if(it.ach==null||!isFinite(it.ach)||!it.w){it.pts=null;return}it.pts=Math.min(it.ach,cap)*it.w;ws+=it.w;sc+=it.pts});
  const score=ws?sc/ws*100:null;
  return {m,items,score,collT,newT,months};
}
function monthly(f,endKey,n){
  const keys=[];let s=addMonths(endKey+'-01',-(n-1));for(let i=0;i<n;i++){keys.push(s.slice(0,7));s=addMonths(s,1)}
  const map=Object.fromEntries(keys.map(k=>[k,0]));const ix=I();
  for(const r of ix.coll){const k=r.d.slice(0,7);if(k in map&&rowOK(f,r.rep,r.reg))map[k]+=r.amt}
  const tgt=repsFor(f).reduce((a,r)=>a+(+r.collTarget||0),0);
  return {keys,coll:keys.map(k=>map[k]),target:keys.map(()=>tgt)};
}
function ranking(list,P,extra){
  const rows=list.map(x=>{const k=kpiFor(extra(x),P);return {x,k,score:k.score}});
  rows.sort((a,b)=>(b.score??-1)-(a.score??-1)||b.k.m.coll-a.k.m.coll);rows.forEach((r,i)=>r.rank=i+1);return rows;
}

/* ============ Field stats (visits) ============ */
function collSum(rid,from,to){let s=0;for(const r of I().coll)if(r.rep===rid&&r.d>=from&&r.d<=to)s+=r.amt;return s}
function repStats(rid){
  const t=TODAY(),ms=monthStart(),ws=weekStart(t);
  const r=byId('team',rid)||{};
  const qs=S.quotes.filter(q=>q.repId===rid&&q.source!=='import');
  const sales=qs.filter(q=>q.status==='ordered'&&inMonth(q.orderedAt)).reduce((s,q)=>s+qTotal(q),0);
  const coll=collSum(rid,ms,t);
  const vm=S.visits.filter(v=>v.repId===rid&&v.date>=ms&&v.date<=t);
  const planned=vm.filter(v=>v.planned!==false).length;
  const done=vm.filter(v=>v.status==='done').length;
  const eff=vm.filter(v=>v.status==='done'&&v.effective).length;
  const vw=S.visits.filter(v=>v.repId===rid&&v.date>=ws&&v.date<t&&v.planned!==false);
  const comp=vw.length?pct(vw.filter(v=>v.status==='done').length,vw.length):null;
  const op=S.opps.filter(o=>o.repId===rid);
  const open=op.filter(o=>!['order','lost'].includes(o.stage));
  const won=op.filter(o=>o.stage==='order').length,lost=op.filter(o=>o.stage==='lost').length;
  const newC=S.clients.filter(c=>c.repId===rid&&inMonth(c.createdAt)).length;
  const dim=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate();const prorate=(+t.slice(8,10))/dim;
  const target=+r.target||0;
  return {sales,coll,planned,done,eff,comp,open:open.length,openVal:open.reduce((s,o)=>s+(+o.value||0),0),conv:(won+lost)?pct(won,won+lost):null,newC,target,tPct:target?pct(sales,target):null,paceOk:!target||sales>=target*prorate*0.7};
}

  // --- sales intelligence (last 90 days vs the 90 before) ---
  const c0=addDays(t,-89),p1=addDays(t,-179),p0=addDays(t,-90);

  fields.forEach(f=>{const syn=f.syn.map(normTxt);const hit=nh.find(([h,n])=>!used.has(h)&&syn.includes(n));if(hit){map[f.k]=hit[0];used.add(hit[0])}});

function parseCSV(text){

    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}

  const amount=processed.reduce((s,i)=>s+(+i.amount||0),0);

function setProgress(done,total,label){const b=document.getElementById('progBar'),t=document.getElementById('progTxt');if(b)b.style.width=(total?done/total*100:0)+'%';if(t)t.textContent=(label||'')+` ${done} / ${total}`}

function progressModal(title,label){openModal(title,`<div class="prog"><i id="progBar"></i></div><div id="progTxt" class="small muted">${esc(label||'')}</div><div class="small muted">${L('لا تغلق الصفحة حتى يكتمل الحفظ.','Keep this page open until saving finishes.')}</div>`);BUSY=true;document.getElementById('mclose').disabled=true}
function endProgress(){BUSY=false;const b=document.getElementById('mclose');if(b)b.disabled=false}
function chunkBy(items,maxBytes){const out=[];let cur=[],size=0;for(const it of items){const s=JSON.stringify(it).length;if(cur.length&&size+s>maxBytes){out.push(cur);cur=[];size=0}cur.push(it);size+=s}if(cur.length)out.push(cur);return out}
async function impRun(){
  if(!canImport())return;const res=IMP.res;const type=IMP.tab;
  const work=res.items.filter(i=>['new','update','unmatched'].includes(i.status));
  if(!work.length){toast(L('لا توجد سجلات جديدة للاستيراد','Nothing new to import'));return}
  const impId=uid('imp-');const now=new Date().toISOString();const by=me().id;
  const base={id:impId,type,fileName:IMP.fileName,hash:IMP.hash,at:now,by,period:type==='collections'?{...IMP.period}:{},counts:res.counts,amount:res.amount,status:'pending',chunks:[],undo:[]};
  progressModal(L('جارٍ الاستيراد','Importing'),'');
  try{
    await write('imports',base);
    const undo=[],chunks=[];const tasks=[];
    if(type==='collections'){
      const rows=work.map(i=>i.data);const parts=chunkBy(rows,200000);
      parts.forEach((p,n)=>{const id=impId+'_'+n;chunks.push(id);tasks.push(()=>write('collChunks',{id,importId:impId,rows:p,createdAt:now,createdBy:by}))});
    }else{
      const col=IMP_COL[type];
      work.forEach(it=>{const prev=byId(col,it.id);const p=prev?clean(prev):null;if(p)delete p.id;undo.push({col,id:it.id,prev:p});
        let doc;
        if(type==='customers'){
          doc=prev?{...prev,...it.data}:{type:'contractor',status:'active',contact:'',phone:'',email:'',district:'',notes:'',repId:'',createdAt:now,createdBy:by,...it.data};
          doc.hist=[...(prev?.hist||[]).slice(-19),{at:now,imp:impId,ch:prev?it.ch:'create'}];
        }else if(type==='invoices'||type==='creditnotes'){
          doc=prev?{...prev,...it.data}:{source:'import',createdAt:now,createdBy:by,importId:impId,...it.data};
        }else if(type==='items'){
          doc=prev?{...prev,...it.data}:{createdAt:now,createdBy:by,...it.data};
        }else{
          doc=prev?{...prev,...it.data,history:[...(prev.history||[]),{at:now,imp:impId,ch:it.ch}]}:{source:'import',history:[],createdAt:now,createdBy:by,importId:impId,...it.data};
        }
        doc.id=it.id;doc.updatedAt=now;doc.lastImport=impId;
        tasks.push(()=>write(col,doc));
      });
    }
    const errs=await pool(tasks,4,(d,n)=>setProgress(d,n,L('تم حفظ','Saved')));
    if(errs.length)throw errs[0];
    const undoIds=[];
    if(undo.length){const parts=chunkBy(undo,180000);for(let n=0;n<parts.length;n++){const id=impId+'_u'+n;undoIds.push(id);await write('impUndo',{id,importId:impId,items:parts[n]})}}
    const done=new Date().toISOString();
    await write('imports',{...base,status:'active',chunks,undo:undoIds,doneAt:done});
    await logAudit({col:'imports',docId:impId,action:'import',changes:{[L('الملف','file')]:['—',IMP.fileName],[L('النوع','type')]:['—',L(IMP_DEF[type].ar,IMP_DEF[type].en)],[L('المعالج','processed')]:['—',String(res.counts.processed)],[L('المكرر','duplicates')]:['—',String(res.counts.duplicates)],[L('المرفوض','rejected')]:['—',String(res.counts.rejected)]}});
    try{const all=(S.settings.find(x=>x.id==='impcfg')||{}).types||{};const cur=all[type]||{};await write('settings',{id:'impcfg',types:{...all,[type]:{...cur,lastMap:{...IMP.map}}}})}catch(e){console.warn('impcfg',e)}
    endProgress();closeModal();
    IMP={tab:type,step:'done',last:{...base,status:'active'},period:IMP.period};render();
    toast(L('اكتمل الاستيراد وتم تحديث المؤشرات','Import complete — KPIs updated'));
  }catch(e){endProgress();console.error(e);closeModal();handleErr(e);
    toast(L('توقف الاستيراد قبل اكتماله. يمكنك التراجع عنه من «سجل الاستيراد».','Import stopped before finishing. You can reverse it from Import history.'));render()}
}
async function getUndo(imp){
  if(mode==='db'){const out=[];for(const id of imp.undo||[]){const s=await db.doc('impUndo/'+id).get();if(s.exists)out.push(...(s.data().items||[]))}
    if(!out.length){const q=await db.collection('impUndo').where('importId','==',imp.id).get();q.docs.forEach(d=>out.push(...(d.data().items||[])))}return out}
  return S.impUndo.filter(u=>u.importId===imp.id).flatMap(u=>u.items||[]);
}
function canReverse(imp){
  if(!canImport()||imp.status==='reversed')return false;
  if(imp.type==='collections')return true;
  const latest=S.imports.filter(i=>i.type===imp.type&&i.status!=='reversed').sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
  return latest&&latest.id===imp.id;
}
async function reverseImport(imp,reason){
  progressModal(L('جارٍ التراجع عن الاستيراد','Reversing import'),'');
  try{
    let skipped=0,restored=0,removed=0;
    if(imp.type!=='collections'){
      const items=await getUndo(imp);const doneAt=imp.doneAt||imp.at;const tasks=[];
      items.forEach(u=>{const cur=byId(u.col,u.id);
        if(cur&&cur.lastImport!==imp.id&&(cur.updatedAt||'')>doneAt){skipped++;return}
        if(u.prev==null){if(cur){removed++;tasks.push(()=>delDoc(u.col,u.id))}}
        else{restored++;tasks.push(()=>write(u.col,{...u.prev,id:u.id}))}});
      const errs=await pool(tasks,4,(d,n)=>setProgress(d,n,L('تمت معالجة','Processed')));if(errs.length)throw errs[0];
    }
    const now=new Date().toISOString();
    await write('imports',{...imp,status:'reversed',reversedAt:now,reversedBy:me().id,reverseReason:reason,reverseStats:{restored,removed,skipped}});
    await logAudit({col:'imports',docId:imp.id,action:'reverse',reason,changes:{[L('الملف','file')]:[imp.fileName,'—'],[L('مُستعاد','restored')]:['—',String(restored)],[L('مُزال','removed')]:['—',String(removed)],[L('متروك لتعديله بعد الاستيراد','skipped (edited later)')]:['—',String(skipped)]}});
    endProgress();closeModal();
    toast(imp.type==='collections'?L('تم التراجع. سجلات هذا الاستيراد محفوظة في السجل ومستبعدة من الحسابات.','Reversed. Records kept in history and excluded from calculations.'):L(`تم التراجع: استعادة ${restored}، إزالة ${removed}${skipped?`، وتُرك ${skipped} سجل عُدّل بعد الاستيراد`:''}`,`Reversed: ${restored} restored, ${removed} removed${skipped?`, ${skipped} edited later were left`:''}`));
  }catch(e){endProgress();closeModal();handleErr(e)}
}

/* ============ Charts (Chart.js, with an accessible fallback) ============ */
const CHQ=[];const CHM=new Map();let chartSeq=0;
// write HTML only when it actually changed — background data refreshes no longer repaint (and shake) an unchanged screen
function setHTML(el,h){if(!el)return false;if(el.__h===h)return false;el.innerHTML=h;el.__h=h;return true}
function chart(spec,h){const id='ch'+(++chartSeq);CHQ.push([id,spec]);return `<div class="chartbox" style="height:${h||260}px"><canvas id="${id}" role="img" aria-label="${esc(spec.title||'')}"></canvas></div>`}
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function chartFallback(s){const ser=s.series[0]||{data:[]};return bars(s.labels.map((l,i)=>({l,v:ser.data[i]||0})),s.money?smoney:null)}
function mountCharts(){
  for(const[id,ch]of CHM){if(!document.body.contains(ch.canvas)){try{ch.destroy()}catch(e){}CHM.delete(id)}}
  const q=CHQ.splice(0);if(!q.length)return;
  if(typeof Chart==='undefined'){q.forEach(([id,s])=>{const el=document.getElementById(id);if(el)el.parentNode.outerHTML=chartFallback(s)});return}
  const pal=['--c1','--c2','--c3','--c4','--c5','--c6'].map(tok);const ink=tok('--muted'),grid=tok('--line');const rtl=lang==='ar';
  Chart.defaults.font.family='Tajawal, "Segoe UI", sans-serif';Chart.defaults.color=ink;
  q.forEach(([id,s])=>{const el=document.getElementById(id);if(!el)return;
    const fmt=v=>s.money?smoney(v):s.pct?Math.round(v)+'%':num(v);
    const ds=s.series.map((x,i)=>{const col=x.color?tok(x.color):pal[i%pal.length];const tp=x.type||s.type;
      const base={label:x.label,data:x.data,borderColor:col,backgroundColor:tp==='doughnut'?s.labels.map((_,j)=>pal[j%pal.length]):(tp==='line'&&!x.dashed?col+'22':col),borderWidth:tp==='line'?2:0,borderRadius:tp==='bar'?4:0,maxBarThickness:36,order:tp==='line'?0:1};
      if(tp==='line'){Object.assign(base,{tension:.3,fill:!x.dashed,pointRadius:2.5,borderDash:x.dashed?[6,5]:undefined,pointBackgroundColor:col})}
      if(x.type)base.type=x.type;return base});
    const horiz=!!s.horizontal;const valAxis=horiz?'x':'y',catAxis=horiz?'y':'x';
    const scales=s.type==='doughnut'?{}:{[valAxis]:{beginAtZero:true,grid:{color:grid},ticks:{callback:fmt,maxTicksLimit:6},reverse:horiz&&rtl},[catAxis]:{grid:{display:false},ticks:{autoSkip:true,maxRotation:0,callback:function(v){const l=this.getLabelForValue(v);return String(l).length>22?String(l).slice(0,21)+'…':l}},position:horiz&&rtl?'right':undefined,reverse:!horiz&&rtl}};
    const cfgc={type:s.type,data:{labels:s.labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,indexAxis:horiz?'y':'x',locale:'en-US',
      plugins:{legend:{display:s.series.length>1||s.type==='doughnut',position:'bottom',rtl,labels:{boxWidth:12,usePointStyle:true}},tooltip:{rtl,callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${s.type==='doughnut'?num(c.parsed):fmt(horiz?c.parsed.x:c.parsed.y)}`}}},
      scales,onClick:s.onClick?(e,els)=>{if(els[0])s.onClick(els[0].index)}:undefined}};
    try{if(CHM.has(id))CHM.get(id).destroy();CHM.set(id,new Chart(el,cfgc))}catch(e){console.warn(e);el.parentNode.outerHTML=chartFallback(s)}});
}

  if(!o.noRegion&&isMgr())h+=`<label class="fl" for="fl_region">${L('المنطقة','Region')}<select id="fl_region" data-act="flt" data-k="region">${opt(REGIONS.map(r=>[r.id,L(r.ar,r.en)]),FL.region,L('كل المناطق','All regions'))}</select></label>`;
  if(!o.noRegion&&isMgr())h+=`<label class="fl" for="fl_sup">${L('المشرف','Supervisor')}<select id="fl_sup" data-act="flt" data-k="sup">${opt(S.team.filter(t=>t.role==='sup').map(t=>[t.id,t.name]),FL.sup,L('كل المشرفين','All supervisors'))}</select></label>`;
  if(!o.noRep&&isLead())h+=`<label class="fl" for="fl_rep">${L('المندوب','Rep')}<select id="fl_rep" data-act="flt" data-k="rep">${opt(repsFor({region:FL.region,sup:FL.sup}).map(r=>[r.id,r.name]),FL.rep,L('كل المندوبين','All reps'))}</select></label>`;

  return h;
}

async function plImportFile(file){
  if(typeof XLSX==='undefined'){toast(L('تعذّر تحميل مكتبة Excel','Excel library failed to load'));return}
  const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});const sheets=[];let yearSeen='';
  wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});const s=plParseSheet(rows,sn);if(s){if(s.year)yearSeen=s.year;sheets.push(s)}});
  sheets.forEach(s=>{if(!s.year)s.year=yearSeen||TODAY().slice(0,4);s.month=s.mi?`${s.year}-${String(s.mi).padStart(2,'0')}`:TODAY().slice(0,7);s.repId=repOf(s.repName)||''});
  if(!sheets.length){toast(L('لم أجد أوراق مندوبين بنفس تنسيق ملف البايب لاين','No rep sheets in the pipeline format were found'));return}
  PLI={file:file.name,sheets,region:me().region||(/jed|جد/i.test(file.name)?'jed':/mak|مك/i.test(file.name)?'mak':'jed')};plImportReview();
}
let PLI=null;
function plParseSheet(rows,sn){
  const cell=(r,c)=>rows[r]?.[c];const txt=(r,c)=>String(cell(r,c)??'').trim();
  const findLab=(lab)=>{for(let r=0;r<10;r++)for(let c=0;c<6;c++)if(normTxt(cell(r,c)).startsWith(lab))return r;return -1};
  const rr=findLab('اسمالمندوب');if(rr<0)return null;
  const val=r=>{for(let c=2;c<8;c++){const v=cell(r,c);if(v!==''&&v!=null)return v}return ''};
  const repName=String(val(rr)).trim();const mr=findLab('الشهر');let mi=0,year='';
  if(mr>=0){for(let c=2;c<8;c++){const v=cell(mr,c);const n=normTxt(v);const k=AR_MONTHS.findIndex(m=>normTxt(m)===n||n.startsWith(normTxt(m)));if(k>=0&&!mi)mi=k+1;if(/^\d{4}$/.test(String(v).trim()))year=String(v).trim();if(v instanceof Date){mi=v.getMonth()+1;year=String(v.getFullYear())}}}
  const tr=findLab('التارجت');const target=tr>=0?parseNum(val(tr)):0;
  let hr=-1;for(let r=0;r<20;r++){if(normTxt(cell(r,1)).startsWith('اسمالعميل')){hr=r;break}}if(hr<0)return null;
  const opps=[],risks=[],b3=[],bl=[];const st=v=>/جديد/.test(v)?'new':'old';const sz=v=>/كبير/.test(v)?'large':/صغير/.test(v)?'small':/متوسط/.test(v)?'medium':'';
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r]||[];if(row.some(v=>{const n=normTxt(v);return n.includes('نسبهالتحقيق')||n==='البيان'}))break;
    const name=txt(r,1);if(name){const pr=parseNum(cell(r,6));opps.push({name,status:st(txt(r,2)),size:sz(txt(r,3)),amount:parseNum(cell(r,4))??'',prob:pr==null||isNaN(pr)?'':(pr<=1?Math.round(pr*1000)/10:pr),actual:parseNum(cell(r,8))??''})}
    const rn=txt(r,12);if(rn)risks.push({name:rn,reason:txt(r,13)});
    const bn=txt(r,14);if(bn)b3.push({name:bn,value:parseNum(cell(r,15))??''});
    const ln=txt(r,16);if(ln)bl.push({name:ln,value:''});
  }
  opps.forEach(o=>{for(const k of ['amount','actual'])if(typeof o[k]==='number'&&isNaN(o[k]))o[k]=''});
  return {sn,repName,mi,year,target:isNaN(target)?0:Math.round(target||0),opps,risks,b3,bl};
}

  const P=PLI;const reps=S.team.filter(t=>t.role==='rep');

     <div class="tabs" style="margin-bottom:8px">${[['problems',L('تحتاج انتباه','Needs attention'),c.rejected+c.duplicates+c.unmatched],['new',L('جديد','New'),c.created-c.unmatched],['update',L('تحديث','Updates'),c.updated],['same',L('بدون تغيير','Unchanged'),c.same],...(c.skipped?[['skip',L('متجاهل','Ignored'),c.skipped]]:[]),['all',L('الكل','All'),c.total]].map(([k,l,n])=>`<button class="tab ${flt===k?'on':''}" data-act="filt" data-k="impF" data-v="${k}">${l} ${n}</button>`).join('')}</div>

V.integrity=()=>{

  const ix=I();
  const unm={};ix.coll.filter(r=>!r.cid).forEach(r=>{const k=normCode(r.code);unm[k]=unm[k]||{code:r.code,name:r.cn,n:0,amt:0,last:''};unm[k].n++;unm[k].amt+=r.amt;if(r.d>unm[k].last)unm[k].last=r.d});
  const unmQ={};ix.quotes.filter(q=>q.src==='import'&&!q.cid).forEach(q=>{const k=normCode(q.code);unmQ[k]=unmQ[k]||{code:q.code,name:q.cname,n:0,val:0};unmQ[k].n++;unmQ[k].val+=q.value});
  const codes={};S.clients.forEach(c=>{if(!c.code)return;const k=normCode(c.code);(codes[k]=codes[k]||[]).push(c)});const dupCodes=Object.values(codes).filter(a=>a.length>1);

  const recon=S.imports.filter(i=>i.type==='collections').map(i=>{const rows=S.collChunks.filter(c=>c.importId===i.id).flatMap(c=>c.rows||[]);const sum=rows.reduce((s,r)=>s+(+r.a||0),0);return {i,id:null,n:rows.length,sum,ok:Math.abs(sum-(i.amount||0))<1&&rows.length===(i.counts?.processed??rows.length)}});

   ${kpiTile(L('تحصيل غير مطابق','Unmatched collections'),Object.keys(unm).length+' '+L('كود','codes'),smoney(Object.values(unm).reduce((s,x)=>s+x.amt,0)))}${kpiTile(L('عملاء بلا مندوب أو كود','Customers missing rep/code'),noRep.length+noCode.length,okP(!noRep.length&&!noCode.length))}</div>
   <div class="card"><h2>${L('مطابقة ملفات التحصيل','Collection file reconciliation')}<span class="sub">${L('مجموع السندات المحفوظة مقابل المجموع المسجل وقت الاستيراد','Stored voucher total vs total recorded at import')}</span></h2>${table([{l:L('الملف','File'),f:x=>esc(x.i.fileName)},{l:L('الحالة','Status'),f:x=>x.i.status==='active'?pill(L('نافذ','Active'),'ok'):pill(x.i.status==='reversed'?L('متراجع عنه','Reversed'):L('غير مكتمل','Incomplete'),'warn')},{l:L('السندات','Vouchers'),c:'n',f:x=>x.n},{l:L('المجموع المحفوظ','Stored total'),c:'n',f:x=>money(x.sum)},{l:L('المسجل وقت الاستيراد','At import'),c:'n',f:x=>money(x.i.amount)},{l:L('النتيجة','Result'),f:x=>okP(x.ok)}],recon)}</div>
   <div class="card"><h2>${L('سندات تحصيل لعملاء غير موجودين','Collections for unknown customer codes')}<span class="sub">${L('تُطابق تلقائياً بمجرد إضافة العميل بنفس الكود','auto-matched once a customer with this code is added')}</span></h2>${table([{l:L('الكود','Code'),f:x=>`<b>${esc(x.code)}</b>`},{l:L('الاسم في الملف','Name in file'),f:x=>esc(x.name)},{l:L('السندات','Vouchers'),c:'n',f:x=>x.n},{l:L('المبلغ','Amount'),c:'n',f:x=>money(x.amt)},{l:L('آخر سند','Last'),f:x=>fdate(x.last)},{l:'',c:'n',f:x=>`<button class="btn s" data-act="newClientCode" data-code="${esc(x.code)}" data-name="${esc(x.name)}">${L('إنشاء العميل','Create customer')}</button>`}],Object.values(unm).map(x=>({...x,id:null})),'',{empty:L('كل سندات التحصيل مطابقة لعملاء','All vouchers matched')})}</div>

};

   table([{l:L('المندوب','Rep'),f:x=>`<b>${esc(x.r.name)}</b><div class="small muted">${regName(x.r.region)}</div>`},{l:L('طلبات البيع','Orders'),c:'n',f:x=>money(x.sales)},{l:L('المستهدف','Target'),c:'n',f:x=>x.tPct==null?'—':`${x.tPct}%${meter(x.tPct,x.paceOk?'':'w')}`},{l:L('التحصيل','Collected'),c:'n',f:x=>money(x.coll)},{l:L('زيارات','Visits'),c:'n',f:x=>`${x.done}/${x.planned}`},{l:L('فعّالة','Effective'),c:'n',f:x=>x.eff},{l:L('التزام الأسبوع','Week adherence'),c:'n',f:x=>x.comp==null?'—':pill(x.comp+'%',x.comp>=80?'ok':'warn')},{l:L('فرص مفتوحة','Open deals'),c:'n',f:x=>x.open},{l:L('تحويل الفرص','Win rate'),c:'n',f:x=>x.conv==null?'—':x.conv+'%'}],

  const byFam={};ordered.forEach(q=>(q.lines||[]).forEach(l=>{const f=PRODUCTS.find(p=>p.id===l.product)?.fam||'other';byFam[f]=(byFam[f]||0)+(+l.qty||0)*(+l.price||0)*(1-(+q.discount||0)/100)}));
  const openO=op.filter(o=>!['order','lost'].includes(o.stage));

/* ============ Forms ============ */
let FORM=null;
function field(f,val){
  if(f.t==='html')return f.html||'';
  const req=f.req?' <span class="req">*</span>':'';const id='f_'+f.k;const ro=f.ro?'disabled':'';let inp='';
  if(f.t==='sel')inp=`<select id="${id}" name="${f.k}" ${ro}>${opt(f.opts,val,f.empty??'—')}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}" ${ro}>${esc(val??'')}</textarea>`;
  else if(f.t==='check')inp=`<div class="chk"><label><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''} ${ro}> ${f.cl||''}</label></div>`;
  else if(f.t==='multi')inp=`<div class="chk">${f.opts.map(([v,l])=>`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(val||[]).includes(v)?'checked':''}> ${esc(l)}</label>`).join('')}</div>`;
  else if(f.t==='rows'){FORM.rows[f.k]=(val||[]).map(x=>({...x}));inp=`<div class="rows" id="rows_${f.k}"></div><button type="button" class="btn s" data-act="addRow" data-k="${f.k}">+ ${f.add||L('إضافة','Add')}</button>`}
  else inp=`<input id="${id}" name="${f.k}" type="${f.t==='num'?'number':f.t==='date'?'date':f.t==='time'?'time':'text'}" ${f.t==='num'?'step="any"':''} value="${esc(val??'')}" ${ro} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld ${f.full||['area','rows','multi'].includes(f.t)?'full':''}"><label for="${id}">${f.l}${req}</label>${inp}${f.hint?`<span class="small muted">${f.hint}</span>`:''}</div>`;
}
function renderRows(k){
  const f=FORM.fields.find(x=>x.k===k);const box=document.getElementById('rows_'+k);if(!box)return;
  box.innerHTML=FORM.rows[k].map((r,i)=>`<div class="rowi">${f.sub.map(s=>`<div class="fld"><label class="small">${s.l}</label>${s.t==='sel'?`<select data-row="${k}" data-i="${i}" data-sk="${s.k}">${opt(s.opts,r[s.k],'—')}</select>`:`<input data-row="${k}" data-i="${i}" data-sk="${s.k}" type="${s.t==='num'?'number':'text'}" step="any" value="${esc(r[s.k]??'')}">`}</div>`).join('')}<button type="button" class="btn s d" data-act="delRow" data-k="${k}" data-i="${i}">${L('حذف','Remove')}</button></div>`).join('')||`<div class="small muted">${L('لا توجد بنود','No lines')}</div>`;
}
function openForm({title,fields,data={},onSave,extra='',del}){
  FORM={fields,rows:{},onSave,data,del};
  const html=`<form id="theform" novalidate>${extra}<div class="fgrid">${fields.map(f=>field(f,data[f.k])).join('')}</div><div id="ferr" class="flag"></div><div class="formbar">${del?`<button type="button" class="btn d" data-act="formDel">${L('حذف','Delete')}</button>`:''}<span class="grow" style="flex:1"></span><button type="button" class="btn" data-act="closeModal">${L('إلغاء','Cancel')}</button><button type="submit" class="btn p">${L('حفظ','Save')}</button></div></form>`;
  openModal(title,html);fields.filter(f=>f.t==='rows').forEach(f=>renderRows(f.k));
}
function collect(){
  const out={};const form=document.getElementById('theform');
  FORM.fields.forEach(f=>{
    if(f.t==='html')return;
    if(f.ro){out[f.k]=FORM.data[f.k];return}
    if(f.t==='multi')out[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.t==='check')out[f.k]=form.querySelector(`[name="${f.k}"]`).checked;
    else if(f.t==='rows')out[f.k]=FORM.rows[f.k].map(r=>{const o={...r};f.sub.forEach(s=>{if(s.t==='num')o[s.k]=+o[s.k]||0});return o});
    else{const v=form.querySelector(`[name="${f.k}"]`).value;out[f.k]=f.t==='num'?(v===''?null:+v):v.trim()}
  });return out;
}
async function submitForm(){
  const vals=collect();const miss=FORM.fields.filter(f=>f.req&&(vals[f.k]==null||vals[f.k]===''||(Array.isArray(vals[f.k])&&!vals[f.k].length)));
  if(miss.length){document.getElementById('ferr').textContent=L('أكمل الحقول المطلوبة: ','Please complete: ')+miss.map(f=>f.l).join('، ');return}
  try{await FORM.onSave(vals);closeModal();toast(L('تم الحفظ','Saved'))}catch(e){console.error(e)}
}

async function stampPhoto(file,label){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,720/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);g.fillStyle='rgba(5,29,72,.75)';g.fillRect(0,cv.height-34,cv.width,34);g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textBaseline='middle';g.fillText(label,10,cv.height-17);
  return cv.toDataURL('image/jpeg',0.6);
}

async function optimizeDay(date,rid){
  const vs=S.visits.filter(v=>v.repId===rid&&v.date===date&&v.status==='planned').sort((a,b)=>(a.seq||0)-(b.seq||0));if(vs.length<3)return;const before=routeKm(vs);
  const rest=[...vs];const outv=[rest.shift()];
  while(rest.length){const last=byId('clients',outv[outv.length-1].clientId);let bi=0,bd=1e9;rest.forEach((v,i)=>{const d=haversine(last,byId('clients',v.clientId))??1e6;if(d<bd){bd=d;bi=i}});outv.push(rest.splice(bi,1)[0])}
  const after=routeKm(outv);if(after>=before-0.05){toast(L('الترتيب الحالي هو الأقصر','Current order is already shortest'));return}
  for(let i=0;i<outv.length;i++)if(outv[i].seq!==i+1)await save('visits',{...outv[i],seq:i+1});
  toast(L(`تم الترتيب: ${before.toFixed(1)} ← ${after.toFixed(1)} كم`,`Reordered: ${before.toFixed(1)} → ${after.toFixed(1)} km`));
}

async function writeAllDemo(title){

  if(!S.settings.find(x=>x.id==='kpi'))tasks.push(()=>write('settings',{id:'kpi',...clean(DEFAULT_CFG)}));
  progressModal(title,'');

/* ---- pipeline: fill the rep's sheet from his customers, open quotations and open orders ---- */
function plSources(rep,month){
  const repOfQ=q=>q.repId||byId('clients',q.clientId)?.repId||'';
  const mEnd=addMonths(month+'-01',1);const b3End=addMonths(month+'-01',4);
  const qs=S.quotes.filter(q=>repOfQ(q)===rep&&['open','pending','accepted'].includes(q.status)&&!(q.status==='accepted'&&q.closeDate&&q.closeDate<month+'-01')&&!S.orders.some(o=>o.quoteId===q.id||(o.quoteNo&&normCode(o.quoteNo)===normCode(q.no))));
  const os=S.orders.filter(o=>o.repId===rep&&(o.status==='open'||o.status==='partial'));
  return {qs,os,mEnd,b3End};
}
function plFillFromQuotes(){
  const {rep,month}=plCurrent();if(!plCanEdit(rep))return;const d=PL.doc;const {qs,os,mEnd,b3End}=plSources(rep,month);
  const have=new Set([...(d.opps||[]),...(d.backlog3||[]),...(d.backlogLater||[])].map(o=>normTxt(o.name)));
  const sizeOf=v=>v>=500000?'large':v>=100000?'medium':'small';
  const newDays=cfg().newDays||90;const isNew=cid=>{const c=byId('clients',cid);if(!c)return true;if(c.status==='prospect')return true;const at=c.createdAt||'';return at&&daysBetween(at.slice(0,10),TODAY())<=newDays&&!(c.histValue>0)};
  let a=0,b=0,c=0;
  const byClient=new Map();
  os.forEach(o=>{const k=o.clientId||normCode(o.clientCode);const x=byClient.get(k)||{name:o.cname||cName(o.clientId),cid:o.clientId,amt:0,prob:90,when:month+'-01',src:'order'};x.amt+=+o.value||0;byClient.set(k,x)});
  qs.forEach(q=>{const when=q.expClose||q.date||'';const k=q.clientId||normCode(q.clientCode);const pr=q.status==='accepted'?80:q.status==='pending'?50:30;
    if(!when||when<mEnd){const x=byClient.get(k)||{name:q.cname||cName(q.clientId),cid:q.clientId,amt:0,prob:pr,when,src:'quote'};x.amt+=+q.value||0;x.prob=Math.max(x.prob,pr);byClient.set(k,x)}
    else{const nm=q.cname||cName(q.clientId);if(have.has(normTxt(nm)))return;const row={name:nm,value:+q.value||0};if(when<b3End){(d.backlog3=d.backlog3||[]).push(row);b++}else{(d.backlogLater=d.backlogLater||[]).push(row);c++}have.add(normTxt(nm))}});
  byClient.forEach(x=>{if(!x.name||have.has(normTxt(x.name)))return;(d.opps=d.opps||[]).push({name:x.name,cid:x.cid||'',status:isNew(x.cid)?'new':'old',size:sizeOf(x.amt),amount:Math.round(x.amt),prob:x.prob,actual:''});have.add(normTxt(x.name));a++});
  if(!a&&!b&&!c){toast(L('لا توجد عروض أسعار أو أوامر بيع مفتوحة جديدة لهذا المندوب','No new open quotations or orders for this rep'));return}
  plDirty();render();toast(L(`أُضيف ${a} عميل للشهر، و${b} للـ Back log خلال 3 أشهر، و${c} بعدها. راجع النسب ثم احفظ.`,`Added ${a} for the month, ${b} to 3-month backlog, ${c} later. Review and save.`));
}

  const box=`<div class="banner info"><span class="sp">${L(`عملاء المندوب: <b>${mine}</b> · عروض أسعار مفتوحة: <b>${qs.length}</b> (${smoney(qs.reduce((s,q)=>s+(+q.value||0),0))}) · أوامر بيع مفتوحة: <b>${os.length}</b>. اضغط «تعبئة من العروض والأوامر» ليُبنى البايب لاين منها: المتوقع إغلاقه هذا الشهر في جدول الفرص، والباقي في الـ Back log حسب تاريخ الإغلاق المتوقع.`,`Rep customers: <b>${mine}</b> · open quotations: <b>${qs.length}</b> · open orders: <b>${os.length}</b>. Use “Fill from quotations & orders” to build the sheet.`)}</span>${qs.length||os.length?`<button class="btn s p" data-act="plFromQuotes">${L('تعبئة من العروض والأوامر','Fill from quotations & orders')}</button>`:''}</div>`;

/* ============ Verified field visits: real GPS, distance check, server time, photos in storage ============ */
const VISIT_RADIUS=()=>+(cfg().visitRadiusM||300);           // metres from the customer's site
const GPS_MAX_ACC=()=>+(cfg().gpsMaxAccM||150);               // accuracy worse than this is flagged
function getGPS(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error(L('الجهاز لا يدعم تحديد الموقع','This device has no location service')));
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),t:new Date().toISOString(),src:'gps'}),
      e=>rej(new Error(e.code===1?L('رفضت إذن الموقع. فعّل الموقع لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة.','Location permission denied. Allow location in the browser settings and retry.'):e.code===3?L('انتهت مهلة تحديد الموقع — تأكد إن GPS شغّال وجرب مرة ثانية.','Timed out — make sure GPS is on and retry.'):L('تعذّر تحديد الموقع','Could not get the location'))),
      {enableHighAccuracy:true,timeout:25000,maximumAge:0});
  });
}
const distM=(a,b)=>{const k=haversine(a,b);return k==null?null:Math.round(k*1000)};
const fmtDist=m=>m==null?'—':m<1000?`${m} ${L('م','m')}`:`${(m/1000).toFixed(1)} ${L('كم','km')}`;
function gpsBox(g,c){
  if(!g)return `<div class="banner"><span class="sp">${L('جاري تحديد موقعك من GPS…','Getting your GPS location…')}</span></div>`;
  const d=distM(g,c);const far=d!=null&&d>VISIT_RADIUS();const weak=g.acc>GPS_MAX_ACC();
  return `<dl class="kv card"><dt>${L('موقعك الآن','Your location')}</dt><dd dir="ltr">${g.lat}, ${g.lng} <a href="https://maps.google.com/?q=${g.lat},${g.lng}" target="_blank" rel="noopener">${L('خريطة','map')}</a></dd>
   <dt>${L('دقة GPS','GPS accuracy')}</dt><dd>±${g.acc} ${L('م','m')} ${weak?pill(L('ضعيفة','weak'),'warn'):pill(L('جيدة','good'),'ok')}</dd>
   <dt>${L('البعد عن موقع العميل','Distance to site')}</dt><dd>${c&&c.lat!=null&&c.lat!==''?`${fmtDist(d)} ${far?pill(L('خارج النطاق','outside range'),'bad'):pill(L('داخل النطاق','in range'),'ok')}`:`<span class="muted">${L('العميل ما له موقع مسجل','No site location on file')}</span>`}</dd></dl>
   ${far?`<div class="banner bad"><span class="sp">${L(`أنت على بعد ${fmtDist(d)} من موقع العميل (المسموح ${VISIT_RADIUS()} م). تقدر تكمل، بس الزيارة بتظهر للمشرف كـ«بعيدة عن الموقع» واكتب السبب.`,`You are ${fmtDist(d)} away (allowed ${VISIT_RADIUS()} m). You can continue but it will be flagged; give a reason.`)}</span></div>`:''}`;
}

async function stampPhoto2(file,label){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,1280/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);const lines=String(label).split('\n');const h=22*lines.length+12;
  g.fillStyle='rgba(5,29,72,.78)';g.fillRect(0,cv.height-h,cv.width,h);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textBaseline='middle';
  lines.forEach((ln,i)=>g.fillText(ln,10,cv.height-h+17+i*22));
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.72));
}
async function storePhoto(blob){
  try{const a=await window.claude?.use?.('assets');if(a){const r=await a.upload(new File([blob],'visit.jpg',{type:'image/jpeg'}));return r.url}}catch(e){console.warn('photo upload',e)}
  return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
}

visitFlags=function(v){
  const f=[];const c=byId('clients',v.clientId);const t=TODAY();const R=VISIT_RADIUS();
  if(v.status==='planned'&&v.date<t)f.push(['missed',L('فائتة','Missed')]);
  const ci=v.checkIn,co=v.checkOut;
  if(ci){
    if(ci.src==='none'||ci.lat===''||ci.lat==null)f.push(['nogps',L('بدون موقع GPS','No GPS')+(ci.reason?` — ${ci.reason}`:'')]);
    else{const d=ci.dist!=null?ci.dist:distM(ci,c);if(d!=null&&d>R)f.push(['far',L('بعيدة عن موقع العميل','Away from site')+` (${fmtDist(d)})`]);
      if(ci.acc!=null&&ci.acc>GPS_MAX_ACC())f.push(['lowacc',L('دقة GPS ضعيفة','Weak GPS')+` (±${ci.acc} ${L('م','m')})`])}
    if(ci.srv&&ci.t&&Math.abs(new Date(ci.srv)-new Date(ci.t))>30*6e4)f.push(['late',L('وقت الجهاز يختلف عن وقت الخادم','Device time differs from server')]);
  }
  if(v.status==='done'){
    if(co&&co.lat!==''&&co.lat!=null){const d=co.dist!=null?co.dist:distM(co,c);if(d!=null&&d>R*2)f.push(['farout',L('الإنهاء بعيد عن الموقع','Checked out away from site')+` (${fmtDist(d)})`])}
    if(ci&&co){const mins=(new Date(co.srv||co.t)-new Date(ci.srv||ci.t))/6e4;if(mins<10)f.push(['short',L('مدة قصيرة','Very short')+` (${Math.round(mins)} ${L('د','min')})`])}
    if(!(v.photos||[]).length)f.push(['nophoto',L('بدون صور','No photos')]);
    const dup=S.visits.filter(x=>x.id!==v.id&&x.status==='done'&&x.clientId===v.clientId&&x.repId===v.repId&&x.date===v.date);if(dup.length)f.push(['dup',L('مكررة','Duplicate')]);
  }
  if(c&&c.locPending&&c.locBy===v.repId)f.push(['locset',L('المندوب سجّل موقع العميل — يحتاج مراجعة','Rep set the site location — needs review')]);
  return f;
};

/* ---- route: nearest-neighbour from the rep's position, then 2-opt; open the route in Google Maps ---- */
optimizeDay=async function(date,rid){
  const all=S.visits.filter(v=>v.repId===rid&&v.date===date&&v.status==='planned').sort((a,b)=>(a.seq||0)-(b.seq||0));
  const geo=all.filter(v=>{const c=byId('clients',v.clientId);return c&&c.lat!=null&&c.lat!==''});const nog=all.filter(v=>!geo.includes(v));
  if(geo.length<2)return toast(L('يلزم زيارتين على الأقل لعملاء لهم موقع مسجل','Need at least two visits with a site location'));
  let start=null;if(date===TODAY()&&rid===me().id){try{start=await getGPS()}catch(e){}}
  const pt=v=>byId('clients',v.clientId);const len=(arr)=>{let k=start?haversine(start,pt(arr[0]))||0:0;for(let i=1;i<arr.length;i++)k+=haversine(pt(arr[i-1]),pt(arr[i]))||0;return k};
  const before=len(geo);const rest=[...geo];const out=[];
  let cur=start;if(!cur)out.push(rest.shift());
  while(rest.length){const from=cur||pt(out[out.length-1]);let bi=0,bd=1e9;rest.forEach((v,i)=>{const d=haversine(from,pt(v))??1e6;if(d<bd){bd=d;bi=i}});out.push(rest.splice(bi,1)[0]);cur=null}
  let improved=true;while(improved){improved=false;for(let i=0;i<out.length-1;i++)for(let j=i+1;j<out.length;j++){const n=[...out.slice(0,i),...out.slice(i,j+1).reverse(),...out.slice(j+1)];if(len(n)<len(out)-1e-6){out.splice(0,out.length,...n);improved=true}}}
  const after=len(out);const fin=[...out,...nog];
  for(let i=0;i<fin.length;i++)if(fin[i].seq!==i+1)await save('visits',{...fin[i],seq:i+1});
  toast(after<before-0.05?L(`تم الترتيب${start?' من موقعك الحالي':''}: ${before.toFixed(1)} ← ${after.toFixed(1)} كم`,`Reordered: ${before.toFixed(1)} → ${after.toFixed(1)} km`):L('الترتيب الحالي هو الأقصر','Current order is already shortest'));
};
function routeMapUrl(vs){const pts=vs.map(v=>byId('clients',v.clientId)).filter(c=>c&&c.lat!=null&&c.lat!=='').map(c=>`${c.lat},${c.lng}`);if(!pts.length)return '';
  const dest=pts.pop();return `https://www.google.com/maps/dir/?api=1&destination=${dest}${pts.length?`&waypoints=${encodeURIComponent(pts.join('|'))}`:''}&travelmode=driving`}
{const _p=V.plan;V.plan=()=>{let h=_p();
  // show the optimise button from two visits, and add a "route in Google Maps" link per day
  return h.replace(/<div class="toolbar"><button class="btn s" data-act="addPlan" data-d="([0-9-]+)" data-r="([^"]*)">([^<]*)<\/button>(?:<button class="btn s" data-act="optimize"[^>]*>[^<]*<\/button>)?<\/div>/g,(m,d,r,lbl)=>{
    const vs=S.visits.filter(v=>v.repId===r&&v.date===d&&v.status==='planned').sort((a,b)=>(a.seq||0)-(b.seq||0));const u=routeMapUrl(vs);
    return `<div class="toolbar"><button class="btn s" data-act="addPlan" data-d="${d}" data-r="${r}">${lbl}</button>${vs.length>1?`<button class="btn s" data-act="optimize" data-d="${d}" data-r="${r}">${L('ترتيب حسب المسافة','Order by distance')}</button>`:''}${u?`<a class="btn s" href="${u}" target="_blank" rel="noopener">${L('المسار في الخرائط','Route in Maps')}</a>`:''}</div>`})}}

/* ============ Configurable opportunity stages + field-visit verification settings ============ */
const BASE_STAGES=OPP_STAGES.map(s=>[...s]);
function stagesDoc(){return S.settings.find(x=>x.id==='stages')}
function syncStages(){
  const d=stagesDoc();const list=d&&Array.isArray(d.list)&&d.list.length?d.list:null;
  const want=list?[...list.filter(x=>x.id!=='order'&&x.id!=='lost').map(x=>[x.id,x.ar,x.en||x.ar,+x.prob||0]),
    (()=>{const w=list.find(x=>x.id==='order')||{};return ['order',w.ar||'طلب بيع',w.en||'Sales order',w.prob!=null&&w.prob!==''?+w.prob:100]})(),
    (()=>{const w=list.find(x=>x.id==='lost')||{};return ['lost',w.ar||'خسارة',w.en||'Lost',0]})()]:BASE_STAGES;
  if(JSON.stringify(want)!==JSON.stringify(OPP_STAGES)){OPP_STAGES.length=0;want.forEach(s=>OPP_STAGES.push([...s]))}
}
{const _render=render;render=function(){try{syncStages()}catch(e){console.warn(e)}return _render.apply(this,arguments)}}

async function mNotifyCheck(force){
  if(!MOB.on||typeof Notification==='undefined'||Notification.permission!=='granted'||mode!=='db'||!loaded.has('visits'))return;
  const t=TODAY();let seen={};try{seen=JSON.parse(localStorage.getItem('wady.m.seen')||'{}')}catch(e){}if(seen.day!==t)seen={day:t,keys:[]};
  const items=[];const pend=S.visits.filter(v=>v.repId===me().id&&v.date===t&&v.status==='planned');
  if(pend.length)items.push({key:'today-'+pend.length,title:L('زيارات اليوم','Today’s visits'),body:L(`عندك ${pend.length} زيارة مخططة اليوم`,`${pend.length} visits planned today`)});
  myAlerts().slice(0,5).forEach(a=>items.push({key:a.key,title:a.title,body:a.desc}));
  const reg=await navigator.serviceWorker?.getRegistration?.().catch(()=>null);
  for(const it of items){if(!force&&seen.keys.includes(it.key))continue;seen.keys.push(it.key);
    try{if(reg)await reg.showNotification(it.title,{body:it.body,tag:it.key,icon:'icon-192.png',badge:'icon-192.png',data:{url:'index.html?m=1#malerts'}});else new Notification(it.title,{body:it.body,tag:it.key})}catch(e){}}
  try{localStorage.setItem('wady.m.seen',JSON.stringify(seen))}catch(e){}
}

function cfField(f){const base={k:cfKey(f),l:f.ar,req:f.req?1:0};
  if(f.type==='num')return {...base,t:'num'};if(f.type==='date')return {...base,t:'date'};if(f.type==='area')return {...base,t:'area'};

function declineRows(f){const ix=I();const t=TODAY();const out=[];
  vis(S.clients).forEach(c=>{if(!rowOK(f,c.repId,c.region))return;const rs=ix.collByCust.get(c.id);if(!rs||rs.length<3)return;
    const ds=[...new Set(rs.map(r=>r.d))].sort();const gaps=[];for(let i=1;i<ds.length;i++)gaps.push(daysBetween(ds[i-1],ds[i]));gaps.sort((a,b)=>a-b);const med=gaps[Math.floor(gaps.length/2)]||30;
    const last=ds[ds.length-1];const since=daysBetween(last,t);
    const v=(a,b)=>rs.filter(r=>r.d>=a&&r.d<=b).reduce((s,r)=>s+r.amt,0);const recent=v(addDays(t,-89),t),base=v(addDays(t,-269),addDays(t,-90))/2;
    const why=[];if(since>Math.max(30,med*2))why.push(L(`انقطع ${since} يوم (عادته كل ${med} يوم)`,`Silent ${since} days (usually every ${med})`));
    if(base>0&&recent<base*.5)why.push(L(`تحصيل آخر 90 يوم ${smoney(recent)} مقابل متوسط ${smoney(base)}`,`Last 90 days ${smoney(recent)} vs avg ${smoney(base)}`));
    if(!why.length||since>365)return;
    const planned=S.visits.some(x=>x.clientId===c.id&&x.status==='planned'&&x.date>=t);
    out.push({id:c.id,c,last,since,med,recent,base,why,planned,drop:base>0?1-recent/base:0})});
  return out.sort((a,b)=>b.base-a.base)}

function invValidate(it,g,nums,dates,seen,rowNo,ix,rej,has){
  const no=String(g('no')).trim(),nn=normCode(no);
  if(seen.has(nn)){it.status='dup';it.reason=L(`رقم فاتورة مكرر داخل الملف (السطر ${seen.get(nn)})`,`Duplicate invoice no. in file (row ${seen.get(nn)})`);return}seen.set(nn,rowNo);
  const hasBal='bal' in nums,hasPaid='paid' in nums;
  if(hasBal&&!nums.bal){it.status='skip';it.reason=L('رصيدها صفر — مسددة','Zero balance — paid');return}
  if(!hasBal&&nums.amount==null){it.status='rej';it.reason=L('لازم «قيمة الفاتورة» أو «الرصيد المتبقي»','Amount or balance required');return}
  const bal=hasBal?nums.bal:hasPaid?nums.amount-nums.paid:null;
  const code=String(g('code')).trim();const c=ix.custByCode.get(normCode(code));
  let repId='';if(has('rep')&&g('rep')!==''){repId=repOf(g('rep'))||'';if(!repId)it.note=L('المندوب غير معرّف، سيُنسب لمندوب العميل','Rep not found; customer rep used')}
  const amount=nums.amount!=null?nums.amount:bal;if(nums.amount!=null&&nums.amount<=0){it.status='skip';it.reason=L('قيمة صفر أو سالبة','Zero or negative amount');return}
  let due=dates.due||'';if(!due&&c&&+c.payDays>0)due=addDays(dates.date,+c.payDays);
  const data={no,clientCode:code,cname:String(g('name')||c?.name||'').trim(),date:dates.date,dueDate:due||dates.date,dueSrc:dates.due?'file':(due?'terms':'date'),amount,...(bal!=null?{bal,paid:amount-bal}:{bal:null,paid:null}),repId:repId||c?.repId||'',region:c?.region||''};
  if(c)data.clientId=c.id;
  const ex=S.invoices.find(x=>normCode(x.no)===nn);it.data=data;it.amount=bal??amount;
  if(ex){const ch=diff(ex,{...ex,...data});if(!Object.keys(ch).length){it.status='same';it.reason=L('بدون تغيير','No change')}else{it.status='update';it.ch=ch;it.id=ex.id;it.reason=Object.keys(ch).join('، ')}}
  else{it.id='inv-'+safeId(no);if(!c){it.status='unmatched';it.reason=L('كود العميل غير موجود — تُحفظ وتظهر باسمها لين يُضاف العميل','Customer code not in master — kept')}}
}

async function tkComplete(id){const t=byId('tasks',id);if(!t)return;const now=new Date().toISOString();

function tkIcsText(list){const z=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const dt=(d,t)=>d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');
  const ev=list.map(t=>{const end=t.time?(()=>{const [h,m]=t.time.split(':').map(Number);const e=h*60+m+30;return String(Math.floor(e/60)%24).padStart(2,'0')+':'+String(e%60).padStart(2,'0')})():null;
    const rr=t.repeat&&t.repeat!=='none'?`\r\nRRULE:FREQ=${t.repeat.toUpperCase()}${t.until?';UNTIL='+t.until.replace(/-/g,'')+'T235959Z':''}`:'';
    const al=t.remind!==''&&t.remind!=null?`\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${z(t.title)}\r\nTRIGGER:-PT${+t.remind}M\r\nEND:VALARM`:'';
    return `BEGIN:VEVENT\r\nUID:${t.id}@alwady-crm\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\n${t.time?`DTSTART;TZID=Asia/Riyadh:${dt(t.date,t.time)}\r\nDTEND;TZID=Asia/Riyadh:${dt(t.date,end)}`:`DTSTART;VALUE=DATE:${dt(t.date)}`}${rr}\r\nSUMMARY:${z((TASK_KINDS[t.kind]?.[0]||'')+': '+t.title)}\r\nDESCRIPTION:${z((t.clientId?cName(t.clientId)+'\n':'')+(t.notes||''))}${al}\r\nEND:VEVENT`}).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AlWady//CRM//AR\r\n${ev}\r\nEND:VCALENDAR`}
function tkIcs(list,name){const b=new Blob([tkIcsText(list)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name||'tasks.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

  if(!kd||kd==='visit')vis(S.visits).forEach(v=>{if(v.date<from||v.date>to||(rep&&v.repId!==rep)||v.status==='cancelled')return;out.push({d:v.date,tm:v.time||'',ic:'📍',tx:L('زيارة: ','Visit: ')+cName(v.clientId),open:'visit',id:v.id,done:v.status==='done',late:v.status==='planned'&&v.date<TODAY(),rep:v.repId})});

function ceHistory(){const q=normTxt(fv('ceHQ',''));const by=new Map();const mk=TODAY().slice(0,7);

function ceHelp(){const c=CEX.cfg||{};const th=money(c.threshold??20000);return `<div class="card" style="line-height:1.9"><h2>كيف تشتغل الوحدة</h2>

 <li>يكمل السبب (قائمة إلزامية) والمبررات والأهمية وموعد السداد، ويرفق الحوالة أو خطاب العميل، ويرسل.</li>
 <li><b>المشرف</b> يراجع ويكتب توصيته ويرفع الطلب، أو يعيده للمندوب. ما يملك موافقة ولا رفض.</li>
 <li>النظام يحدد المعتمد آلياً: التجاوز حتى ${th} ← <b>مدير المبيعات</b>، وأكثر من ${th} ← <b>المدير العام</b>. وقت القرار يُعاد حساب الرصيد، ولو صار التجاوز أكبر من سقف مدير المبيعات يتحول الطلب تلقائياً للمدير العام.</li>
 <li>المعتمد: موافقة (مع مدة صلاحية حتى ${c.validity_days??3} أيام عمل) أو رفض أو إعادة لاستكمال البيانات.</li>
 <li>بعد التوريد يُسجّل «تنفيذ التوريد» برقم أمر البيع وقيمته، والقيمة لازم ما تزيد عن المعتمد. لو فعّلت منع التوريد، جدولة التوصيل لعميل متجاوز حده تتوقف لين يكون له استثناء ساري، وتُسجل كتنفيذ تلقائياً.</li>
 <li>الاستثناء يتسوّى تلقائياً لما يرجع رصيد العميل ضمن حده حسب كشف SAP، ولو تأخر عن موعد السداد يوصل تنبيه للمندوب والمشرف ومدير المبيعات.</li></ol>

 <li>ما يُقبل طلب جديد للعميل وعنده استثناء غير مسوّى، أو طلب آخر مفتوح (منع التقسيم).</li>
 <li>ما أحد يعتمد طلب هو مقدمه أو مندوبه، حتى لو عنده أكثر من دور.</li>

 <li>لو كشف فواتير SAP غير موجود أو أقدم من ${c.max_data_age_hours??24} ساعة، أو الحد الائتماني غير مسجل، يُمنع الإرسال والاعتماد برسالة واضحة.</li>
 <li>كل تغيير حالة يتسجل في سجل تدقيق ما يُعدّل ولا يُحذف.</li></ul>
 <h2>تعديل الإعدادات</h2><p>من تبويب «الإعدادات» (لمدير النظام): سقف مدير المبيعات، والحد الشهري، ومدة الصلاحية، وأقصى عمر لبيانات SAP، وأيام العطلة، وأسماء مدير المبيعات والمدير العام، ومنع جدولة التوصيل. مدير النظام ما يقدر يضيف نفسه معتمداً، والمعتمدين يحتاجون صفحة «استثناءات التوريد الائتماني» في صلاحيات CRM.</p>

/* ============ Pipeline approval: rep → supervisor → system admin (rules enforced again on the server) ============ */
const PL_ST={draft:['مسودة','Draft',''],submitted:['بانتظار اعتماد المشرف','Awaiting supervisor','warn'],sup:['بانتظار اعتماد مدير النظام','Awaiting system admin','warn'],approved:['معتمد','Approved','ok'],returned:['مُرجع للتعديل','Returned','bad']};
const plSt=d=>(d&&d.appr&&d.appr.status)||'draft';
const plStPill=d=>{const s=PL_ST[plSt(d)];return pill(L(s[0],s[1]),s[2])};
const plRepSup=rep=>{const t=byId('team',rep);return t&&t.supId&&byId('team',t.supId)?t.supId:''};
function plMayAct(doc,ns){const st=plSt(doc),rep=doc.repId,uid=me().id;
  if(ns==='submitted')return ['draft','returned'].includes(st)&&(rep===uid||isLead());
  if(ns==='sup')return st==='submitted'&&rep!==uid&&(plRepSup(rep)===uid||(!plRepSup(rep)&&isAdmin()));
  if(ns==='approved')return st==='sup'&&rep!==uid&&isAdmin();
  if(ns==='returned')return (isAdmin()&&['submitted','sup','approved'].includes(st))||(st==='submitted'&&plRepSup(rep)===uid);
  return false}
{const _pce=plCanEdit;plCanEdit=function(rep){if(!_pce(rep))return false;const st=plSt(PL.doc);return ['draft','returned'].includes(st)||isAdmin()}}
function plApprBar(doc){const a=doc.appr||{},st=plSt(doc);const who=id=>id?esc(tName(id)):'';const dt=s=>s?esc(String(s).replace('T',' ').slice(0,16)):'';
  const steps=[['subBy','subAt',L('أرسله المندوب','Sent by rep')],['supBy','supAt',L('اعتماد المشرف','Supervisor approval')],['admBy','admAt',L('اعتماد مدير النظام','System admin approval')]];
  const done=st==='approved'?3:st==='sup'?2:st==='submitted'?1:0;
  const trail=steps.map(([b,t,l],i)=>`<span class="pl-step ${i<done?'ok':i===done&&st!=='draft'&&st!=='returned'?'cur':''}">${i<done?'✓':i+1} ${l}${i<done&&a[b]?` <small>${who(a[b])} · ${dt(a[t])}</small>`:''}</span>`).join('<span class="pl-arr">←</span>');
  const btn=(ns,lab,cls)=>plMayAct(doc,ns)?`<button class="btn s ${cls||''}" data-act="plAppr" data-ns="${ns}">${lab}</button>`:'';
  return `<div class="card pl-appr"><div class="row" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><b>${L('حالة الاعتماد','Approval')}:</b> ${plStPill(doc)}<span class="pl-trail">${trail}</span><span style="flex:1"></span>
    ${PL.exists?btn('submitted',st==='returned'?L('إعادة الإرسال للاعتماد','Resubmit'):L('إرسال للمشرف للاعتماد','Send for approval'),'p'):''}${btn('sup',L('اعتماد المشرف','Approve (supervisor)'),'p')}${btn('approved',L('اعتماد نهائي','Final approval'),'p')}${btn('returned',st==='approved'?L('إعادة فتح للتعديل','Reopen'):L('إرجاع للتعديل','Return'),'d')}</div>
    ${st==='returned'&&a.note?`<div class="banner warn" style="margin-top:8px"><span class="sp">${L('سبب الإرجاع','Returned because')}: ${esc(a.note)}${a.retBy?` — ${who(a.retBy)} · ${dt(a.retAt)}`:''}</span></div>`:''}
    ${['submitted','sup','approved'].includes(st)&&!isAdmin()?`<div class="small muted" style="margin-top:6px">${L('البايب لاين مقفول للتعديل أثناء الاعتماد. خانة «الفعلي» تتحدث تلقائياً من سندات التحصيل.','The sheet is locked while in approval. Actuals still update from collection vouchers.')}</div>`:''}
    ${!PL.exists&&(doc.repId===me().id||isLead())?`<div class="small muted" style="margin-top:6px">${L('احفظ البايب لاين أولاً ثم أرسله للاعتماد.','Save the sheet first, then send it for approval.')}</div>`:''}</div>`}
{const _sv=plSheetView;plSheetView=function(){const h=_sv();if(!PL.doc||!PL.doc.repId)return h;const i=h.indexOf('<div id="plBar"');return i<0?plApprBar(PL.doc)+h:h.slice(0,i)+plApprBar(PL.doc)+h.slice(i)}}

{const _pv=V.pipeline;V.pipeline=function(){const w=isLead()?plWaiting():[];return (w.length?`<div class="banner warn"><span class="sp">${L('بايب لاين بانتظار اعتمادك','Pipelines awaiting your approval')}: ${w.map(d=>`<a href="#" data-act="plGo" data-r="${esc(d.repId)}" data-m="${esc(d.month)}">${esc(tName(d.repId))} — ${esc(monthLabel(d.month))}</a>`).join(' · ')}</span></div>`:'')+_pv()}}

ACT.plAppr=async d=>{const ns=d.ns;if(PL.dirty){toast(L('احفظ التغييرات أولاً','Save your changes first'));return}
  const cur=byId('pipeline',PL.key);if(!cur){toast(L('احفظ البايب لاين أولاً','Save the sheet first'));return}
  let note='';if(ns==='returned'){note=(prompt(L('سبب الإرجاع للتعديل:','Reason for returning:'))||'').trim();if(!note){toast(L('لازم تكتب السبب','A reason is required'));return}}
  else if(!confirm(ns==='submitted'?L('إرسال البايب لاين للاعتماد؟ بيتقفل التعديل لين يتم الاعتماد أو الإرجاع.','Send for approval? Editing locks until it is approved or returned.'):L('تأكيد الاعتماد؟','Confirm approval?')))return;
  const doc=clean(cur);doc.appr={...(doc.appr||{}),status:ns,...(note?{note}:{})};
