<style>
/* Layout: navy sidebar (fixed on desktop, drawer on phones) + quiet light work area; cards only where a block is a separate object */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#0B1A33; --muted:#5A6A82; --line:#E0E6EF;

}

  --navy:#06132B; --navy-2:#0F2752; --navy-ink:#DCE5F5; --navy-muted:#7F93B8;
  --green:#4CC26C; --green-soft:#16301F; --accent:#8DB0EE; --accent-soft:#1A2A47;
  --ok:#6FD195; --ok-bg:#163021; --warn:#F0B35E; --warn-bg:#33260F; --bad:#F2928A; --bad-bg:#3A1A18;
  --info:#8DB6F2; --info-bg:#172A47; --neutral:#A9B5C8; --neutral-bg:#1E2A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1222; --surface:#111C30; --surface-2:#16233B; --ink:#E5ECF6; --muted:#9AA9C0; --line:#24324C;
  --navy:#06132B; --navy-2:#0F2752; --navy-ink:#DCE5F5; --navy-muted:#7F93B8;

html,body{height:100%}

/* shell */

.add-locked{opacity:.6;cursor:not-allowed}.add-locked .lock-tag{font-size:11px;font-weight:500;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 6px;margin-inline-start:4px}

/* building blocks */

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}

.btn.ok{background:var(--green);border-color:var(--green);color:#fff}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

.list{display:flex;flex-direction:column}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px 14px}

.modal-bg{position:fixed;inset:0;background:rgba(5,15,35,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(env(safe-area-inset-top,0px) + 30px) 30px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

}

/* approval flow track */
.flow{list-style:none;margin:0;padding:4px 0 2px;display:flex;gap:0;overflow-x:auto;counter-reset:f}
.fstep{flex:1 1 0;min-width:120px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px}
.fstep::before{content:"";position:absolute;top:16px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;background:var(--line);border-radius:2px}
.fstep:first-child::before{display:none}
.fstep.done::before,.fstep.active::before,.fstep.rejected::before,.fstep.returned::before{background:var(--green)}
.fdot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.fstep.done .fdot{background:var(--green);border-color:var(--green);color:#fff}
.fstep.active .fdot{border-color:var(--info);color:var(--info);background:var(--info-bg);box-shadow:0 0 0 4px color-mix(in srgb,var(--info) 18%,transparent)}
.fstep.rejected .fdot{background:var(--bad);border-color:var(--bad);color:#fff}
.fstep.returned .fdot{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fstep.skipped{opacity:.45}
.fbody{display:flex;flex-direction:column;gap:1px;margin-top:6px;min-width:0}
.fbody b{font-size:13.5px;line-height:1.35}
.fwho{font-size:12.5px;color:var(--ink);opacity:.85}
.fdate{font-size:12px;color:var(--muted)}
.fnote{font-size:11.5px;color:var(--info)}
.fstep.returned .fnote{color:var(--warn)}
.flow.compact .fstep{min-width:96px}.flow.compact .fdot{width:28px;height:28px;font-size:12px}.flow.compact .fstep::before{top:13px}
