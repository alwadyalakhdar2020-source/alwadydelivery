<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الوادي الأخضر — منصة الأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<!--wady-brand--><script src="brand/wady-brand.js"></script><meta name="theme-color" content="#051D48"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الوادي الأخضر"><link rel="apple-touch-icon" href="brand/icon-180.png"><link rel="manifest" href="brand/manifest.webmanifest"><!--/wady-brand--><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<style>
/* Layout: operations console — fixed nav rail (desktop) / bottom tab bar (phone), one working column of filter bar, KPI tiles, charts and lists */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF3; --line:#D9DFEA;
  --ink:#051D48; --muted:#5A6885; --brand:#051D48; --brand-ink:#FFFFFF;
  --accent:#38AC57; --accent-ink:#1E7A3A; --accent-soft:#E2F4E7;
  --warn:#F39235; --warn-ink:#9A4F07; --warn-soft:#FDEEDC;
  --bad:#D23F3F; --bad-ink:#A12424; --bad-soft:#FBE3E3;
  --info:#34BEF0; --info-ink:#0C6E94; --info-soft:#DDF3FC;
  --barfill:#051D48;
  --c1:#051D48; --c2:#38AC57; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#A3AEC4;
  --font:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(5,29,72,.06),0 4px 14px rgba(5,29,72,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071226; --surface:#0E1C38; --sunk:#14264A; --line:#22365E;
  --ink:#E7EDF7; --muted:#9AAAC8; --brand:#0B2A63; --brand-ink:#FFFFFF;
  --accent:#45BF65; --accent-ink:#7EDB97; --accent-soft:#15382A;
  --warn:#F39235; --warn-ink:#F8B678; --warn-soft:#3D2A14;
  --bad:#E25858; --bad-ink:#F29393; --bad-soft:#3E1C22;
  --info:#34BEF0; --info-ink:#86D8F7; --info-soft:#123449; --barfill:#34BEF0;
  --c1:#7FA6E8; --c2:#45BF65; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#5A6885;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0E1C38; --sunk:#14264A; --line:#22365E;
  --ink:#E7EDF7; --muted:#9AAAC8; --brand:#0B2A63; --brand-ink:#FFFFFF;
  --accent:#45BF65; --accent-ink:#7EDB97; --accent-soft:#15382A;
  --warn:#F39235; --warn-ink:#F8B678; --warn-soft:#3D2A14;
  --bad:#E25858; --bad-ink:#F29393; --bad-soft:#3E1C22;
  --info:#34BEF0; --info-ink:#86D8F7; --info-soft:#123449; --barfill:#34BEF0;
  --c1:#7FA6E8; --c2:#45BF65; --c3:#F39235; --c4:#34BEF0; --c5:#8FC153; --c6:#5A6885;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
#app{min-height:100%}
#app[data-shell="1"]{display:grid;grid-template-columns:240px minmax(0,1fr)}
#side{background:var(--brand);color:var(--brand-ink);padding-block:18px;padding-inline:12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{opacity:.7;font-size:12px}
.navgrp{font-size:11px;letter-spacing:.06em;opacity:.55;padding-inline:8px;margin-top:6px}
#side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;opacity:.85;border:0;background:none;width:100%;text-align:start;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.08);opacity:1}
.nv.on{background:rgba(255,255,255,.14);opacity:1;font-weight:700}
.nv svg{width:18px;height:18px;flex:none}
.nv .cnt{margin-inline-start:auto;background:var(--warn);color:#2b1600;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#top h1{font-size:18px;margin:0;font-weight:800;flex:1;min-width:0;text-wrap:balance}
.asbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.asbox select{max-width:220px}
#view{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
#tabbar{display:none}
.banner{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--info-soft);color:var(--info-ink)}
.banner.ok{background:var(--accent-soft);color:var(--accent-ink)}
.banner.bad{background:var(--bad-soft);color:var(--bad-ink)}
.banner .sp{flex:1;min-width:200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:500;color:var(--muted);font-size:12px}
.card h2 .end{margin-inline-start:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--accent-ink);font-weight:700} .down{color:var(--bad-ink);font-weight:700}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter.w i{background:var(--warn)} .meter.b i{background:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fbar .fl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.fbar .fl select,.fbar .fl input{width:auto;min-width:130px}
.fbar .per{font-size:12px;color:var(--muted);margin-inline-start:auto;align-self:center}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;width:100%}
textarea{min-height:76px;resize:vertical}
.toolbar input,.toolbar select{width:auto}
.toolbar .grow input{width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:36px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(.95)}
.btn.d{color:var(--bad-ink);border-color:var(--bad)}
.btn.s{padding:4px 9px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}
.pill.strong{background:var(--brand);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0;text-align:start;width:100%}
.li:hover{border-color:var(--muted)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end;flex:none}
.li.sev-bad{border-inline-start:4px solid var(--bad)} .li.sev-warn{border-inline-start:4px solid var(--warn)} .li.sev-info{border-inline-start:4px solid var(--info)} .li.sev-good{border-inline-start:4px solid var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--sunk)}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:var(--sunk)}
td.n,th.n{text-align:end;white-space:nowrap}
td.nw{white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:22px}
.muted{color:var(--muted)} .small{font-size:12px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:13px;margin:2px 4px;display:flex;justify-content:space-between;gap:6px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kc .t{font-weight:700;font-size:14px}
.kc .row{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--sunk);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{outline:2px solid var(--accent)}
.day h4{margin:2px 4px;font-size:13px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.pv .seq{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--barfill);border-radius:6px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartbox{position:relative;width:100%;min-width:0}
.chartbox canvas{max-width:100%}
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.flag{font-size:12px;color:var(--bad-ink)}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:30px;font-weight:800;line-height:1}
.prog{height:12px;background:var(--sunk);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.steps span{padding:4px 10px;border-radius:20px;background:var(--sunk);color:var(--muted);font-weight:700}
.steps span.on{background:var(--brand);color:#fff}
.steps span.done{background:var(--accent-soft);color:var(--accent-ink)}
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.req{color:var(--bad)}
/* modal */
#modal{position:fixed;inset:0;z-index:30;background:rgba(3,12,30,.5);display:flex;justify-content:flex-end}
#modal .sheet{background:var(--bg);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#modal header{display:flex;align-items:center;gap:10px;padding-block:12px;padding-inline:16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
#modal header h3{margin:0;font-size:17px;flex:1;min-width:0}
#modal .body{overflow:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:500;color:var(--ink);cursor:pointer}
.chk input{width:auto;min-height:0}
.rows{display:flex;flex-direction:column;gap:8px}
.rowi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;align-items:end}
.formbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:700;font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{flex:1;min-width:70px;text-align:center;font-size:12px;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.timeline span.done{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.timeline span.cur{background:var(--accent);color:#fff;font-weight:800}
.audit-ch{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kw{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center}
.kw input{width:110px}
@media (max-width:1180px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  #app[data-shell="1"]{grid-template-columns:minmax(0,1fr)}
  #side{display:none}
  #top h1{font-size:16px;flex-basis:100%}
  .asbox{flex:1}
  .asbox select{max-width:none;flex:1}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .fbar .fl{flex:1 1 140px}
  .fbar .fl select,.fbar .fl input{min-width:0;width:100%}
  .fbar .per{flex-basis:100%;margin-inline-start:0}
  #tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #tabbar button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  #tabbar button.on{color:var(--accent-ink);font-weight:800}
  #tabbar svg{width:22px;height:22px}
  #tabbar .dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--warn);color:#2b1600;font-size:10px;border-radius:10px;padding:0 5px;font-weight:800}
  .bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}
}
@media (max-width:420px){.kpis,.kpis.k5{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.fsec{font-size:14px;margin:14px 0 6px;display:flex;align-items:center;gap:6px;color:var(--muted)} .fsec svg{width:16px;height:16px}
.btn svg{width:16px;height:16px;flex:none}
@media (max-width:700px){.fbar .fl{flex:1 1 140px}.fbar .fl select,.fbar .fl input{min-width:0;width:100%}}
/* portal */
.portal{min-height:100%;display:grid;place-items:start center;padding:32px max(16px,env(safe-area-inset-left,0px)) 40px}
.pwrap{width:min(560px,100%)} .pwrap.wide{width:min(900px,100%)}
.ph{font-size:15px;margin:14px 0 8px;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.appc{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:var(--ink);position:relative;min-height:76px}
.appc .ai{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t);flex:none}
.appc .ai svg{width:22px;height:22px}

async function plLoad(rep,month,force){

  PL.key=key;PL.rep=rep;PL.month=month;PL.loading=true;PL.dirty=false;render();

      if(a.error)throw a.error;items=a.data;risks=b.data||[];backlog=c.data||[]}
    const coll=await fetchAll(()=>sb.from('collections').select('voucher_no,coll_date,customer_code,amount,rep_id').eq('active',true).gte('coll_date',m).lte('coll_date',monthEnd(m)));

    Object.assign(PL,{key,rep,month,doc:p||{status:'none',target:+rp?.coll_target||0,new_target:+rp?.new_target||0},items:items.map(i=>({customer_id:i.customer_id,customer_name:i.customer_name,cust_type:i.cust_type,size:i.size,amount:i.amount,probability:i.probability,actual_amount:i.actual_amount??'',notes:i.notes||''})),
      risks:risks.map(r=>({customer_id:r.customer_id,customer_name:r.customer_name,reason:r.reason||''})),backlog:backlog.map(b=>({customer_id:b.customer_id,customer_name:b.customer_name,horizon:b.horizon,value:b.value??''})),coll,dirty:false,errors:{},loadedEmpty:!p});
  }catch(e){toast(errText(e))}finally{PL.loading=false;render()}
}
function plCalcFrom(doc,items,backlog,coll,rep){
  const v=vat();const byCode={};coll.forEach(r=>{byCode[normCode(r.customer_code)]=(byCode[normCode(r.customer_code)]||0)+(+r.amount||0)});
  const used=new Set();
  const rows=items.map(o=>{const amt=+parseNum(o.amount)||0;const ex=amt/v;const pr=+parseNum(o.probability)||0;const prob=Math.min(100,Math.max(0,pr))/100;const net=ex*prob;
    const c=custById(o.customer_id);let auto=0;if(c?.code&&!used.has(normCode(c.code))){auto=byCode[normCode(c.code)]||0;used.add(normCode(c.code))}
    const manual=o.actual_amount!==''&&o.actual_amount!=null&&!isNaN(parseNum(o.actual_amount));const actIn=manual?+parseNum(o.actual_amount):auto;
    return {o,c,amt,ex,prob,net,auto,manual,actIn,actEx:actIn/v,diff:actIn/v-net}});
  let outside=0;coll.forEach(r=>{const k=normCode(r.customer_code);if(used.has(k))return;const c=S.customers.find(x=>normCode(x.code)===k);if((r.rep_id===rep)||(c&&c.rep_id===rep))outside+=+r.amount||0});
  const sum=k=>rows.reduce((s,r)=>s+r[k],0);const target=+parseNum(doc.target)||0;
  const amt=sum('amt'),ex=sum('ex'),net=sum('net'),actIn=sum('actIn')+outside,actEx=actIn/v;
  const b3=backlog.filter(b=>b.horizon==='within3').reduce((s,b)=>s+(+parseNum(b.value)||0),0);
  const pc=+S.settings.pipeCover||1.5,bc=+S.settings.backCover||3;
  const nw=rows.filter(r=>r.o.cust_type==='new');const newCount=nw.filter(r=>r.actIn>0).length;
  return {rows,amt,ex,net,actIn,actEx,outside,target,cover:target?net/target:null,reqNet:target*pc,gapNet:net-target*pc,ach:target?actEx/target:null,diff:actEx-net,b3,reqBack:target*bc,backCover:target?b3/(target*bc):null,
    newCount,newTarget:+parseNum(doc.new_target)||0,newVal:nw.reduce((s,r)=>s+r.actEx,0),oldVal:rows.filter(r=>r.o.cust_type!=='new').reduce((s,r)=>s+r.actEx,0)+outside/v,pc,bc};
}
const plCalc=()=>plCalcFrom(PL.doc,PL.items,PL.backlog,PL.coll,PL.rep);
function plValidate(){
  const errs={};const add=(k,m)=>{(errs[k]=errs[k]||[]).push(m)};
  PL.items.forEach((o,i)=>{if(!String(o.customer_name||'').trim())add('items_'+i,'اسم العميل');if(!o.cust_type)add('items_'+i,'نوع العميل');if(!o.size)add('items_'+i,'حجم العميل');
    const a=parseNum(o.amount);if(a==null||isNaN(a)||a<=0)add('items_'+i,'المبلغ');const p=parseNum(o.probability);if(p==null||isNaN(p)||p<0||p>100)add('items_'+i,'احتمالية التحصيل (0–100)');
    if(o.actual_amount!==''&&o.actual_amount!=null&&(isNaN(parseNum(o.actual_amount))||parseNum(o.actual_amount)<0))add('items_'+i,'الفعلي')});
  const seen={};PL.items.forEach((o,i)=>{const k=o.customer_id||normTxt(o.customer_name);if(!k)return;if(seen[k]!=null)add('items_'+i,`مكرر مع السطر ${seen[k]+1}`);else seen[k]=i});
  PL.risks.forEach((r,i)=>{if(!String(r.customer_name||'').trim())add('risks_'+i,'اسم العميل');if(!String(r.reason||'').trim())add('risks_'+i,'السبب')});
  PL.backlog.forEach((b,i)=>{if(!String(b.customer_name||'').trim())add('backlog_'+i,'اسم العميل');if(b.horizon==='within3'&&(parseNum(b.value)==null||isNaN(parseNum(b.value))))add('backlog_'+i,'قيمة المشروع')});
  if(isNaN(parseNum(PL.doc.target))||parseNum(PL.doc.target)<0)add('head','التارجت');
  PL.errors=errs;return !Object.keys(errs).length;
}
async function plSave(status){
  if(!plValidate()){render();toast('أكمل الحقول المطلوبة المعلّمة باللون الأحمر قبل الحفظ');return}
  if(status==='submitted'&&!PL.items.length){toast('أضف عميلاً واحداً على الأقل قبل الإرسال');return}
  const n=v=>{const x=parseNum(v);return x==null||isNaN(x)?null:x};
  const payload={p_rep:PL.rep,p_month:PL.month+'-01',p_target:plIsReviewer()?n(PL.doc.target):null,p_new_target:plIsReviewer()?Math.round(n(PL.doc.new_target)||0):null,
    p_items:PL.items.map(o=>({customer_id:o.customer_id||'',customer_name:String(o.customer_name).trim(),cust_type:o.cust_type,size:o.size,amount:n(o.amount),probability:n(o.probability),actual_amount:n(o.actual_amount)??'',notes:o.notes||''})),
    p_risks:PL.risks.map(r=>({customer_id:r.customer_id||'',customer_name:String(r.customer_name).trim(),reason:r.reason})),
    p_backlog:PL.backlog.map(b=>({customer_id:b.customer_id||'',customer_name:String(b.customer_name).trim(),horizon:b.horizon,value:n(b.value)??''})),p_status:status||null,p_source:null};
  if(PL.doc.status==='none'&&!plIsReviewer()){payload.p_target=n(PL.doc.target);payload.p_new_target=Math.round(n(PL.doc.new_target)||0)}
  const {error}=await sb.rpc('save_pipeline',payload);
  if(error){toast(errText(error));return}
  toast(status==='submitted'?'تم إرسال البايب لاين للمشرف للاعتماد':'تم حفظ البايب لاين');UI.sumKey='';await plLoad(PL.rep,PL.month,true);
}

let IMP={step:'pick'};
function autoMap(headers,fields){const map={},used=new Set();const nh=headers.map(h=>[h,normTxt(h)]);
  fields.forEach(f=>{const syn=f[3].map(normTxt);const hit=nh.find(([h,n])=>!used.has(h)&&syn.includes(n));if(hit){map[f[0]]=hit[0];used.add(hit[0])}});
  fields.forEach(f=>{if(map[f[0]])return;const syn=f[3].map(normTxt).filter(s=>s.length>=4);const hit=nh.find(([h,n])=>!used.has(h)&&syn.some(s=>n.includes(s)));if(hit){map[f[0]]=hit[0];used.add(hit[0])}});return map}
const repByTxt=v=>{const n=normTxt(v);if(!n)return null;return S.profiles.find(p=>p.role==='rep'&&(normTxt(p.rep_code)===n||normTxt(p.full_name)===n))||null};
const regionByTxt=v=>{const n=normTxt(v);if(!n)return '';const r=S.regions.find(x=>normTxt(x.name_ar)===n||normTxt(x.name_en)===n||x.id===n||normTxt(x.name_ar).includes(n));return r?r.id:null};
const typeByTxt=v=>{const n=normTxt(v);return !n?'':/جديد|new/.test(n)?'new':/قديم|old|existing/.test(n)?'old':null};
const sizeByTxt=v=>{const n=normTxt(v);return !n?'':/كبير|large|big/.test(n)?'large':/متوسط|medium/.test(n)?'medium':/صغير|small/.test(n)?'small':null};
async function readSheetRows(file){if(!window.XLSX)throw new Error('مكتبة Excel غير محملة');const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});return wb}
async function impFile(file){
  try{const wb=await readSheetRows(file);
    if(F.impTab==='pipeline'){return plWorkbook(wb,file.name)}
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}).filter(r=>Object.values(r).some(v=>String(v??'').trim()!==''));
    if(!rows.length)return toast('الملف لا يحتوي صفوف بيانات');
    const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(h=>!/^__EMPTY/.test(h));
    IMP={step:'map',file:file.name,rows,headers,map:autoMap(headers,IMP_FIELDS[F.impTab]),hash:fnv(JSON.stringify(rows))};render();
  }catch(e){toast(errText(e))}
}
async function impValidate(){
  const type=F.impTab,fields=IMP_FIELDS[type];const g=(r,k)=>{const h=IMP.map[k];const v=h?r[h]:'';return typeof v==='string'?v.trim():v};
  const items=[];const seen=new Map();
  let existing=new Set();
  if(type==='collections'){const vs=[...new Set(IMP.rows.map(r=>normCode(g(r,'voucher'))).filter(Boolean))];for(let i=0;i<vs.length;i+=200){const {data,error}=await sb.from('collections').select('voucher_no').eq('active',true).in('voucher_no',vs.slice(i,i+200));if(error)return toast(errText(error));data.forEach(d=>existing.add(normCode(d.voucher_no)))}}
  IMP.rows.forEach((r,i)=>{const it={row:i+2,status:'ok',reason:''};items.push(it);const rej=m=>{it.status='rej';it.reason=m};
    const miss=fields.filter(f=>f[2]&&(g(r,f[0])===''||g(r,f[0])==null)).map(f=>f[1]);if(miss.length)return rej('حقول إلزامية فارغة: '+miss.join('، '));
    if(type==='customers'){const code=normCode(g(r,'code'));if(seen.has(code)){it.status='dup';it.reason='كود مكرر داخل الملف (السطر '+seen.get(code)+')';return}seen.set(code,it.row);
      const reg=IMP.map.region?regionByTxt(g(r,'region')):'';if(reg===null)return rej('منطقة غير معروفة: '+g(r,'region'));
      let rep=null;if(IMP.map.rep&&g(r,'rep')!==''){rep=repByTxt(g(r,'rep'));if(!rep)return rej('مندوب غير مسجل في النظام: '+g(r,'rep'))}
      const ty=IMP.map.type?typeByTxt(g(r,'type')):'';if(ty===null)return rej('نوع غير معروف: '+g(r,'type'));const sz=IMP.map.size?sizeByTxt(g(r,'size')):'';if(sz===null)return rej('حجم غير معروف: '+g(r,'size'));
      let hist='';if(IMP.map.hist&&g(r,'hist')!==''){hist=parseNum(g(r,'hist'));if(isNaN(hist))return rej('قيمة غير رقمية')}
      let lt='';if(IMP.map.lastTx&&g(r,'lastTx')!==''){lt=parseDate(g(r,'lastTx'));if(!lt||lt!==lt)return rej('تاريخ غير صالح')}
      const ex=S.customers.find(c=>normCode(c.code)===code);it.status=ex?'update':'new';
      it.data={code,name:String(g(r,'name')).trim(),region_id:reg||'',rep_id:rep?.id||'',cust_type:ty||'',size:sz||'',category:IMP.map.category?String(g(r,'category')||''):'',phone:IMP.map.phone?String(g(r,'phone')||''):'',hist_value:hist===''?'':hist,last_tx_date:lt||''};
    }else{const v=normCode(g(r,'voucher'));if(seen.has(v)){it.status='dup';it.reason='سند مكرر داخل الملف (السطر '+seen.get(v)+')';return}seen.set(v,it.row);
      if(existing.has(v)){it.status='dup';it.reason='السند مستورد سابقاً';return}
      const a=parseNum(g(r,'amount'));if(!(a>0))return rej('المبلغ يجب أن يكون أكبر من صفر');const d=parseDate(g(r,'date'));if(!d||d!==d)return rej('تاريخ غير صالح: '+g(r,'date'));if(d>TODAY())return rej('تاريخ في المستقبل');
      if(IMP.from&&d<IMP.from||IMP.to&&d>IMP.to)return rej('خارج الفترة المختارة');
      let rep=null;if(IMP.map.rep&&g(r,'rep')!=='')rep=repByTxt(g(r,'rep'));
      const code=normCode(g(r,'code'));const c=S.customers.find(x=>normCode(x.code)===code);if(!c){it.status='unmatched';it.reason='كود العميل غير موجود — يُحفظ ويُطابق عند إضافة العميل'}
      it.data={voucher_no:v,coll_date:d,customer_code:code,customer_name:String(g(r,'name')||c?.name||''),amount:a,rep_id:rep?.id||'',invoice_ref:String(g(r,'inv')||''),payment_method:String(g(r,'pm')||'')};it.amount=a}
  });
  IMP.items=items;IMP.step='review';render();
}

/* --- pipeline workbook (one sheet per rep, same layout as the team's file) --- */
function plParseSheet(rows,sn){
  const cell=(r,c)=>rows[r]?.[c];const txt=(r,c)=>String(cell(r,c)??'').trim();
  const findLab=lab=>{for(let r=0;r<10;r++)for(let c=0;c<6;c++)if(normTxt(cell(r,c)).startsWith(lab))return r;return -1};
  const rr=findLab('اسمالمندوب');if(rr<0)return null;
  const val=r=>{for(let c=2;c<8;c++){const v=cell(r,c);if(v!==''&&v!=null)return v}return ''};
  const repName=String(val(rr)).trim();const mr=findLab('الشهر');let mi=0,year='';
  if(mr>=0)for(let c=2;c<8;c++){const v=cell(mr,c);const n=normTxt(v);const k=AR_MONTHS.findIndex(m=>normTxt(m)===n||n.startsWith(normTxt(m)));if(k>=0&&!mi)mi=k+1;if(/^\d{4}$/.test(String(v).trim()))year=String(v).trim();if(v instanceof Date){mi=v.getMonth()+1;year=String(v.getFullYear())}}
  const tr=findLab('التارجت');const target=tr>=0?parseNum(val(tr)):0;
  let hr=-1;for(let r=0;r<20;r++)if(normTxt(cell(r,1)).startsWith('اسمالعميل')){hr=r;break}if(hr<0)return null;
  const items=[],risks=[],backlog=[];
  for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[];if(row.some(v=>{const n=normTxt(v);return n.includes('نسبهالتحقيق')||n==='البيان'}))break;

        S.allPagesLoaded=false;await reloadProfiles();await loadAllPages();if(uid===S.me.id)await loadBase();closeModal();render();

function closeModal(){document.getElementById('modal').hidden=true}
function askText(title,label,cb,required){openModal(title,`<form id="askF"><div class="fld"><label for="ask_t">${label}</label><textarea id="ask_t"></textarea></div><div id="ask_e" class="flag"></div><div class="formbar"><button type="button" class="btn" data-act="closeModal">إلغاء</button><button class="btn p" type="submit">تأكيد</button></div></form>`,b=>b.querySelector('#askF').addEventListener('submit',e=>{e.preventDefault();const v=b.querySelector('#ask_t').value.trim();if(required&&!v){b.querySelector('#ask_e').textContent='هذا الحقل مطلوب';return}closeModal();cb(v)}))}
/* events */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='authForm')return;e.preventDefault();AUTH_EXT=true;const g=id=>document.getElementById(id)?.value.trim();
  AUTH.busy=true;AUTH.msg='';

    if(AUTH.adminExists===false){const name=g('au_name'),email=g('au_email'),pass=document.getElementById('au_pass').value;
      if(!name||!email||pass.length<8){AUTH.msg='أدخل الاسم والبريد وكلمة مرور من 8 أحرف على الأقل';return}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});if(error)throw error;
      if(!data.session){AUTH.msg='تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';AUTH.adminExists=true}}
    else{const u=(g('au_user')||'').toLowerCase(),pw=document.getElementById('au_pass').value;AUTH.lastUser=u;if(!u||!pw){AUTH.msg='أدخل اسم المستخدم وكلمة المرور';return}
      const r=await fetch(SUPABASE_URL+'/functions/v1/login',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({username:u,password:pw})});

const fnum=v=>(v===null||v===undefined||v==='')?0:Number(v)||0;

  if(v.type==='ونش'){if(fnum(c.trailer.one)>0)a+=fnum(d.u1)/fnum(c.trailer.one);if(fnum(c.trailer.two)>0)a+=fnum(d.u2)/fnum(c.trailer.two)}return a}

async function giFile(file){try{const wb=await readSheetRows(file);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}).filter(r=>Object.values(r).some(v=>String(v??'').trim()!==''));
  if(!rows.length)return toast('الملف لا يحتوي صفوف بيانات');const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(h=>!/^__EMPTY/.test(h));
  let map=null,rem=false;try{map=JSON.parse(localStorage.getItem(gMapKey(GI.key,headers))||'null');rem=!!map}catch(e){}
  if(GI.key.startsWith('fleet:')&&!FL.loaded)await flBase();
  GI={...GI,step:'map',file:file.name,rows,headers,map:map||autoMap(headers,gFields(GI.key)),remembered:rem};render()}catch(e){toast(errText(e))}}
async function giValidate(){const D=GDEF[GI.key];try{localStorage.setItem(gMapKey(GI.key,GI.headers),JSON.stringify(GI.map))}catch(e){}
  if(GI.key==='fleet:days'){FL.range='';const ds=GI.rows.map(r=>dateOrNull(r[GI.map.date])).filter(x=>typeof x==='string').sort();if(ds.length){const a=ds[0],b=ds[ds.length-1];const d=await fetchAll(()=>sb.from('fleet_days').select('vehicle_id,day').gte('day',a).lte('day',b));d.forEach(x=>{if(!FL.days[x.vehicle_id+'|'+x.day])FL.days[x.vehicle_id+'|'+x.day]=x})}}
  const fields=gFields(GI.key);const seen=new Map();
  GI.items=GI.rows.map((r,i)=>{const g=k=>{const h=GI.map[k];const v=h?r[h]:'';return typeof v==='string'?v.trim():v??''};const it={row:i+2,status:'ok'};
    const miss=fields.filter(f=>f[2]&&(g(f[0])===''||g(f[0])==null)).map(f=>f[1]);if(miss.length)return {...it,status:'rej',reason:'حقول إلزامية فارغة: '+miss.join('، ')};
    let x;try{x=D.row(g)}catch(e){x={rej:e.message}}if(x.rej)return {...it,status:'rej',reason:x.rej};
    if(seen.has(x.key))return {...it,status:'dup',reason:'مكرر مع السطر '+seen.get(x.key)};seen.set(x.key,it.row);return {...it,...x}});
  GI.step='review';render()}
async function giRun(){const ok=GI.items.filter(i=>['new','update','ok'].includes(i.status));const btn=document.querySelector('[data-act="giRun"]');if(btn){btn.disabled=true;btn.textContent='جارٍ الحفظ…'}
  try{const res=await GDEF[GI.key].run(ok);GI={...GI,step:'done',result:res};toast('اكتمل الاستيراد');render()}catch(e){toast(e.message||errText(e));if(btn){btn.disabled=false;btn.textContent='تأكيد الاستيراد'}}}
function giTemplate(){if(!window.XLSX)return toast('مكتبة Excel غير محملة');const f=gFields(GI.key);const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};wbAdd(wb,[f.map(x=>x[1].replace(/ \(.*\)$/,''))],'البيانات',f.map(()=>18));downloadBlob(`قالب-${GDEF[GI.key].label}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))}
V.fleet_import=()=>{if(!FL.loaded){const w=flEnsure();if(w)return w}return gimpView('fleet')};

Object.assign(ACT,{giTab:d=>{GI={step:'pick',key:d.k};render()},giReset:()=>{GI={step:'pick',key:GI.key};render()},giBack:()=>{GI.step='map';render()},giValidate:()=>giValidate(),giRun:()=>giRun(),giTemplate:()=>giTemplate()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='giFile'){const f=t.files[0];t.value='';if(f)giFile(f);return}if(t.dataset.gimap){GI.map[t.dataset.gimap]=t.value;render()}});
